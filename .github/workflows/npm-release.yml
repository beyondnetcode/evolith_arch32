name: npm Release (all packages)

# Publishes EVERY public workspace to npm, in dependency order, with provenance.
#
# WHY THIS WORKFLOW EXISTS
# ------------------------
# Until now there was no automated path to publish seven of the eight public
# packages. `sdk-cli-release.yml` publishes `src/sdk/cli` and nothing else, and
# `ci-cd.yml`'s `publish-npm` published the same directory again with `--tag beta`
# and no provenance. Everything else — including `@beyondnet/evolith-mcp`, which
# carries the 2026-07-23 security wave — was published by hand from a developer
# machine. That is why all eight versions on the registry have no
# `dist.attestations`. See GT-570.
#
# SAFETY MODEL
# ------------
# Publishing is irreversible: npm forbids unpublishing after 72 hours. So:
#   * `dry_run` defaults to TRUE. The default invocation exercises the whole path
#     — resolve, build, pack, verify — and publishes nothing. The audit's finding
#     was that this path had never run end to end; a rehearsable mode is how it
#     stops being true without betting a registry version on the first attempt.
#   * The plan is computed by `.harness/scripts/release/plan-npm-release.mjs`,
#     which has its own unit tests including a negative case, and is printed in
#     full before anything is published.
#   * A package whose exact version already exists on the registry is SKIPPED, so
#     a partial failure is resumable without republishing.
#   * The run fails if the planner resolves zero packages. An empty release that
#     reports success is the defect this repository keeps finding in its guards.
#   * The token reaches npm through `NODE_AUTH_TOKEN`, never `npm config set`,
#     so it is not written into a `.npmrc` on the runner.

concurrency:
  group: npm-release
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rehearse without publishing. Leave true unless you intend to ship.'
        type: boolean
        required: true
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for npm provenance

env:
  NODE_VERSION: '20'

jobs:
  release:
    name: Publish workspaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Planner self-test
        # The planner decides what gets published. It is tested before it is
        # trusted, on the same runner, against the same checkout.
        run: node --test .harness/scripts/release/plan-npm-release.test.mjs

      - name: Resolve the release plan
        id: plan
        run: |
          node .harness/scripts/release/plan-npm-release.mjs
          node .harness/scripts/release/plan-npm-release.mjs --json > /tmp/plan.json
          echo "count=$(jq '.toPublish | length' /tmp/plan.json)" >> "$GITHUB_OUTPUT"
          echo "denominator=$(jq '.denominator' /tmp/plan.json)" >> "$GITHUB_OUTPUT"

      - name: Build every workspace
        # Built in dependency order by `tsc -b`. Seven of the eight packages have
        # no `prepublishOnly`, so `npm publish` would otherwise ship whatever
        # happens to be in dist/ — here dist/ is always produced by this run.
        run: npm run build

      - name: Compile the OPA policy bundle
        # `src/rulesets/opa/policy.wasm` is gitignored (root .gitignore:154), so a fresh
        # runner checkout does not have it. Nothing in the publish path compiled it:
        # `prepublishOnly` runs copy-rulesets/build/copy-assets/drift/smoke and none of
        # those produce a bundle. `copy-rulesets` then faithfully copied the 87 `.rego`
        # SOURCES it could see and no wasm, because there was no wasm to see.
        #
        # That is why @beyondnet/evolith-cli@1.2.2 ships 87 .rego files and zero
        # policy.wasm, and why `validate --engine opa` fails closed on every rule from a
        # clean install. It is invisible locally: a maintainer who has ever run
        # `build:policy` has the artifact sitting in the ignored path, so `npm pack`
        # includes it and the tarball looks correct on their machine.
        run: |
          npm run build:policy
          test -f src/rulesets/opa/policy.wasm
          echo "policy.wasm: $(wc -c < src/rulesets/opa/policy.wasm) bytes"

      - name: Rebuild mcp-server from a clean state
        # `nest build` exits 0 while emitting nothing when tsconfig.tsbuildinfo is
        # stale, which has produced an empty dist more than once. Cheap insurance
        # against publishing an empty package.
        run: |
          rm -f src/packages/mcp-server/tsconfig.tsbuildinfo
          npm run build --workspace @beyondnet/evolith-contracts
          npm run build --workspace @beyondnet/evolith-mcp
          test -f src/packages/mcp-server/dist/main.js

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'push' && 'false' || inputs.dry_run }}
        run: |
          set -euo pipefail
          COUNT=$(jq '.toPublish | length' /tmp/plan.json)
          DENOM=$(jq '.denominator' /tmp/plan.json)

          if [ "$DENOM" -eq 0 ]; then
            echo "::error::the planner resolved zero packages — refusing to report a vacuous success"
            exit 1
          fi

          if [ "$COUNT" -eq 0 ]; then
            echo "Nothing to publish: all $DENOM package versions are already on the registry."
            exit 0
          fi

          echo "Publishing $COUNT of $DENOM package(s). DRY_RUN=$DRY_RUN"
          FAILED=0
          for i in $(seq 0 $((COUNT - 1))); do
            NAME=$(jq -r ".toPublish[$i].name" /tmp/plan.json)
            VERSION=$(jq -r ".toPublish[$i].version" /tmp/plan.json)
            DIR=$(jq -r ".toPublish[$i].dir" /tmp/plan.json)

            echo "::group::$NAME@$VERSION ($DIR)"

            # GT-625 — the gate that would have stopped 1.2.0.
            #
            # Pack this package and install it into a directory that has never seen
            # this workspace, so every `@beyondnet/*` sibling is pulled from the
            # REGISTRY, and then resolve every specifier its shipped `dist` imports.
            # That is the one question no offline check can answer: a subpath can
            # exist in the local sibling and not in the version the declared range
            # resolves to publicly. `evolith-cli@1.2.0` shipped exactly that way and
            # could not print its own `--version` on any machine but ours.
            #
            # Placement matters. This runs INSIDE the publish loop, immediately
            # before each `npm publish`, because the loop is in dependency order: by
            # the time a package's turn comes, everything it depends on is already
            # on the registry, so the question is answerable and the answer is the
            # one a user will get. Running it earlier — in PR CI, or in one pass
            # before the loop — would ask about dependencies that do not exist yet
            # and fail every legitimate version bump. An unsatisfiable gate gets
            # deleted, and this one is worth keeping.
            #
            # npm forbids unpublishing after 72 hours, so the only useful place for
            # this check is before the irreversible step.
            if [ "$DRY_RUN" = "true" ]; then
              # A dry run publishes nothing, so by the time it reaches a consumer the
              # sibling it depends on is still absent from the registry and the
              # question this check asks has no answer. Say that, loudly, rather than
              # skip it silently: a green dry run must not be read as "installable".
              echo "::warning::install smoke SKIPPED for $NAME — a dry run publishes nothing, so cross-package resolution cannot be verified. A green dry run does NOT mean the artifact installs."
            else
              echo "-- clean-room install smoke (GT-625)"
              node src/sdk/cli/scripts/check-install-smoke.mjs --pkg "$DIR"
            fi

            # THE TARBALL MUST CONTAIN THE ENTRY POINTS ITS OWN MANIFEST PROMISES.
            #
            # The dry run below does report the packlist, and the claim used to be that a
            # shipping mistake "surfaces here". It surfaced and nobody was looking: run
            # 31980661007 printed `total files: 583` for @beyondnet/evolith-mcp@1.3.2 with
            # ZERO of them under dist/, plus two `npm warn ... No bin file found at
            # dist/main.js`, and the job went green. Reporting is not asserting. A log line
            # no step fails on is decoration.
            #
            # This reads the packlist and fails when `main` or any `bin` target is absent,
            # which is the narrowest question that would have caught it, and is general
            # enough to catch the next mechanism rather than only this one.
            echo "-- packlist assertion"
            ( cd "$DIR" && npm pack --dry-run --json > /tmp/packlist.json )
            PACKED=$(jq -r '.[0].files[].path' /tmp/packlist.json)
            PROMISED=$(node -p "const p=require('$(pwd)/$DIR/package.json'); [...new Set([p.main, ...Object.values(p.bin || {})].filter(Boolean).map(s => s.replace(/^\.\//, '')))].join('\n')")
            echo "   $(echo "$PACKED" | grep -c .) file(s) packed; entry points declared: $(echo "$PROMISED" | tr '\n' ' ')"
            MISSING=""
            for f in $PROMISED; do
              echo "$PACKED" | grep -qxF "$f" || MISSING="$MISSING $f"
            done
            if [ -n "$MISSING" ]; then
              echo "::error::$NAME@$VERSION would publish WITHOUT:$MISSING — the tarball does not contain the entry points its own package.json declares. Publishing it would put a package on the registry that cannot be required or executed."
              exit 1
            fi

            if [ "$DRY_RUN" = "true" ]; then
              ( cd "$DIR" && npm publish --dry-run --provenance --access public )
            else
              if ( cd "$DIR" && npm publish --provenance --access public ); then
                # Verify against the registry rather than trusting the exit code.
                for attempt in 1 2 3 4 5; do
                  if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
                    echo "confirmed on registry: $NAME@$VERSION"; break
                  fi
                  [ "$attempt" -eq 5 ] && { echo "::error::$NAME@$VERSION not visible on the registry after publish"; FAILED=1; }
                  sleep 10
                done
              else
                # Fail fast: a consumer published against a missing dependency is
                # worse than a partial release, and the run is resumable.
                echo "::error::publish failed for $NAME@$VERSION — stopping before its consumers"
                exit 1
              fi
            fi
            echo "::endgroup::"
          done

          [ "$FAILED" -eq 0 ] || exit 1

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN — nothing was published. Re-run with dry_run=false to ship."
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### npm release"
            echo ""
            echo "- planner denominator: **${{ steps.plan.outputs.denominator }}** publishable package(s)"
            echo "- selected to publish: **${{ steps.plan.outputs.count }}**"
            echo "- dry run: **${{ github.event_name == 'push' && 'false' || inputs.dry_run }}**"
            echo ""
            echo '```json'
            cat /tmp/plan.json 2>/dev/null | jq . || echo '{}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # MCP registry (registry.modelcontextprotocol.io)
  #
  # Runs only on a tag push, and only after `publish` succeeded: the registry
  # VERIFIES OWNERSHIP by fetching registry.npmjs.org/<pkg>/<version> and reading
  # a top-level `mcpName` out of THAT version's document. Publishing here before
  # npm has the version, or against a version whose tarball predates the mcpName
  # field, fails with "NPM package is missing required 'mcpName' field".
  #
  # Auth is OIDC, not a secret: `mcp-publisher login github-oidc` exchanges the
  # Actions token for a namespace grant on io.github.<repository_owner>/*, which
  # for this repository is io.github.beyondnetcode/*. The interactive
  # `login github` device flow is the thing this job exists to avoid.
  #
  # A published version is IMMUTABLE. Re-running this job for a version already
  # in the registry is a no-op-by-failure, not a silent overwrite, so the step is
  # allowed to fail without failing the release.
  # ---------------------------------------------------------------------------
  publish-mcp-registry:
    name: Publish to the MCP registry
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin mcp-publisher
          mcp-publisher --version

      # server.json duplicates a version that package.json already owns, and a duplicated fact
      # drifts. It drifted within hours of being written: a parallel patch bump moved
      # package.json to 1.3.2 and left server.json at 1.3.1. Nothing caught it, because the
      # mcpName assertion below reads package.json while `mcp-publisher` reads server.json --
      # so the step that was supposed to be the gate was verifying a different version than the
      # one about to be published. Assert all three agree BEFORE either runs.
      - name: server.json must declare the version that package.json publishes
        working-directory: src/packages/mcp-server
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          SRV=$(node -p "require('./server.json').version")
          SRVPKG=$(node -p "require('./server.json').packages[0].version")
          echo "package.json=${PKG}  server.json=${SRV}  server.json packages[0]=${SRVPKG}"
          if [ "$SRV" != "$PKG" ] || [ "$SRVPKG" != "$PKG" ]; then
            echo "::error file=src/packages/mcp-server/server.json::server.json declares ${SRV} (packages[0] ${SRVPKG}) but package.json publishes ${PKG}. The registry listing would advertise a version npm does not hold. Set both server.json versions to ${PKG}."
            exit 1
          fi

      - name: The published npm version must already carry mcpName
        working-directory: src/packages/mcp-server
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED=$(node -p "require('./package.json').mcpName")
          PUBLISHED=$(curl -fsSL "https://registry.npmjs.org/@beyondnet/evolith-mcp/${VERSION}" | jq -r '.mcpName // "ABSENT"')
          echo "version=${VERSION} expected=${EXPECTED} published=${PUBLISHED}"
          if [ "$PUBLISHED" != "$EXPECTED" ]; then
            echo "::error::npm @beyondnet/evolith-mcp@${VERSION} reports mcpName='${PUBLISHED}', expected '${EXPECTED}'. The registry reads this from the VERSION document, so publishing would be rejected."
            exit 1
          fi

      - name: Validate server.json against the published schema
        working-directory: src/packages/mcp-server
        run: mcp-publisher validate

      - name: Publish
        working-directory: src/packages/mcp-server
        continue-on-error: true
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish

      - name: Confirm the listing resolves
        run: |
          sleep 15
          curl -fsS 'https://registry.modelcontextprotocol.io/v0/servers?search=evolith' \
            | jq -r '.servers[]? | "\(.name)  \(.version)"' || echo "not listed yet"
