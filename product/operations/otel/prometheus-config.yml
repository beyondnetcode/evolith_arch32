global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  # GT-545: scrape the THREE real Evolith services on :3000 (was a single wrong `bff:8000`
  # target). /metrics is fail-closed on all three (core-api GT-393, mcp + agent-runtime
  # GT-549), so each job sends the shared API key as a Bearer credential. In k8s prefer a
  # ServiceMonitor with the credential from a secret; the token below is the local dev key.
  - job_name: 'core-api'
    metrics_path: '/metrics'
    authorization:
      credentials: local-dev-key
    static_configs:
      - targets: ['core-api:3000']
        labels: { service: 'core-api', environment: 'development' }

  - job_name: 'mcp'
    metrics_path: '/metrics'
    authorization:
      credentials: local-dev-key
    static_configs:
      - targets: ['mcp:3000']
        labels: { service: 'mcp', environment: 'development' }

  - job_name: 'agent-runtime'
    metrics_path: '/metrics'
    authorization:
      credentials: local-dev-key
    static_configs:
      - targets: ['agent-runtime:3000']
        labels: { service: 'agent-runtime', environment: 'development' }

  # GT-551: scrape the OPA sidecar so policy-decision reliability is observable.
  # OPA serves Prometheus metrics at /metrics on its main server port (8181) — no
  # extra flag needed; the chart now exposes it as the `opa-metrics` service port.
  # The job name MUST stay `opa`: the OpaEvaluationFailure rule scopes on
  # {job="opa"} so it can never match our own `evolith_http_*` series.
  # OPA's endpoint is unauthenticated (pod/cluster-internal), hence no credentials.
  # In k8s prefer a ServiceMonitor selecting the `opa-metrics` port.
  # CAVEAT: OPA ships as a k8s sidecar (evolith-mcp chart), so this target resolves
  # in-cluster via that service port. The runnable docker-compose stack does not run
  # OPA yet, so there the target stays down until it is added (GT-547).
  - job_name: 'opa'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['mcp:8181']
        labels: { service: 'opa', environment: 'development' }

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
        labels:
          service: 'otel-collector'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
