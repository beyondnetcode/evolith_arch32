# Local Kubernetes (Docker Desktop / kind) overrides for evolith-agent-runtime.
#
# Two ways to reach it, and they are not interchangeable:
#
#   FROM ANOTHER CLUSTER (the Tracker) — http://<cluster>-control-plane:30082
#   FROM THIS MACHINE, ad hoc          — kubectl -n evolith-local port-forward svc/<release>-evolith-agent-runtime 8082:80
#                                        or http://localhost:30082 on a kind cluster built with core-cluster.yaml
#
# The cross-cluster one is why `service.type` is NodePort here: a port-forward is
# a host process that dies on every rollout, so it cannot be what a separate
# cluster is configured against.
image:
  repository: evolith-agent-runtime
  tag: local2
  pullPolicy: IfNotPresent

replicaCount: 1

# GT-438 (local kind): govern over the REAL stateless Core in the cluster (not the stub).
# The agent-runtime calls core-api POST /api/v1/evaluate over the in-cluster service, with
# the shared local API key. AGENT_RUNTIME_CORE_ENDPOINT must be the FULL evaluate URL.
extraEnv:
  AGENT_RUNTIME_CORE_ENDPOINT: "http://evolith-core-api-evolith-core-api/api/v1/evaluate"
  AGENT_RUNTIME_CORE_TOKEN: "local-dev-key"
  AGENT_RUNTIME_AUDIT_DIR: "/tmp/audit"

ingressRoute:
  enabled: false

horizontalPodAutoscaler:
  enabled: false

podDisruptionBudget:
  enabled: false

networkPolicy:
  enabled: false

service:
  type: NodePort
  nodePort: 30082
