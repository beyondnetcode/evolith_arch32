apiVersion: v1
kind: Service
metadata:
  name: {{ include "evolith-mcp.fullname" . }}
  labels:
    app: {{ include "evolith-mcp.name" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      # PINNED. An unpinned NodePort is allocated at random from 30000-32767 and
      # changes on reinstall, so anything configured against it breaks — which is
      # the failure a stable cross-cluster address exists to prevent.
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
    {{- if .Values.opa.enabled }}
    # GT-551: expose the OPA sidecar's HTTP port so Prometheus can reach its
    # /metrics endpoint. Without this the sidecar is pod-local only and
    # policy-decision reliability is unobservable from outside the pod.
    - port: 8181
      targetPort: opa-http
      protocol: TCP
      name: opa-metrics
    {{- end }}
  selector:
    app: {{ include "evolith-mcp.name" . }}
