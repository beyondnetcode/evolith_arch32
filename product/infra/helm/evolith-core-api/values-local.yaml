# Local Kubernetes (Docker Desktop) overrides for evolith-core-api.
# Use the locally-built image, skip Traefik/IngressRoute and cluster-only addons.
# Reach the service with: kubectl -n evolith-local port-forward svc/<release>-evolith-core-api 8080:80
image:
  repository: evolith-core-api
  tag: local2
  pullPolicy: IfNotPresent

replicaCount: 1

ingressRoute:
  enabled: false

horizontalPodAutoscaler:
  enabled: false

podDisruptionBudget:
  enabled: false

networkPolicy:
  enabled: false
