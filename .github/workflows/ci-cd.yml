name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/cli/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: sdk/cli

      - name: Run tests
        run: npm test
        working-directory: sdk/cli

      - name: Build
        run: npm run build
        working-directory: sdk/cli

  publish-npm:
    name: Publish npm
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/cli/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: sdk/cli

      - name: Publish to npm
        if: contains(github.event.head_commit.message, 'bump version')
        run: npm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }} && npm publish --access public --tag beta
        working-directory: sdk/cli

  docker:
    name: Build & Push Docker
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./sdk/cli
          file: ./sdk/cli/Dockerfile
          push: true
          tags: |
            beyondnetperu/evolith-cli:latest
            beyondnetperu/evolith-cli:${{ github.sha }}