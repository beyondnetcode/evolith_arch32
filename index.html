itle":"product · engineering · QA · security · operations","status":{"maturity":null,"qualifier":{"en":"people, not a product","es":"personas, no un producto"},"asOf":"2026-09-19","source":"src/packages/core-domain/src/domain/authority-policy.ts:52-91"},"summary":{"executive":{"en":"Product, engineering, QA, security and operations — the only actors who can accept, promote, ratify, waive or enforce.","es":"Producto, ingeniería, QA, seguridad y operaciones: los únicos actores que pueden aceptar, promover, ratificar, eximir o hacer cumplir."},"architect":{"en":"Product, engineering, QA, security and operations — the only actors who can accept, promote, ratify, waive or enforce. ADR-0116 makes the boundary executable: actors of kind human, custodian or board hold those five verbs; agent, engine and ci may only observe, recommend, attach evidence or draft a candidate.","es":"Producto, ingeniería, QA, seguridad y operaciones: los únicos actores que pueden aceptar, promover, ratificar, eximir o hacer cumplir. ADR-0116 hace ejecutable la frontera: los actores de tipo human, custodian o board tienen esos cinco verbos; agent, engine y ci solo pueden observar, recomendar, adjuntar evidencia o redactar un borrador."},"engineer":{"en":"Product, engineering, QA, security and operations — the only actors who can accept, promote, ratify, waive or enforce. `authority-policy.ts:52-91` encodes the matrix: `human | custodian | board` → `accept · promote · ratify · waive · enforce`; `agent | engine | ci` → `observe · recommend · attach-evidence · draft-candidate`. A human reaches the engine through the CLI (`npx -y @beyondnet/evolith-cli validate --engine opa`) and drives state through the Tracker web UI.","es":"Producto, ingeniería, QA, seguridad y operaciones: los únicos actores que pueden aceptar, promover, ratificar, eximir o hacer cumplir. `authority-policy.ts:52-91` codifica la matriz: `human | custodian | board` → `accept · promote · ratify · waive · enforce`; `agent | engine | it 0 · 1 · 2 · 3).","es":"Un pull request ejecuta las mismas reglas; un pipeline verde nunca puede avanzar una fase por sí solo (exit 0 · 1 · 2 · 3)."},"architect":{"en":"A pull request runs the same rules; a green pipeline can never advance a phase by itself (exit 0 · 1 · 2 · 3). CI is an actor of kind `ci` under ADR-0116: it may observe and attach evidence, never accept or promote; the gate decision stays with the Tracker or with a person.","es":"Un pull request ejecuta las mismas reglas; un pipeline verde nunca puede avanzar una fase por sí solo (exit 0 · 1 · 2 · 3). CI es un actor de tipo `ci` según ADR-0116: puede observar y adjuntar evidencia, nunca aceptar ni promover; la decisión de compuerta se queda en el Tracker o en una persona."},"engineer":{"en":"A pull request runs the same rules; a green pipeline can never advance a phase by itself (exit 0 · 1 · 2 · 3). `uses: beyondnetcode/evolith_arch32@v1` with `fail-on-violation: true` runs `evolith validate`; exit `1` and `3` mean not evaluated and the job summary prints \"Not evaluated\" in words; `requester.actorType: ci` travels inside the EvaluationContext.","es":"Un pull request ejecuta las mismas reglas; un pipeline verde nunca puede avanzar una fase por sí solo (exit 0 · 1 · 2 · 3). `uses: beyondnetcode/evolith_arch32@v1` con `fail-on-violation: true` ejecuta `evolith validate`; exit `1` y `3` significan no evaluado y el resumen del job imprime «Not evaluated» en palabras; `requester.actorType: ci` viaja dentro del EvaluationContext."}},"facts":[{"text":{"en":"Exit codes: 0 pass · 1 tool failed (no verdict) · 2 gate blocked · 3 invalid invocation.","es":"Códigos de salida: 0 aprobado · 1 fallo de herramienta (sin veredicto) · 2 compuerta bloqueada · 3 invocación inválida."},"levels":["executive","architect","engineer"]},{"text":{"en":"The dogfood workflow runs the Action against a non-conforming fixture, not against this repository.","es":"El workflow de dogfood ejecuta la Action contra un fixture no conforme, no contra este repositorio."},"levels":["architect","engineer"]},{"text":{"en":"`requester.actorType: human | agent | ci | system` inside the EvaluationContext.","es":"`requester.actorType: human | agent | ci | system` dentro del EvaluationContext."},"levels":["engineer"]}],"docs":[{"path":"README.md","label":{"en":"README","es":"README"},"url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/README.md"},{"path":"action.yml","label":{"en":"GitHub Action definition","es":"Definición de la GitHub Action"},"url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/action.yml"}]},{"id":"ai-agents","layer":"experience","order":2,"span":3,"col":6,"row":0,"kind":"actor","label":{"en":"AI agents · MCP clients","es":"Agentes de IA · clientes MCP"},"shortLabel":{"en":"AI agents","es":"Agentes de IA"},"subtitle":"Cursor · Claude Desktop · Claude Code","status":{"maturity":null,"qualifier":{"en":"third-party clients","es":"clientes de terceros"},"asOf":"2026-09-19","source":"src/packages/mcp-server/README.md"},"summary":{"executive":{"en":"Cursor, Claude Desktop, Claude Code: replaceable executors that reach the engine through MCP, never approval authorities.","es":"Cursor, Claude Desktop, Claude Code: ejecutores reemplazables que llegan al motor por MCP, nunca autoridades de aprobación."},"architect":{"en":"Cursor, Claude Desktop, Claude Code: replaceable executors that reach the engine through MCP, never approval authorities. Every tool call is checked twice — native ABAC and an OPA policy must both allow (ADR-0087) — and anything mutative waits for `{ apply: true, approvalToken }`.","es":"Cursor, Claude Desktop, Claude Code: ejecutores reemplazables que llegan al motor por MCP, nunca autoridades de aprobación. Cada llamada a herramienta se comprueba dos veces —el ABAC nativo y una política OPA deben permitirla (ADR-0087)— y todo lo mutativo espera `{ apply: true, approvalToken }`."},"engineer":{"en":"Cursor, Claude Desktop, Claude Code: replaceable executors that reach the engine through MCP, never approval authorities. Client config `{ \"mcpServers\": { \"evolith\": { \"command\": \"npx\", \"args\": [\"-y\", \"@beyondnet/evolith-mcp\"] } } }`; the Claude Code plugin bundles the same `mcpServers.evolith` entry and its skill never reports a run as passing without stating skipped and errored.","es":"Cursor, Claude Desktop, Claude Code: ejecutores reemplazables que llegan al motor por MCP, nunca autoridades de aprobación. Configuración del cliente `{ \"mcpServers\": { \"evolith\": { \"command\": \"npx\", \"args\": [\"-y\", \"@beyondnet/evolith-mcp\"] } } }`; el plugin de Claude Code incluye la misma entrada `mcpServers.evolith` y su skill nunca reporta una corrida como aprobada sin declarar omitidas y con error."}},"facts":[{"text":{"en":"Agents are actors of kind `agent`: observe · recommend · attach-evidence · draft-candidate only.","es":"Los agentes son actores de tipo `agent`: solo observe · recommend · attach-evidence · draft-candidate."},"levels":["executive","architect","engineer"]},{"text":{"en":"Two locks per tool call: ABAC native AND OPA (ADR-0087); mutative tools need `{ apply: true, approvalToken }`.","es":"Dos cerrojos por llamada: ABAC nativo Y OPA (ADR-0087); las herramientas mutativas exigen `{ apply: true, approvalToken }`."},"levels":["architect","engineer"]},{"text":{"en":"Transports: stdio JSON-RPC 2.0 or Streamable HTTP with `Authorization: Bearer \u003cEVOLITH_API_KEY>`.","es":"Transportes: stdio JSON-RPC 2.0 o Streamable HTTP con `Authorization: Bearer \u003cEVOLITH_API_KEY>`."},"levels":["engineer"]}],"docs":[{"path":"src/packages/mcp-server/README.md","label":{"en":"MCP server README","es":"README del servidor MCP"},"url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/src/packages/mcp-server/README.md"},{"path":".claude-plugin/marketplace.json","label":{"en":"Claude Code plugin marketplace","es":"Marketplace del plugin de Claude Code"},"url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/.claude-plugin/marketplace.json"}]},{"id":"business-intent","layer":"experience","order":3,"span":3,"col":9,"row":0,"kind":"actor","label":{"en":"Business intent · Initiative","es":"Intención de negocio · Iniciativa"},"shortLabel":{"en":"Initiative","es":"Iniciativa"},"subtitle":"ADR-0100 · ADR-0101","status":{"maturity":null,"qualifier":{"en":"a concept, not a component","es":"un concepto, no un componente"},"asOf":"2026-09-19","source":"reference/core/architecture/adrs/core/0100-governance-execution-boundary-product-initiative.md"},"summary":{"executive":{"en":"The unit of governance is the Initiative — no tasks, epics or stories (ADR-0100 · ADR-0101).","es":"La unidad de gobierno es la Iniciativa: sin tareas, épicas ni historias (ADR-0100 · ADR-0101)."},"architect":{"en":"The unit of governance is the Initiative — no tasks, epics or stories (ADR-0100 · ADR-0101). Agile work items are ExternalReferenceContext ingested through an ACL; the Tracker keeps the Initiative, its gate decisions and its evidence, while the Core only sees an opaque `initiativeId`.","es":"La unidad de gobierno es la Iniciativa: sin tareas, épicas ni historias (ADR-0100 · ADR-0101). Los ítems de trabajo ágil son ExternalReferenceContext ingeridos por una ACL; el Tracker conserva la Iniciativa, sus decisiones de compuerta y su evidencia, mientras el Core solo ve un `initiativeId` opaco."},"engineer":{"en":"The unit of governance is the Initiative — no tasks, epics or stories (ADR-0100 · ADR-0101). Intake paths in the Tracker: strategic · opportunity · manual; `tenantId`, `productId`, `initiativeId`, `phaseId` and `gateId` are pass-through fields of the EvaluationContext that the stateless Core never persists.","es":"La unidad de gobierno es la Iniciativa: sin tareas, épicas ni historias (ADR-0100 · ADR-0101). Vías de entrada en el Tracker: estratégica · oportunidad · manual; `tenantId`, `productId`, `initiativeId`, `phaseId` y `gateId` son campos de paso del EvaluationContext que el Core sin estado nunca persiste."}},"facts":[{"text":{"en":"Granularity = Initiatives; no tasks, backlog, epics or user stories (ADR-0100).","es":"Granularidad = Iniciativas; sin tareas, backlog, épicas ni historias de usuario (ADR-0100)."},"levels":["executive","architect","engineer"]},{"text":{"en":"Agile work items enter as ExternalReferenceContext through an ACL.","es":"Los ítems ágiles entran como ExternalReferenceContext a través de una ACL."},"levels":["architect","engineer"]}],"docs":[{"path":"reference/core/architecture/adrs/core/0100-governance-execution-boundary-product-initiative.md","label":{"en":"ADR-0100 — governance/execution boundary","es":"ADR-0100 — frontera gobierno/ejecución"},"url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/reference/core/architecture/adrs/core/0100-governance-execution-boundary-product-initiative.md"},{"path":"product/suite/vision/evolith-product-vision-master.md","label":{"en":"Product vision (master)","es":"Visión de producto (maestra)"},"url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/product/suite/vision/evolith-product-vision-master.md"}]},{"id":"npm-cli","layer":"distribution","order":0,"span":2,"col":0,"row":0,"kind":"channel","label":{"en":"npm · @beyondnet/evolith-cli","es":"npm · @beyondnet/evolith-cli"},"shortLabel":{"en":"npm CLI","es":"npm CLI"},"subtitle":"@beyondnet/evolith-cli 1.4.0","metric":{"text":{"en":"1.4.0","es":"1.4.0"}},"status":{"maturity":"validated","qualifier":{"en":"published · daily canary","es":"publicado · canario diario"},"asOf":"2026-09-19","source":".github/workflows/published-canary.yml"},"summary":{"executive":{"en":"1.4.0 on npm; released on `cli-vX.Y.Z` tags; a daily canary installs the published package.","es":"1.4.0 en npm; se publica con etiquetas `cli-vX.Y.Z`; un canario diario instala el paquete publicado."},"architect":{"en":"1.4.0 on npm; released on `cli-vX.Y.Z` tags; a daily canary installs the published package. The release workflow refu lithMcpClient, Node-only; the Tracker uses its own C# client. The SDK wraps the REST and MCP doors behind typed contracts from `@beyondnet/evolith-contracts` 1.3.0; it is a convenience, never a fifth surface with its own semantics.","es":"`@beyondnet/evolith-sdk` 2.0.1: EvolithRestClient · EvolithMcpClient, solo Node; el Tracker usa su propio cliente C#. El SDK envuelve las puertas REST y MCP tras contratos tipados de `@beyondnet/evolith-contracts` 1.3.0; es una comodidad, nunca una quinta superficie con semántica propia."},"engineer":{"en":"`@beyondnet/evolith-sdk` 2.0.1: EvolithRestClient · EvolithMcpClient, Node-only; the Tracker uses its own C# client. The CLI can talk to a remote Core through the SDK (`REST /api/v1`, optional); since 2.0.0 the SDK hand-authors no response types — it re-exports the canonical contracts from `@beyondnet/evolith-core-domain` and owns only the envelope, the request DTOs and the MCP tool input schemas (`src/packages/sdk-client/README.md`).","es":"`@beyondnet/evolith-sdk` 2.0.1: EvolithRestClient · EvolithMcpClient, solo Node; el Tracker usa su propio cliente C#. El CLI puede hablar con un Core remoto a través del SDK (`REST /api/v1`, opcional); desde 2.0.0 el SDK no redacta tipos de respuesta a mano: reexporta los contratos canónicos de `@beyondnet/evolith-core-domain` y solo posee el sobre, los DTO de petición y los esquemas de entrada de las herramientas MCP (`src/packages/sdk-client/README.md`)."}},"facts":[{"text":{"en":"Node-only typed client; the Tracker's .NET BFF uses its own C# client instead.","es":"Cliente tipado solo para Node; el BFF .NET del Tracker usa su propio cliente C#."},"levels":["executive","architect","engineer"]},{"text":{"en":"Two clients: EvolithRestClient and EvolithMcpClient.","es":"Dos clientes: EvolithRestClient y EvolithMcpClient."},"levels":["architect","engineer"]}],"docs":[{"path":"src/packages/sdk-client/README.md","label":{"en":"SDK client README","es":"README del cliente SDK"},"url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/src/packages/sdk-client/README.md"}]},{"id":"capability-manifest","layer":"interfaces","order":6,"span":3,"col":6,"row":1,"kind":"door","label":{"en":"Capability manifest","es":"Manifiesto de capacidades"},"shortLabel":{"en":"Manifest","es":"Manifiesto"},"subtitle":"@beyondnet/evolith-contracts 1.3.0","metric":{"text":{"en":"contracts 1.3.0","es":"contracts 1.3.0"}},"status":{"maturity":"implemented","qualifier":{"en":"projected from the MCP registry","es":"proyectado desde el registro MCP"},"asOf":"2026-09-19","source":"src/packages/contracts/package.json"},"summary":{"executive":{"en":"`GET /api/v1/capabilities` and `evolith://capabilities`; operations projected from the MCP registry (GT-583); `@beyondnet/evolith-contracts` 1.3.0.","es":"`GET /api/v1/capabilities` y `evolith://capabilities`; operaciones proyectadas desde el registro MCP (GT-583); `@beyondnet/evolith-contracts` 1.3.0."},"architect":{"en":"`GET /api/v1/capabilities` and `evolith://capabilities`; operations projected from the MCP registry (GT-583); `@beyondnet/evolith-contracts` 1.3.0. A client asks the Core what it can do instead of hard-coding it; the manifest is derived from the same registry the MCP server serves, so the two cannot drift.","es":"`GET /api/v1/capabilities` y `evolith://capabilities`; operaciones proyectadas desde el registro MCP (GT-583); `@beyondnet/evolith-contracts` 1.3.0. Un cliente pregunta al Core qué sabe hacer en lugar de cablearlo; el manifiesto se deriva del mismo registro que sirve el servidor MCP, así que los dos no pueden divergir."},"engineer":{"en":"`GET /api/v1/capabilities` and `evolith://capabilities`; operations projected from the MCP registry (GT-583); `@beyondnet/evolith-contracts` 1.3.0. The contracts package also carries the machine contract set and evidence-edge schemas; `@beyondnet/evolith-contracts` carries no npm attestation (SECURITY.md, 7/8 as of 2026-07-30; the ninth public package, `@beyondnet/evolith-repo-facts`, postdates that count).","es":"`GET /api/v1/capabilities` y `evolith://capabilities`; operaciones proyectadas desde el registro MCP (GT-583); `@beyondnet/evolith-contracts` 1.3.0. El paquete de contratos también lleva el conjunto de contratos máquina y los esquemas de evidence-edge; `@beyondnet/evolith-contracts` no tiene atestación npm (SECURITY.md, 7/8 al 2026-07-30; el noveno paquete público, `@beyondnet/evolith-repo-facts`, es posterior a ese conteo)."}},"facts":[{"text":{"en":"Two addresses, one manifest: REST `GET /api/v1/capabilities` and MCP resource `evolith://capabilities`.","es":"Dos direcciones, un manifiesto: REST `GET /api/v1/capabilities` y recurso MCP `evolith://capabilities`."},"levels":["executive","architect","engineer"]},{"text":{"en":"`@beyondnet/evolith-contracts` has no npm attestation (SECURITY.md, as of 2026-07-30).","es":"`@beyondnet/evolith-contracts` no tiene atestación npm (SECURITY.md, al 2026-07-30)."},"levels":["engineer"]}],"docs":[{"path":"src/packages/contracts/package.json","label":{"en":"Contracts package.json","es":"package.json de contracts"},"url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/src/packages/contracts/package.json"},{"path":"src/apps/core-api/README.md","label":{"en":"Core API README","es":"README de la Core API"},"url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/src/apps/core-api/README.md"}]},{"id":"acl","layer":"interfaces","order":7,"span":3,"col":9,"row":1,"kind":"door","label":{"en":"Anti-Corruption Layers","es":"Capas anticorrupción"},"shortLabel":{"en":"ACL","es":"ACL"},"subtitle":"preserve lineage · map to canonical · reject","status":{"maturity":"designed","qualifier":{"en":"vision","es":"visión"},"asOf":"2026-07-28","source":"product/suite/vision/evolith-product-vision-master.md"},"summary":{"executive":{"en":"Preserve lineage · map to canonical · reject non-compliant; external facts enter here and the Tracker judges evidence.","es":"Preservar el linaje · mapear a lo canónico · rechazar lo no conforme; los hechos externos entran aquí y el Tracker juzga la evidencia."},"architect":{"en":"Preserve lineage · map to canonical · reject non-compliant; external facts enter here and the Tracker judges evidence. Every input — a Jira item, a scanner report, a CI run — normalises to one canonical model with provenance; data ownership stays with the source of record, and quality signals arrive through `IQualitySignalProvider` (ADR-0111, Proposed).","es":"Preservar el linaje · mapear a lo canónico · rechazar lo no conforme; los hechos externos entran aquí y el Tracker juzga la evidencia. Toda entrada —un ítem de Jira, un informe de escáner, una corrida de CI— se normaliza a un único modelo canónico con procedencia; la propiedad de los datos se queda en la fuente de registro, y las señales de calidad llegan por `IQualitySignalProvider` (ADR-0111, propuesto)."},"engineer":{"en":"Preserve lineage · map to canonical · reject non-compliant; external facts enter here and the Tracker judges evidence. Designed in the vision (verified 2026-07-28); the Tracker side implements the intake ACL (T-016) and the canonical `ExternalReference` value object (T-013); the Core side exposes only the `IQualitySignalProvider` port and the `externalReferences[]` slot of the EvaluationContext.","es":"Preservar el linaje · mapear a lo canónico · rechazar lo no conforme; los hechos externos entran aquí y el Tracker juzga la evidencia. Diseñado en la visión (verificado el 2026-07-28); el lado del Tracker implementa la ACL de entrada (T-016) y el value object canónico `ExternalReference` (T-013); el lado del Core solo expone el puerto `IQualitySignalProvider` y la ranura `externalReferences[]` del EvaluationContext."}},"facts":[{"text":{"en":"Three verbs: preserve lineage · map to canonical · reject non-compliant.","es":"Tres verbos: preservar el linaje · mapear a lo canónico · rechazar lo no conforme."},"levels":["executive","architect","engineer"]},{"text":{"en":"Data ect":{"en":"The orchestrator and three engines: Native TS (19 handlers) · OPA/Wasm (35 policies, OPA 1.19.0) · Enforcer (6 sandboxed analysers). Dual-engine parity (ADR-0041) keeps Native and OPA answering the same rule ids and guard 68 holds them to fact agreement; fail-closed is structural, not a flag; 12 evaluation kinds exist and 7 KindEvaluators are wired for CLI and MCP.","es":"El orquestador y tres motores: Native TS (19 handlers) · OPA/Wasm (35 políticas, OPA 1.19.0) · Enforcer (6 analizadores en sandbox). La paridad de doble motor (ADR-0041) mantiene a Native y OPA respondiendo a los mismos ids de regla y el guard 68 los obliga a coincidir en hechos; el fallo cerrado es estructural, no una bandera; existen 12 tipos de evaluación y 7 KindEvaluators cableados para CLI y MCP."},"engineer":{"en":"The orchestrator and three engines: Native TS (19 handlers) · OPA/Wasm (35 policies, OPA 1.19.0) · Enforcer (6 sandboxed analysers). Fail-closed table: missing wasm → every rule failed · engine throw → every rule failed · undeclared rule → skipped (`no-policy-in-bundle`) · handler throw → errored · empty corpus → `RulesetsNotFoundError` · `--select` no match → `SEL-01` · missing `evolith.yaml` → `GOV-000` · rejected override → `OVR-BLOCKING-REMOVED`. `opa build -t wasm` with 4 entrypoints; 6 host-dispatchable builtins (guard 55 reads the compiled bundle's `builtins()` table). Enforcer wraps dependency-cruiser, NetArchTest, import-linter, checkov, trivy and ISO 5055 SARIF.","es":"El orquestador y tres motores: Native TS (19 handlers) · OPA/Wasm (35 políticas, OPA 1.19.0) · Enforcer (6 analizadores en sandbox). Tabla de fallo cerrado: wasm ausente → todas las reglas fallidas · excepción del motor → todas las reglas fallidas · regla no declarada → skipped (`no-policy-in-bundle`) · excepción en un handler → errored · corpus vacío → `RulesetsNotFoundError` · `--select` sin coincidencias → `SEL-01` · `evolith.yaml` ausente → `GOV-000` · override rechazado → `OVR-BLOCKING-REMOVED`. `opa build -t wasm` con 4 entrypoints; 6 builtins despachables por el host (el guard 55 lee la tabla `builtins()` del bundle compilado). Enforcer envuelve dependency-cruiser, NetArchTest, import-linter, checkov, trivy y SARIF de ISO 5055."}},"facts":[{"text":{"en":"A rule ends passed, failed, skipped or errored; a blocking rule that ended skipped or errored fails the run.","es":"Una regla termina aprobada, fallida, omitida o con error; una regla bloqueante que terminó omitida o con error hace fallar la corrida."},"levels":["executive","architect","engineer"]},{"text":{"en":"Dual-engine parity (ADR-0041) checked by guard 68 inside the required `Test` job.","es":"Paridad de doble motor (ADR-0041) verificada por el guard 68 dentro del job obligatorio `Test`."},"levels":["architect","engineer"]},{"text":{"en":"Fail-closed table: missing wasm → every rule failed · engine throw → every rule failed · undeclared rule → skipped (`no-policy-in-bundle`) · handler throw → errored · empty corpus → `RulesetsNotFoundError` · `--select` no match → `SEL-01` · missing `evolith.yaml` → `GOV-000` · rejected override → `OVR-BLOCKING-REMOVED`; 6 host-dispatchable builtins.","es":"Tabla de fallo cerrado: wasm ausente → todas las reglas fallidas · excepción del motor → todas las reglas fallidas · regla no declarada → skipped (`no-policy-in-bundle`) · excepción en un handler → errored · corpus vacío → `RulesetsNotFoundError` · `--select` sin coincidencias → `SEL-01` · `evolith.yaml` ausente → `GOV-000` · override rechazado → `OVR-BLOCKING-REMOVED`; 6 builtins despachables por el host."},"levels":["engineer"]},{"text":{"en":"On this repository: opa 133/159 · native 41/159 (2026-08-21).","es":"En este repositorio: opa 133/159 · native 41/159 (2026-08-21)."},"levels":["architect","engineer"]}],"docs":[{"path":"src/rulesets/opa/README.md","label":{"en":"OPA policies README","es":"README de las políticas OPA"},"url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/src/rulesets/opa/README.md"},{"path":"reference/core/architecture/adrs/core/0041-dual-engine-policy-evaluation.md","label":{"en":"ADR-0041 — dual-engine policy evaluation","es":"ADR-0041 — evaluación de políticas con doble motor"},"url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/reference/core/architecture/adrs/core/0041-dual-engine-policy-evaluation.md"},{"path":"docs/known-limitations.md","label":{"en":"Known limitations","es":"Limitaciones conocidas"},"url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/docs/known-limitations.md"}]},{"id":"verdict","layer":"constitution","order":2,"span":2,"col":6,"row":0,"kind":"engine","label":{"en":"Verdict · EvaluationResult","es":"Veredicto · EvaluationResult"},"shortLabel":{"en":"Verdict","es":"Veredicto"},"subtitle":"EvaluationResult 2.0.0 · exit 0 · 1 · 2 · 3","metric":{"text":{"en":"PASS · FAIL · WAIVE · SKIP","es":"PASS · FAIL · WAIVE · SKIP"}},"status":{"maturity":"validated","qualifier":{"en":"closed set","es":"conjunto cerrado"},"asOf":"2026-09-19","source":"src/sdk/cli/src/infrastructure/cli/exit-codes.ts:11-34"},"summary":{"executive":{"en":"passed · failed · skipped · errored → PASS · FAIL · WAIVE · SKIP → exit 0 · 1 · 2 · 3; `decisionRecommendation.binding: false` — a verdict, never a decision.","es":"passed · failed · skipped · errored → PASS · FAIL · WAIVE · SKIP → exit 0 · 1 · 2 · 3; `decisionRecommendation.binding: false`: un veredicto, nunca una decisión."},"architect":{"en":"passed · failed · skipped · errored → PASS · FAIL · WAIVE · SKIP → exit 0 · 1 · 2 · 3; `decisionRecommendation.binding: false` — a verdict, never a decision. ADR-0101 keeps the binding GateDecision with whoever owns the process; the Core emits a recommendation, and a blocking rule that ended skipped blocks exactly like one that failed (`blockingSkippedRuleIds`).","es":"passed · failed · skipped · errored → PASS · FAIL · WAIVE · SKIP → exit 0 · 1 · 2 · 3; `decisionRecommendation.binding: false`: un veredicto, nunca una decisión. ADR-0101 deja la GateDecision vinculante en manos de quien es dueño del proceso; el Core emite una recomendación, y una regla bloqueante que terminó omitida bloquea exactamente igual que una fallida (`blockingSkippedRuleIds`)."},"engineer":{"en":"passed · failed · skipped · errored → PASS · FAIL · WAIVE · SKIP → exit 0 · 1 · 2 · 3; `decisionRecommendation.binding: false` — a verdict, never a decision. `verdict.ts:14-23` holds the `Verdict` enum; `exit-codes.ts:11-34` the closed set (`1` tool failed, no verdict · `3` invalid invocation — both mean not evaluated); `EVALUATION_RESULT_SCHEMA_VERSION = '2.0.0'` (GT-688: `results.topology` is an array); `decisionRecommendation { binding: false, recommendedBy: 'evolith-core' }`.","es":"passed · failed · skipped · errored → PASS · FAIL · WAIVE · SKIP → exit 0 · 1 · 2 · 3; `decisionRecommendation.binding: false`: un veredicto, nunca una decisión. `verdict.ts:14-23` contiene el enum `Verdict`; `exit-codes.ts:11-34` el conjunto cerrado (`1` fallo de herramienta, sin veredicto · `3` invocación inválida; ambos significan no evaluado); `EVALUATION_RESULT_SCHEMA_VERSION = '2.0.0'` (GT-688: `results.topology` es un array); `decisionRecommendation { binding: false, recommendedBy: 'evolith-core' }`."}},"facts":[{"text":{"en":"A verdict is not a decision: `decisionRecommendation.binding: false` by contract (ADR-0101).","es":"Un veredicto no es una decisión: `decisionRecommendation.binding: false` por contrato (ADR-0101)."},"levels":["executive","architect","engineer"]},{"text":{"en":"Exit 1 and 3 mean not evaluated, never a softer fail.","es":"Los exit 1 y 3 significan no evaluado, nunca un fallo más suave."},"levels":["architect","engineer"]},{"text":{"en":"EvaluationContext schema 1.0.0 → EvaluationResult schema 2.0.0.","es":"Esquema EvaluationContext 1.0.0 → esquema EvaluationResult 2.0.0."},"levels":["engineer"]}],"docs":[{"path":"src/packages/core-domain/src/domain/verdict/verdict.ts","label":{"en":"Verdict enum (code)","es":"Enum Verdict (código)"},"url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/src/packages/core-domain/src/domain/verdict/verdict.ts"},{"path":"src/sdk/cli/src/infrastructure/cli/exit-codes.ts","label":{"en":"Exit codes (code)","es":"Códigos de salida (código)"},"url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/src/sdk/cli/src/infrastructure/cli/exit-codes.ts"},{"path":"reference/core/architecture/adrs/core/0101-core-stateless-evaluation-engine.md","label":{"en":"ADR-0101 — stateless evaluation engine","es":"ADR-0101 — motor de evaluación sin estado"},"url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/reference/core/architecture/adrs/core/0101-core-stateless-evaluation-engine.md"}]},{"id":"finding-authority","layer":"constitution","order":3,"span":2,"col":8,"row":0,"kind":"record","label":{"en":"Finding & authority boundary","es":"Hallazgo y frontera de autoridad"},"shortLabel":{"en":"Authority boundary","es":"Frontera de autoridad"},"subtitle":"ADR-0116 · advisory: true","status":{"maturity":"implemented","qualifier":{"en":"executable boundary","es":"frontera ejecutable"},"asOf":"2026-09-19","source":"src/packages/core-domain/src/domain/authority-policy.ts"},"summary":{"executive":{"en":"ADR-0116: findings carry provenance and determinism and are advisory; only human · custodian · board may accept, promote, ratify, waive or enforce.","es":"ADR-0116: los hallazgos llevan procedencia y determinismo y son consultivos; solo human · custodian · board pueden aceptar, promover, ratificar, eximir o hacer cumplir."},"architect":{"en":"ADR-0116: findings carry provenance and determinism and are advisory; only human · custodian · board may accept, promote, ratify, waive or enforce. `agent | engine | ci` may observe, recommend, attach evidence or draft a candidate; a probabilistic signal blocks only with fresh calibration (GT-584).","es":"ADR-0116: los hallazgos llevan procedencia y determinismo y son consultivos; solo human · custodian · board pueden aceptar, promover, ratificar, eximir o hacer cumplir. `agent | engine | ci` pueden observar, recomendar, adjuntar evidencia o redactar un borrador; una señal probabilística solo bloquea con calibración reciente (GT-584)."},"engineer":{"en":"ADR-0116: findings carry provenance and determinism and are advisory; only human · custodian · board may accept, promote, ratify, waive or enforce. `finding.ts` defines the canonical Finding with `provenance`, `determinism` and `advisory: true`; `authority-policy.ts:52-91` is the actor-kind × action matrix that every surface consults before a state change.","es":"ADR-0116: los hallazgos llevan procedencia y determinismo y son consultivos; solo human · custodian · board pueden aceptar, promover, ratificar, eximir o hacer cumplir. `finding.ts` define el Finding canónico con `provenance`, `determinism` y `advisory: true`; `authority-policy.ts:52-91` es la matriz tipo de actor × acción que toda superficie consulta antes de cambiar el estado."}},"facts":[{"text":{"en":"Who can say yes: human · custodian · board → accept · promote · ratify · waive · enforce.","es":"Quién puede decir que sí: human · custodian · board → accept · promote · ratify · waive · enforce."},"levels":["executive","architect","engineer"]},{"text":{"en":"agent · engine · ci → observe · recommend · attach-evidence · draft-candidate.","es":"agent · engine · ci → observe · recommend · attach-evidence · draft-candidate."},"levels":["architect","engineer"]},{"text":{"en":"ADR-0116 Accepted 2026-07-18; matrix at `authority-policy.ts:52-91`.","es":"ADR-0116 aceptado el 2026-07-18; matriz en `authority-policy.ts:52-91`."},"levels":["engineer"]}],"docs":[{"path":"src/packages/core-domain/src/domain/authority-policy.ts","label":{"en":"Authority policy (code)","es":"Política de autoridad (código)"},"url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/src/packages/core-domain/src/domain/authority-policy.ts"},{"path":"src/packages/core-domain/src/e es bajo `src/rulesets/adr/generated/` (GT-627), así que una decisión de seguridad y su comprobación son un solo artefacto; ADR-0119 está implementado parcialmente y lo declara."},"engineer":{"en":"API hardening, SSRF, input validation, shell safety, timing-safe comparison, secrets — shipped as generated conformance packs. Written 2026-07-23; the generator emits one `*.rules.json` per ADR into `src/rulesets/adr/generated/`; the same tree applied its own standards in PR #725 (CWE-78 argv allowlist, CWE-22, proto-pollution, ReDoS).","es":"Endurecimiento de API, SSRF, validación de entrada, shell seguro, comparación en tiempo constante, secretos: entregados como paquetes de conformidad generados. Redactados el 2026-07-23; el generador emite un `*.rules.json` por ADR en `src/rulesets/adr/generated/`; el mismo árbol se aplicó sus propios estándares en el PR #725 (allowlist de argv para CWE-78, CWE-22, proto-pollution, ReDoS)."}},"facts":[{"text":{"en":"Six ADRs, six generated conformance packs (GT-627).","es":"Seis ADRs, seis paquetes de conformidad generados (GT-627)."},"levels":["executive","architect","engineer"]},{"text":{"en":"ADR-0119 (API hardening) is partial and labelled as such.","es":"ADR-0119 (endurecimiento de API) es parcial y así se etiqueta."},"levels":["architect","engineer"]}],"docs":[{"path":"reference/core/architecture/adrs/core/0119-api-security-configuration-hardening.md","label":{"en":"ADR-0119 — API security hardening","es":"ADR-0119 — endurecimiento de la API"},"url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/reference/core/architecture/adrs/core/0119-api-security-configuration-hardening.md"},{"path":"reference/core/architecture/adrs/core/0124-credential-secret-management-standard.md","label":{"en":"ADR-0124 — credential and secret management","es":"ADR-0124 — gestión de credenciales y secretos"},"url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/reference/core/architecture/adrs/core/0124-credential-secret-management-standard.md"}]},{"id":"knowledge-os","layer":"constitution","order":5,"span":2,"col":0,"row":1,"kind":"record","label":{"en":"Knowledge OS (M0)","es":"Knowledge OS (M0)"},"shortLabel":{"en":"Knowledge OS","es":"Knowledge OS"},"subtitle":"OKF v0.1 · ADR-0105 · ADR-0112 · ADR-0115","status":{"maturity":"prototyped","qualifier":{"en":"M0","es":"M0"},"asOf":"2026-09-19","source":"reference/knowledge/README.md"},"summary":{"executive":{"en":"OKF v0.1 (ADR-0105, Proposed) · RAG on pgvector (ADR-0112) · `evolith-knowledge-search` · KO-* (ADR-0115, Proposed). 'Memory for the product, not for the AI.'","es":"OKF v0.1 (ADR-0105, propuesto) · RAG sobre pgvector (ADR-0112) · `evolith-knowledge-search` · KO-* (ADR-0115, propuesto). «Memoria para el producto, no para la IA.»"},"architect":{"en":"OKF v0.1 (ADR-0105, Proposed) · RAG on pgvector (ADR-0112) · `evolith-knowledge-search` · KO-* (ADR-0115, Proposed). 'Memory for the product, not for the AI.' Knowledge is a projection of the corpus: `reference/knowledge/canonical/` is the single source of truth, the OKF bundle is its published projection, and one MCP tool reaches it; the hosted knowledge surface is wired in M2, not M0.","es":"OKF v0.1 (ADR-0105, propuesto) · RAG sobre pgvector (ADR-0112) · `evolith-knowledge-search` · KO-* (ADR-0115, propuesto). «Memoria para el producto, no para la IA.» El conocimiento es una proyección del corpus: `reference/knowledge/canonical/` es la única fuente de verdad, el bundle OKF es su proyección publicada y una sola herramienta MCP llega a él; la superficie de conocimiento alojada se cablea en M2, no en M0."},"engineer":{"en":"OKF v0.1 (ADR-0105, Proposed) · RAG on pgvector (ADR-0112) · `evolith-knowledge-search` · KO-* (ADR-0115, Proposed). 'Memory for the product, not for the AI.' Search is BM25-first hybrid (GT-592); the pgvector platform is Qwen3-Embedding-0.6B, 1024-dim, HNSW, deploy-gated — the ≈ 65 h CPU seed is deliberately not run (GT-685, issue #764).","es":"OKF v0.1 (ADR-0105, propuesto) · RAG sobre pgvector (ADR-0112) · `evolith-knowledge-search` · KO-* (ADR-0115, propuesto). «Memoria para el producto, no para la IA.» La búsqueda es híbrida con BM25 primero (GT-592); la plataforma pgvector es Qwen3-Embedding-0.6B, 1024 dimensiones, HNSW, sujeta a despliegue: la siembra de ≈ 65 h de CPU no se ejecuta a propósito (GT-685, issue #764)."}},"facts":[{"text":{"en":"Memory for the product, not for the AI.","es":"Memoria para el producto, no para la IA."},"levels":["executive","architect","engineer"]},{"text":{"en":"`evolith-knowledge-search` is MCP-only (declared `exempt` in the parity matrix).","es":"`evolith-knowledge-search` es solo MCP (declarado `exempt` en la matriz de paridad)."},"levels":["architect","engineer"]},{"text":{"en":"RAG seed ≈ 65 h CPU, deliberately not run (GT-685, issue #764).","es":"Siembra del RAG ≈ 65 h de CPU, no ejecutada a propósito (GT-685, issue #764)."},"levels":["engineer"]}],"docs":[{"path":"reference/knowledge/README.md","label":{"en":"Knowledge README","es":"README de conocimiento"},"url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/reference/knowledge/README.md"}]},{"id":"satellites","layer":"constitution","order":6,"span":3,"col":2,"row":1,"kind":"record","label":{"en":"Satellite repositories","es":"Repositorios satélite"},"shortLabel":{"en":"Satellites","es":"Satélites"},"subtitle":"evolith.yaml · coreRef pinned · INH-01…INH-06","metric":{"text":{"en":"INH-01…INH-06","es":"INH-01…INH-06"}},"status":{"maturity":"implemented","qualifier":{"en":"the Core is a satellite of itself","es":"el Core es satélite de sí mismo"},"asOf":"2026-09-19","source":"src/rulesets/governance/inheritance.rules.json"},"summary":{"executive":{"en":"Any repository with an `evolith.yaml`: pinned coreRef, INH-01…INH-06, local ADRs tagged EvolithSatellite; the Core is a satellite of itself.","es":"Cualquier repositorio con un `evolith.yaml`: coreRef fijado, INH-01…INH-06, ADRs locales con etiqueta EvolithSatellite; el Core es satélite de sí mismo."},"architect":{"en":"Any repository with an `evolith.yaml`: pinned coreRef, INH-01…INH-06, local ADRs tagged EvolithSatellite; the Core is a satellite of itself. Hub-and-spoke: Level 0 Core (Authority) → Level 1 satellite (Inheritor); satellite-to-satellite inheritance is prohibited; every base ADR gets Adopt, Extend, Override or Not Applicable — silence is not an option; monorepo satellites use `evolith.workspace.yaml` (ADR-0109).","es":"Cualquier repositorio con un `evolith.yaml`: coreRef fijado, INH-01…INH-06, ADRs locales con etiqueta EvolithSatellite; el Core es satélite de sí mismo. Hub-and-spoke: Nivel 0 Core (Autoridad) → Nivel 1 satélite (Heredero); la herencia entre satélites está prohibida; cada ADR base recibe Adoptar, Extender, Sobrescribir o No aplica —el silencio no es una opción—; los satélites monorepo usan `evolith.workspace.yaml` (ADR-0109)."},"engineer":{"en":"Any repository with an `evolith.yaml`: pinned coreRef, INH-01…INH-06, local ADRs tagged EvolithSatellite; the Core is a satellite of itself. `evolith init --name \u003cx> --yes` writes `apiVersion evolith.dev/v1`, `kind Satellite`, `spec.coreRef.version` (INH-02, semver, never `latest`); missing manifest → `GOV-000` MUST; missing `DECISIONS.md` → failing row (INH-06); `evolith upgrade` moves the pin forward only (INH-03); schema `src/rulesets/schema/evolith-yaml.schema.json`, `additionalProperties: false`. Root `evolith.yaml`: name `evolith`, coreRef 1.0.0; its `metadata.phase F1` is the topology axis, not an SDLC phase.","es":"Cualquier repositorio con un `evolith.yaml`: coreRef fijado, INH-01…INH-06, ADRs locales con etiqueta EvolithSatellite; el Core es satélite de sí mismo. `evolith init --name \u003cx> --yes` escribe `apiVersion evolith.dev/v1`, `kind Satellite`, `spec.coreRef.version` (INH-02, semver, nunca `latest`); manifiesto ausente → `GOV-000` MUST; `DECISIONS.md` ausente → fila fallida (INH-06); `evolith upgrade` solo mueve el pin hacia adelante (INH-03); esquema `src/rulesets/schema/evolith-yaml.schema.json`, `additionalProperties: false`. `evolith.yaml` raíz: name `evolith`, coreRef 1.0.0; su `metadata.phase F1` es el eje de topología, no una fase SDLC."}},"facts":[{"text":{"en":"INH-01 Core Immutability · INH-02 Version Pinning · INH-03 Upgrade Only · INH-04 local ADRs tagged EvolithSatellite · INH-05 promotion via Architecture Board · INH-06 mandatory DECISIONS.md.","es":"INH-01 Inmutabilidad del Core · INH-02 Fijación de versión · INH-03 Solo actualizar · INH-04 ADRs locales con etiqueta EvolithSatellite · INH-05 promoción vía Comité de Arquitectura · INH-06 DECISIONS.md obligatorio."},"levels":["executive","architect","engineer"]},{"text":{"en":"Four responses per base ADR: Adopt / Extend / Override / Not Applicable — silence is not an option.","es":"Cuatro respuestas por ADR base: Adoptar / Extender / Sobrescribir / No aplica; el silencio no es una opción."},"levels":["architect","engineer"]},{"text":{"en":"Trap: `evolith.yaml` `metadata.phase ∈ {F1, F2, F3}` is the topology axis; the SDLC position is `spec.sdlc.currentPhase 1..5`.","es":"Trampa: `evolith.yaml` `metadata.phase ∈ {F1, F2, F3}` es el eje de topología; la posición SDLC es `spec.sdlc.currentPhase 1..5`."},"levels":["engineer"]}],"docs":[{"path":"src/rulesets/governance/inheritance.rules.json","label":{"en":"Inheritance rules (INH-01…06)","es":"Reglas de herencia (INH-01…06)"},"url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/src/rulesets/governance/inheritance.rules.json"},{"path":"reference/core/foundations/inheritance-model/child-repository-inheritance-guide.md","label":{"en":"Child repository inheritance guide","es":"Guía de herencia para repositorios hijos"},"url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/reference/core/foundations/inheritance-model/child-repository-inheritance-guide.md"},{"path":"src/rulesets/schema/evolith-yaml.schema.json","label":{"en":"evolith.yaml schema","es":"Esquema de evolith.yaml"},"u ión anota (verificado 2026-07-28) que ninguna superficie construye MCP ni OpenCode. El chatbox es un intermediario, no la fuente de autoridad: los LLM y los agentes consumen contexto aprobado, rulesets, skills y permisos a través de los contratos de Evolith."},"engineer":{"en":"6 adapters — CLI Command · CLI Chat · Hermes ChatBox · MCP · OpenCode · External Trigger (ai-augmented/ADR-0104); the vision notes (verified 2026-07-28) that MCP and OpenCode are constructed by no surface. Classes SmartCliCommand, SmartCliChat, HermesChatBox, Mcp, OpenCode, ExternalTrigger under `src/packages/agent-runtime/src/adapters/interaction/`; the count is `\\w+InteractionAdapter` exports, the 'declared, not constructed' claim is sourced to the vision, never to the tree.","es":"6 adaptadores —CLI Command · CLI Chat · Hermes ChatBox · MCP · OpenCode · External Trigger (ai-augmented/ADR-0104)—; la visión anota (verificado 2026-07-28) que ninguna superficie construye MCP ni OpenCode. Clases SmartCliCommand, SmartCliChat, HermesChatBox, Mcp, OpenCode, ExternalTrigger bajo `src/packages/agent-runtime/src/adapters/interaction/`; el conteo son las exportaciones `\\w+InteractionAdapter`, y la afirmación «declarado, no construido» se atribuye a la visión, nunca al árbol."}},"facts":[{"text":{"en":"Declared vs wired: MCP and OpenCode adapters exist in code but no surface constructs them (vision, verified 2026-07-28).","es":"Declarado vs cableado: los adaptadores MCP y OpenCode existen en el código pero ninguna superficie los construye (visión, verificada el 2026-07-28)."},"levels":["executive","architect","engineer"]},{"text":{"en":"The chatbox is an intermediary, not the source of authority.","es":"El chatbox es un intermediario, no la fuente de autoridad."},"levels":["architect","engineer"]}],"docs":[{"path":"reference/core/architecture/adrs/ai-augmented/ADR-0104-Interaction-Adapter-Port.md","label":{"en":"ADR-0104 (ai-augmented) — Interaction Adapter Port","es":"ADR-0104 (ai-augmented) — puer lt when `AGENT_RUNTIME_ENGINE` is unset) · Hermes · Swarms · Cowork · Routing — 'Hermes is the engine, not the authority'. `AGENT_RUNTIME_ENGINE` unset → `StubAgentEngineAdapter`; engine exports live in `adapters/index.ts`; a real engine reaches a model only through the LLM catalog's `IAssistantTransport`, which is off by default.","es":"Detrás de `IAgentEnginePort`: Stub (por defecto si `AGENT_RUNTIME_ENGINE` no está definido) · Hermes · Swarms · Cowork · Routing: «Hermes es el motor, no la autoridad». `AGENT_RUNTIME_ENGINE` sin definir → `StubAgentEngineAdapter`; las exportaciones de motores viven en `adapters/index.ts`; un motor real llega a un modelo solo a través del `IAssistantTransport` del catálogo LLM, que está desactivado por defecto."}},"facts":[{"text":{"en":"Hermes is the engine, not the authority.","es":"Hermes es el motor, no la autoridad."},"levels":["executive","architect","engineer"]},{"text":{"en":"`AGENT_RUNTIME_ENGINE` unset → `StubAgentEngineAdapter`.","es":"`AGENT_RUNTIME_ENGINE` sin definir → `StubAgentEngineAdapter`."},"levels":["architect","engineer"]}],"docs":[{"path":"src/packages/agent-runtime/src/adapters/index.ts","label":{"en":"Adapter exports (code)","es":"Exportaciones de adaptadores (código)"},"url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/src/packages/agent-runtime/src/adapters/index.ts"},{"path":"reference/core/foundations/agent-skills/agent-authority-model.md","label":{"en":"Agent authority model","es":"Modelo de autoridad de los agentes"},"url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/reference/core/foundations/agent-skills/agent-authority-model.md"}]},{"id":"llm-catalog","layer":"execution","order":9,"span":2,"col":6,"row":1,"kind":"runtime","label":{"en":"LLM provider catalog","es":"Catálogo de proveedores LLM"},"shortLabel":{"en":"LLM catalog","es":"Catálogo LLM"},"subtitle":"ADR-0128 · claude · gemini · off by default","status":{"maturity":"implemented","qualifier":{"en":"partial, ADR-012 ays open on purpose.","es":"Memoria en archivo, bitácora de ejecución con replay (GT-593), conocimiento en pgvector (sujeto a despliegue; la siembra de ≈ 65 h de CPU no se ejecuta a propósito, GT-685). `IMemoryPort` es obligatorio en la ruta caliente; `IRunJournalPort` e `IKnowledgePort` son opcionales; plataforma RAG según ADR-0112 (Qwen3-Embedding-0.6B, 1024 dimensiones, HNSW); el coste de la siembra está medido y la issue (#764) sigue abierta a propósito."}},"facts":[{"text":{"en":"Run journal with replay (GT-593).","es":"Bitácora de ejecución con replay (GT-593)."},"levels":["executive","architect","engineer"]},{"text":{"en":"pgvector knowledge is deploy-gated; the ≈ 65 h CPU seed is deliberately not run (GT-685, issue #764).","es":"El conocimiento en pgvector está sujeto a despliegue; la siembra de ≈ 65 h de CPU no se ejecuta a propósito (GT-685, issue #764)."},"levels":["architect","engineer"]}],"docs":[{"path":"src/packages/agent-runtime/src/adapters/index.ts","label":{"en":"Adapter exports (code)","es":"Exportaciones de adaptadores (código)"},"url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/src/packages/agent-runtime/src/adapters/index.ts"},{"path":"reference/knowledge/README.md","label":{"en":"Knowledge README","es":"README de conocimiento"},"url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/reference/knowledge/README.md"}]},{"id":"external-tools","layer":"execution","order":11,"span":2,"col":10,"row":1,"kind":"external","label":{"en":"External tools","es":"Herramientas externas"},"shortLabel":{"en":"External tools","es":"Herramientas"},"subtitle":"Jira · GitHub · CI · scanners · observability","status":{"maturity":"designed","qualifier":{"en":"ACL","es":"ACL"},"asOf":"2026-07-28","source":"product/suite/vision/evolith-product-vision-master.md"},"summary":{"executive":{"en":"Jira, GitHub, CI runners, scanners, observability: facts and evidence only, through an ACL; quality signals via `IQualitySignalProvider` (ADR-0111, Proposed).","es":"Jira, GitHub, runners de CI, escáneres, observabilidad: solo hechos y evidencia, a través de una ACL; señales de calidad vía `IQualitySignalProvider` (ADR-0111, propuesto)."},"architect":{"en":"Jira, GitHub, CI runners, scanners, observability: facts and evidence only, through an ACL; quality signals via `IQualitySignalProvider` (ADR-0111, Proposed). Disposition per capability is Adopt · Embed · Integrate · Extend · Build · Reject; data ownership stays with the source of record and the Tracker judges the evidence — governed composition, not native rebuilds.","es":"Jira, GitHub, runners de CI, escáneres, observabilidad: solo hechos y evidencia, a través de una ACL; señales de calidad vía `IQualitySignalProvider` (ADR-0111, propuesto). La disposición por capacidad es Adopt · Embed · Integrate · Extend · Build · Reject; la propiedad de los datos se queda en la fuente de registro y el Tracker juzga la evidencia: composición gobernada, no reconstrucciones nativas."},"engineer":{"en":"Jira, GitHub, CI runners, scanners, observability: facts and evidence only, through an ACL; quality signals via `IQualitySignalProvider` (ADR-0111, Proposed). Cluster from the vision: Jira · GitHub / GitLab · CI/CD runners · Test runners · Security scanners · Observability · Deployment · Doc engines; Lighthouse is ADR-0113 (Proposed); `qualitySignals` travel inside the EvaluationContext.","es":"Jira, GitHub, runners de CI, escáneres, observabilidad: solo hechos y evidencia, a través de una ACL; señales de calidad vía `IQualitySignalProvider` (ADR-0111, propuesto). Clúster según la visión: Jira · GitHub / GitLab · runners de CI/CD · runners de pruebas · escáneres de seguridad · observabilidad · despliegue · motores de documentación; Lighthouse es ADR-0113 (propuesto); las `qualitySignals` viajan dentro del EvaluationContext."}},"facts":[{"text":{"en":"Facts and evidence only; never a decision.","es":"Solo hechos y evidencia; nunca una decisión."},"levels":["executive","architect","engineer"]},{"text":{"en":"Disposition per capability: Adopt · Embed · Integrate · Extend · Build · Reject.","es":"Disposición por capacidad: Adopt · Embed · Integrate · Extend · Build · Reject."},"levels":["architect","engineer"]}],"docs":[{"path":"product/suite/vision/evolith-product-vision-master.md","label":{"en":"Product vision (master)","es":"Visión de producto (maestra)"},"url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/product/suite/vision/evolith-product-vision-master.md"},{"path":"reference/core/architecture/adrs/core/0111-quality-signal-provider-port.md","label":{"en":"ADR-0111 — quality signal provider port","es":"ADR-0111 — puerto de proveedor de señales de calidad"},"url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/reference/core/architecture/adrs/core/0111-quality-signal-provider-port.md"}]},{"id":"tracker","layer":"authority","order":0,"span":3,"col":0,"row":0,"kind":"authority","label":{"en":"Evolith Tracker","es":"Evolith Tracker"},"shortLabel":{"en":"Tracker","es":"Tracker"},"subtitle":".NET 10 · PostgreSQL 16 · React 19 (Vite SPA) · NestJS 11 gateway","metric":{"text":{"en":"58 decisions","es":"58 decisiones"}},"status":{"maturity":"implemented","qualifier":{"en":"UAT on Coolify · commercial, not launched","es":"UAT en Coolify · comercial, no lanzado"},"asOf":"2026-08-22","source":"reference/core/architecture/demos/observed-facts.json (evolith_tracker@818a2819)"},"summary":{"executive":{"en":"SDLC governance control plane — .NET 10 · PostgreSQL 16 · React 19 (Vite SPA) · NestJS 11 gateway: two planes of governance, decides gates, owns state, ledger both ways; 58 local decisions (index); separate repository.","es":"Plano de control de gobierno del SDLC —.NET 10 · PostgreSQL 16 · React 19 (Vite SPA) · NestJS 11 gateway—: dos planos de gobierno, decide compuertas, es dueño del estado, libro en ambos sentidos; 58 decisiones locales (índice); repositorio aparte."},"architect":{"en":"SDLC governance control plane — .NET 10 · PostgreSQL 16 · React 19 (Vite SPA) · NestJS 11 gateway: two planes of governance, decides gates, owns state, ledger both ways; 58 local decisions (index); separate repository. Process governance is always on and needs no repository; architecture conformance is opt-in per gate policy (`requiresCoreVerdict`, default false). The BFF is the sole Core client (T-038 · T-046), posts files inline to `POST /api/v1/evaluate`, persists every run as a CoreEvaluationTransaction and never lets the Core's verdict become a GateDecision (T-039); identity is delegated to UMS (ADR-0129).","es":"Plano de control de gobierno del SDLC —.NET 10 · PostgreSQL 16 · React 19 (Vite SPA) · NestJS 11 gateway—: dos planos de gobierno, decide compuertas, es dueño del estado, libro en ambos sentidos; 58 decisiones locales (índice); repositorio aparte. El gobierno del proceso está siempre activo y no necesita repositorio; la conformidad de arquitectura es opcional por política de compuerta (`requiresCoreVerdict`, por defecto false). El BFF es el único cliente del Core (T-038 · T-046), envía los archivos inline a `POST /api/v1/evaluate`, persiste cada corrida como CoreEvaluationTransaction y nunca deja que el veredicto del Core se convierta en GateDecision (T-039); la identidad se delega a UMS (ADR-0129)."},"engineer":{"en":"SDLC governance control plane — .NET 10 · PostgreSQL 16 · React 19 (Vite SPA) · NestJS 11 gateway: two planes of governance, decides gates, owns state, ledger both ways; 58 local decisions (index); separate repository. `tracker-api` (.NET 10) · `tracker-gateway` (NestJS 11, :4000, consumes evolith-mcp via `/api/core-mcp/*`, T-052) · `tracker-web` (React 19 + Vite 8, nginx :8088, not a PWA) · PostgreSQL 16; 6 nav groups / 20 screens; three-layer separation T-056/T-057. Flow: `POST /api/v1/products/{id}/repository-access` → `POST /api/v1/products/{id}/evaluate-architecture` → `CoreEvaluationGateway.EvaluateInlineAsync` → Core `POST /api/v1/evaluate` with `Authorization: Bearer \u003cCoreApi:ApiKey>`; FAILED → HTTP 502. Snapshot `evolith_tracker@818a2819` (2026-08-22); dual licence, not MIT.","es":"Plano de control de gobierno del SDLC —.NET 10 · PostgreSQL 16 · React 19 (Vite SPA) · NestJS 11 gateway—: dos planos de gobierno, decide compuertas, es dueño del estado, libro en ambos sentidos; 58 decisiones locales (índice); repositorio aparte. `tracker-api` (.NET 10) · `tracker-gateway` (NestJS 11, :4000, consume evolith-mcp vía `/api/core-mcp/*`, T-052) · `tracker-web` (React 19 + Vite 8, nginx :8088, no es una PWA) · PostgreSQL 16; 6 grupos de navegación / 20 pantallas; separación en tres capas T-056/T-057. Flujo: `POST /api/v1/products/{id}/repository-access` → `POST /api/v1/products/{id}/evaluate-architecture` → `CoreEvaluationGateway.EvaluateInlineAsync` → Core `POST /api/v1/evaluate` con `Authorization: Bearer \u003cCoreApi:ApiKey>`; FAILED → HTTP 502. Instantánea `evolith_tracker@818a2819` (2026-08-22); licencia dual, no MIT."}},"facts":[{"text":{"en":"Implemented — UAT on Coolify since 2026-08-22 · commercial · not launched.","es":"Implementado — UAT en Coolify desde el 2026-08-22 · comercial · no lanzado."},"levels":["executive","architect","engineer"]},{"text":{"en":"The only paid piece of the suite; separate repository `beyondnetcode/evolith_tracker`; dual licence, not MIT.","es":"La única pieza de pago de la suite; repositorio aparte `beyondnetcode/evolith_tracker`; licencia dual, no MIT."},"levels":["executive","architect","engineer"]},{"text":{"en":"Two planes: process governance always on (no repo needed) · architecture conformance opt-in via `requiresCoreVerdict` (default false).","es":"Dos planos: gobierno del proceso siempre activo (sin repo) · conformidad de arquitectura opcional vía `requiresCoreVerdict` (por defecto false)."},"levels":["architect","engineer"]},{"text":{"en":"`tracker-api` (.NET 10) · `tracker-gateway` (NestJS 11, :4000, `/api/core-mcp/*`, T-052) · `tracker-web` (React 19 + Vite 8, nginx :8088, not a PWA) · PostgreSQL 16; 6 nav groups / 20 screens; T-056/T-057.","es":"`tracker-api` (.NET 10) · `tracker-gateway` (NestJS 11, :4000, `/api/core-mcp/*`, T-052) · `tracker-web` (React 19 + Vite 8, nginx :8088, no es PWA) · PostgreSQL 16; 6 grupos de navegación / 20 pantallas; T-056/T-057."},"levels":["engineer"]},{"text":{"en":"Full local stack: `cd product/infra && EVOLITH_API_KEY=local-dev-key docker compose -f docker-compose.fullstack.yml up -d --build` — 9 service blocks.","es":"Stack local completo: `cd product/infra && EVOLITH_API_KEY=local-dev-key docker compose -f docker-compose.fullstack.yml up -d --build`: 9 bloques de servicio."},"levels":["engineer"]}],"docs":[{"path":"product/products/evolith-tracker/README.md","label":{"en":"Tracker product page","es":"Página de producto del Tracker"},"url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/product/products/evolith-tracker/README.md"},{"path":"product/suite/architecture/evolith-governed-composition-target-design.md","label":{"en":"Governed composition target design","es":"Diseño objetivo de composición gobernada"},"url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/product/suite/architecture/evolith-governed-composition-target-design.md"},{"path":"product/infra/docker-compose.fullstack.yml","label":{"en":"Full-stack docker compose","es":"docker compose del stack completo"},"url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/product/infra/docker-compose.fullstack.yml"}]},{"id":"ums","layer":"authority","order":1,"span":3,"col":3,"row":0,"kind":"authority","label":{"en":"UMS · tenant master","es":"UMS · maestro de tenants"},"shortLabel":{"en":"UMS","es":"UMS"},"subtitle":"ADR-0129 · T-040 · T-053","status":{"maturity":"implemented","qualifier":{"en":"open reference · external repo","es":"referencia abierta · repositorio externo"},"asOf":"2026-08-22","source":"product/products/ums-reference/README.md"},"summary":{"executive":{"en":"Open-source applied reference satellite and th
