name: Evolith SDK CLI Release

on:
  push:
    branches:
      - main
    paths:
      - 'sdk/cli/**'
      - '.release-please-manifest.json'
      - 'release-please-config.json'
      - '.github/workflows/**'

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs['sdk/cli--release_created'] }}
        
      - uses: actions/setup-node@v4
        if: ${{ steps.release.outputs['sdk/cli--release_created'] }}
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies and build
        if: ${{ steps.release.outputs['sdk/cli--release_created'] }}
        working-directory: ./sdk/cli
        run: |
          npm ci
          npm run build

      - name: Publish to NPM
        if: ${{ steps.release.outputs['sdk/cli--release_created'] }}
        working-directory: ./sdk/cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Package binary (pkg)
        if: ${{ steps.release.outputs['sdk/cli--release_created'] }}
        working-directory: ./sdk/cli
        run: |
          npx pkg@latest . --targets node20-linux-x64,node20-macos-x64,node20-win-x64 --out-path binaries
        
      - name: Upload Binaries to Release
        if: ${{ steps.release.outputs['sdk/cli--release_created'] }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release.outputs['sdk/cli--tag_name'] }}
          files: sdk/cli/binaries/*
