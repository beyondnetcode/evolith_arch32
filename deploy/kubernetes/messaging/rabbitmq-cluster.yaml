# Shared RabbitMQ broker for the Evolith suite (ADR-0107 · ADR-0106 tenant projection).
# Requires the RabbitMQ Cluster Operator installed in the cluster:
#   kubectl apply -f https://github.com/rabbitmq/cluster-operator/releases/latest/download/cluster-operator.yml
# HA: 3-node quorum with persistent volumes. Local (kind) can scale replicas to 1 via values.
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: evolith-rabbitmq
  namespace: evolith-messaging
spec:
  replicas: 3
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "1", memory: 2Gi }
  persistence:
    storage: 10Gi
  rabbitmq:
    additionalConfig: |
      # Prefer quorum queues by default; log to console for the OTel/Prometheus stack.
      default_queue_type = quorum
      log.console = true
  override:
    statefulSet:
      spec:
        template:
          metadata:
            annotations:
              prometheus.io/scrape: "true"
              prometheus.io/port: "15692"
