version: '3.8'

services:
  # ---------------------------------------------------------
  # 1. Primary Relational Database (PostgreSQL 16)
  # ---------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ums-postgres
    restart: always
    environment:
      POSTGRES_USER: ums_user
      POSTGRES_PASSWORD: ums_password
      POSTGRES_DB: ums_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ums_user -d ums_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ums-network

  # ---------------------------------------------------------
  # 1.1 Enterprise SQL Server (Latest)
  # ---------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ums-sqlserver
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ums_password123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'ums_password123!' -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ums-network

  # ---------------------------------------------------------
  # 1.2 Document Database (MongoDB)
  # ---------------------------------------------------------
  mongodb:
    image: mongo:latest
    container_name: ums-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ums_user
      MONGO_INITDB_ROOT_PASSWORD: ums_password
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ums-network

  # ---------------------------------------------------------
  # 2. High-Performance Cache (Redis 7.2)
  # ---------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: ums-redis
    restart: always
    command: redis-server --requirepass ums_redis_secure_pass
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "ums_redis_secure_pass", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ums-network

  # ---------------------------------------------------------
  # 3. Message Broker & Event Bus (RabbitMQ)
  # ---------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: ums-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ums_mq_user
      RABBITMQ_DEFAULT_PASS: ums_mq_pass
    ports:
      - "5672:5672"     # AMQP Protocol
      - "15672:15672"   # Management Dashboard Console
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ums-network

  # ---------------------------------------------------------
  # 4. S3-Compatible Object Storage (MinIO)
  # ---------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: ums-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ums_minio_admin
      MINIO_ROOT_PASSWORD: ums_minio_password
    ports:
      - "9000:9000"     # S3 API Port
      - "9001:9001"     # Web Administration Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ums-network

  # ---------------------------------------------------------
  # 5. Secrets and Key Management (OpenBao — Vault fork, Linux Foundation)
  # ---------------------------------------------------------
  openbao:
    image: openbao/openbao:2.5
    container_name: ums-openbao
    restart: always
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ums_openbao_root_token
      BAO_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"     # OpenBao HTTP API (Vault-compatible)
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ums-network

  # ---------------------------------------------------------
  # 6. Public API Gateway (Traefik Proxy)
  # ---------------------------------------------------------
  traefik:
    image: traefik:v3.1
    container_name: ums-traefik
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:8000"
    ports:
      - "8000:8000"     # Public HTTP Proxy Gateway
      - "8080:8080"     # Traefik Admin Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-dynamic.yml:/etc/traefik/dynamic/traefik-dynamic.yml:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ums-network


  # ---------------------------------------------------------
  # 9. OpenTelemetry Collector (OTel)
  # ---------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    container_name: ums-otel-collector
    restart: always
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ../operations/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    networks:
      - ums-network
    depends_on:
      - loki
      - tempo

  # ---------------------------------------------------------
  # 10. Distributed Tracing (Grafana Tempo)
  # ---------------------------------------------------------
  tempo:
    image: grafana/tempo:2.4.1
    container_name: ums-tempo
    restart: always
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ../operations/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"     # Tempo query port
    networks:
      - ums-network

  # ---------------------------------------------------------
  # 11. Log Aggregation (Grafana Loki)
  # ---------------------------------------------------------
  loki:
    image: grafana/loki:2.9.8
    container_name: ums-loki
    restart: always
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    ports:
      - "3100:3100"     # Loki HTTP
    networks:
      - ums-network

  # ---------------------------------------------------------
  # 12. Unified Dashboard (Grafana)
  # ---------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.1
    container_name: ums-grafana
    restart: always
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ../operations/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"     # Grafana UI
    depends_on:
      - loki
      - tempo
    networks:
      - ums-network

  # ---------------------------------------------------------
  # 13. API Backend-for-Frontend (BFF)
  # ---------------------------------------------------------
  bff:
    build:
      context: ./docker
      dockerfile: bff.Dockerfile
    container_name: ums-bff
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bff.rule=PathPrefix(`/bff`)"
      - "traefik.http.routers.bff.entrypoints=web"
    volumes:
      - ../../../rulesets:/app/rulesets:ro
    networks:
      - ums-network

  # ---------------------------------------------------------
  # 14. Model Context Protocol Server (MCP)
  # ---------------------------------------------------------
  mcp:
    build:
      context: ./docker
      dockerfile: mcp.Dockerfile
    container_name: ums-mcp
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcp.rule=PathPrefix(`/mcp`)"
      - "traefik.http.routers.mcp.entrypoints=web"
    volumes:
      - ../../../rulesets:/app/rulesets:ro
    networks:
      - ums-network

# ---------------------------------------------------------
# Persistent Volume Declarations
# ---------------------------------------------------------
volumes:
  postgres_data:
  sqlserver_data:
  mongodb_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  openbao_data:
  tempo_data:
  loki_data:
  grafana_data:

# ---------------------------------------------------------
# Isolated Secure Networks
# ---------------------------------------------------------
networks:
  ums-network:
    driver: bridge
