<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evolith Governance Atlas</title>
  <meta name="theme-color" content="#F4F6F8">
  <link rel="alternate" hreflang="en" href="./?lang=en">
  <link rel="alternate" hreflang="es" href="./?lang=es">
  <link rel="alternate" hreflang="x-default" href="./">
  <script>(function(){try{var d=document.documentElement,s=JSON.parse(localStorage.getItem("evolith.pages.v1")||"{}")||{},t=new URLSearchParams(location.search).get("theme")||s.theme;if(t==="light"||t==="dark")d.setAttribute("data-theme",t);if(s.motion==="off")d.setAttribute("data-motion","off")}catch(e){}})()</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="./pages.css">
  <link rel="stylesheet" href="./styles.css">
  <style>
    /* Skeleton bands painted before the module runs (design-spec §2.11); removed on first render. */
    .canvas-wrap.is-loading::before { content: ""; position: absolute; inset: 16px; border-radius: 16px;
      background: repeating-linear-gradient(180deg, var(--surface-2) 0 96px, transparent 96px 112px); opacity: .7; }
  </style>
</head>
<body>
  <a class="skip-link" id="skipLink" href="#transcript"></a>

  <header class="shell-header" id="header" role="banner"></header>

  <div class="story-bar" id="storyBar">
    <div class="mode-switch seg" id="modeSwitch" role="radiogroup"></div>
    <div class="story-controls" id="storyControls"></div>
    <div class="explore-controls" id="exploreControls" hidden></div>
  </div>

  <main class="atlas-main" id="main">
    <section class="canvas-wrap is-loading" id="canvasWrap">
      <svg id="atlas" class="atlas-svg" role="group" aria-labelledby="atlasTitle" aria-describedby="atlasDesc" preserveAspectRatio="xMidYMid meet">
        <title id="atlasTitle"></title>
        <desc id="atlasDesc"></desc>
        <defs id="atlasDefs"></defs>
        <g id="camera">
          <g id="lanes"></g>
          <rect id="veil" class="veil" hidden></rect>
          <g id="edges"></g>
          <g id="nodes"></g>
          <g id="packets"></g>
          <g id="badges"></g>
        </g>
      </svg>
      <div class="canvas-tools" id="canvasTools"></div>
      <div class="canvas-hint" id="canvasHint" aria-hidden="true"></div>
      <div class="popover" id="legendPop" hidden></div>
      <div class="popover" id="layersPop" hidden></div>
      <div class="canvas-error" id="canvasError" hidden></div>
    </section>

    <aside class="story-panel" id="panel" aria-labelledby="panelTitle" data-snap="half">
      <button type="button" class="sheet-handle" id="sheetHandle" aria-expanded="false" hidden></button>
      <div class="panel-head" id="panelHead" hidden></div>
      <div class="panel-body" id="panelBody"></div>
    </aside>

    <section class="list-view" id="listView" aria-labelledby="listTitle" hidden></section>
  </main>

  <section class="transcript" id="transcript" aria-labelledby="transcriptTitle"></section>

  <footer class="status-strip" id="statusStrip"></footer>

  <div class="dialog" id="shortcuts" role="dialog" aria-modal="true" aria-labelledby="shortcutsTitle" hidden></div>

  <script id="atlas-data"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
