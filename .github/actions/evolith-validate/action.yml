name: Evolith Governance Validation
description: >
  Validates repository compliance against Evolith Core standards using evolith-cli validate.
  Designed to run as a PR gate in satellite repositories.

inputs:
  satellite-path:
    description: 'Path to the satellite repository root (default: repository root)'
    required: false
    default: '.'
  core-path:
    description: 'Path to the Evolith Core repository (for local/monorepo use)'
    required: false
    default: ''
  ruleset:
    description: 'Ruleset to validate: acl | open-core | inheritance | (empty = all)'
    required: false
    default: ''
  node-version:
    description: 'Node.js version to install'
    required: false
    default: '20'
  cli-version:
    description: 'Version of @beyondnet/evolith-cli to install (default: latest)'
    required: false
    default: 'latest'
  cli-command:
    description: >
      Command used to invoke the CLI. Empty (default) installs
      @beyondnet/evolith-cli from npm and runs `evolith-cli`. Set it to an
      already-available executable -- e.g. `node ./src/sdk/cli/dist/main.js` --
      to run against a local build and skip the npm install. This is how the
      Core repository dogfoods and regression-tests this action without
      depending on a published release.
    required: false
    default: ''
  fail-on-violation:
    description: 'Exit with code 1 (fail the job) when violations are found'
    required: false
    default: 'true'

outputs:
  compliance-status:
    description: >-
      compliant | non-compliant | invalid-input | error.
      GT-580: `error` and `invalid-input` mean the repository was NOT evaluated —
      they are not weaker forms of non-compliant and must not be read as a verdict.
    value: ${{ steps.validate.outputs.compliance-status }}
  violations-count:
    description: 'Number of BLOCKING issues found (data.issues[].blocking == true)'
    value: ${{ steps.validate.outputs.violations-count }}
  issues-count:
    description: 'Total number of issues found, blocking and advisory'
    value: ${{ steps.validate.outputs.issues-count }}
  exit-code:
    description: >-
      The CLI exit code, per the GT-580 taxonomy: 0 pass · 1 tool failure ·
      2 blocked verdict · 3 invalid input. Exposed so a caller can distinguish
      "the gate blocked" from "the gate never ran".
    value: ${{ steps.validate.outputs.exit-code }}
  report-path:
    description: 'Absolute path to the generated JSON report artifact'
    value: ${{ steps.validate.outputs.report-path }}

runs:
  using: composite
  steps:
    # ------------------------------------------------------------------
    # 1. Node.js setup
    # ------------------------------------------------------------------
    - name: Setup Node.js ${{ inputs.node-version }}
      if: ${{ inputs.cli-command == '' }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    # ------------------------------------------------------------------
    # 2. Install Evolith CLI globally (skipped when `cli-command` is given)
    # ------------------------------------------------------------------
    - name: Install @beyondnet/evolith-cli@${{ inputs.cli-version }}
      if: ${{ inputs.cli-command == '' }}
      shell: bash
      env:
        INPUT_CLI_VERSION: ${{ inputs.cli-version }}
      run: npm install -g "@beyondnet/evolith-cli@${INPUT_CLI_VERSION}"

    # ------------------------------------------------------------------
    # 3. Run governance validation
    #
    # Inputs are passed through `env:` rather than `${{ }}` interpolated into
    # the script body: it removes the shell-injection surface AND keeps this
    # script executable outside Actions, which is what the hermetic test in
    # `test/action-step.test.mjs` runs.
    # ------------------------------------------------------------------
    - name: Run evolith-cli validate
      id: validate
      shell: bash
      env:
        INPUT_SATELLITE_PATH: ${{ inputs.satellite-path }}
        INPUT_CORE_PATH: ${{ inputs.core-path }}
        INPUT_RULESET: ${{ inputs.ruleset }}
        INPUT_CLI_COMMAND: ${{ inputs.cli-command }}
        INPUT_FAIL_ON_VIOLATION: ${{ inputs.fail-on-violation }}
      run: |
        ARGS=()

        if [ -n "${INPUT_SATELLITE_PATH}" ] && [ "${INPUT_SATELLITE_PATH}" != "." ]; then
          ARGS+=(--satellite "${INPUT_SATELLITE_PATH}")
        fi

        if [ -n "${INPUT_CORE_PATH}" ]; then
          ARGS+=(--core "${INPUT_CORE_PATH}")
        fi

        if [ -n "${INPUT_RULESET}" ]; then
          ARGS+=(--ruleset "${INPUT_RULESET}")
        fi

        CLI_CMD="${INPUT_CLI_COMMAND}"
        if [ -z "${CLI_CMD}" ]; then
          CLI_CMD="evolith-cli"
        fi

        REPORT_PATH="${RUNNER_TEMP}/evolith-report.json"
        rm -f "${REPORT_PATH}"
        echo "report-path=${REPORT_PATH}" >> "${GITHUB_OUTPUT}"

        echo "::group::Evolith governance validation"
        echo "Command: ${CLI_CMD} validate ${ARGS[*]} --format json --output ${REPORT_PATH}"
        echo ""

        set +e
        # Word-split on purpose: `cli-command` may be a multi-word launcher
        # such as `node /path/to/main.js`.
        ${CLI_CMD} validate "${ARGS[@]}" --format json --output "${REPORT_PATH}"
        EXIT_CODE=$?
        set -e

        echo "::endgroup::"

        # GT-577: the report is an ADR-0073 envelope --
        #   { success, data: { status, rulesChecked, issues[], coreRef, timestamp }, meta }
        # There is no `.summary`, so the previous `.summary.violations // 0`
        # made every run render "0 violation(s) found" even while the gate
        # correctly blocked. The expressions below index only the two keys the
        # contract pins (`data.issues[].blocking`) and use `?` so they stay
        # total against an error envelope (no `.data`), against a report that
        # was never written, and against any key later added to the envelope.
        VIOLATIONS=0
        ISSUES=0
        if [ -f "${REPORT_PATH}" ] && command -v jq &>/dev/null; then
          VIOLATIONS=$(jq -r '[.data.issues[]? | select(.blocking == true)] | length' "${REPORT_PATH}" 2>/dev/null || echo "0")
          ISSUES=$(jq -r '[.data.issues[]?] | length' "${REPORT_PATH}" 2>/dev/null || echo "0")
        fi

        # GT-580: the CLI publishes a four-value exit taxonomy —
        #   0 pass · 1 tool failure · 2 blocked verdict · 3 invalid input
        # Collapsing everything non-zero onto "non-compliant" makes a claim the
        # run does not support: when the CLI could not produce a verdict (1) or
        # was invoked wrongly (3), the repository has NOT been shown to be
        # non-compliant — it has not been evaluated at all. Reporting those as
        # non-compliant is a false negative about somebody's code, and it is the
        # same class of defect as a gate that reports green over an unevaluated
        # repo, only inverted.
        case "${EXIT_CODE}" in
          0)
            echo "compliance-status=compliant" >> "${GITHUB_OUTPUT}"
            ;;
          2)
            echo "compliance-status=non-compliant" >> "${GITHUB_OUTPUT}"
            ;;
          3)
            echo "compliance-status=invalid-input" >> "${GITHUB_OUTPUT}"
            echo "::error::Evolith validation was invoked incorrectly (exit 3). The repository was NOT evaluated."
            ;;
          *)
            echo "compliance-status=error" >> "${GITHUB_OUTPUT}"
            echo "::error::Evolith validation could not produce a verdict (exit ${EXIT_CODE}). The repository was NOT evaluated — do not read this as compliant or non-compliant."
            ;;
        esac

        echo "violations-count=${VIOLATIONS}" >> "${GITHUB_OUTPUT}"
        echo "issues-count=${ISSUES}" >> "${GITHUB_OUTPUT}"
        echo "exit-code=${EXIT_CODE}" >> "${GITHUB_OUTPUT}"

        # A tool failure or a bad invocation fails the step regardless of
        # `fail-on-violation`: that input governs what to do with a VERDICT, and
        # there is no verdict here. Only a blocking verdict (2) is negotiable.
        if [ "${EXIT_CODE}" -ne 0 ] && [ "${EXIT_CODE}" -ne 2 ]; then
          echo "::error::Evolith validation did not run to a verdict (exit ${EXIT_CODE})."
          exit "${EXIT_CODE}"
        fi

        if [ "${INPUT_FAIL_ON_VIOLATION}" = "true" ] && [ "${EXIT_CODE}" -eq 2 ]; then
          echo "::error::Evolith governance validation failed. Blocking violations: ${VIOLATIONS} (total issues: ${ISSUES})"
          exit 1
        fi

    # ------------------------------------------------------------------
    # 4. Write job summary (always runs, even on failure)
    # ------------------------------------------------------------------
    - name: Write governance summary
      if: always()
      shell: bash
      env:
        STATUS: ${{ steps.validate.outputs.compliance-status }}
        VIOLATIONS: ${{ steps.validate.outputs.violations-count }}
        ISSUES: ${{ steps.validate.outputs.issues-count }}
        INPUT_SATELLITE_PATH: ${{ inputs.satellite-path }}
        INPUT_RULESET: ${{ inputs.ruleset }}
        INPUT_CLI_VERSION: ${{ inputs.cli-version }}
        INPUT_CLI_COMMAND: ${{ inputs.cli-command }}
        INPUT_NODE_VERSION: ${{ inputs.node-version }}
      run: |
        {
          echo "## Evolith Governance Validation"
          echo ""
          if [ "${STATUS}" = "compliant" ]; then
            echo "**Status:** Compliant -- all rules passed"
          elif [ "${STATUS}" = "error" ]; then
            # GT-580: the CLI could not produce a verdict. Say that, and say it
            # is NOT a judgement about the repository — a reader who sees a red
            # check needs to know whether their code was found wanting or never
            # examined at all.
            echo "**Status:** Not evaluated -- the CLI could not produce a verdict; see the validation log for detail"
            echo ""
            echo "> This is **not** a finding about this repository. The gate did not run to a verdict, so nothing here says the code is compliant or non-compliant."
          elif [ "${STATUS}" = "invalid-input" ]; then
            echo "**Status:** Not evaluated -- the action was invoked incorrectly; see the validation log for detail"
            echo ""
            echo "> This is **not** a finding about this repository. Fix the invocation and re-run."
          elif [ "${STATUS}" = "non-compliant" ] && [ "${VIOLATIONS:-0}" = "0" ]; then
            # A blocking verdict whose issue list could not be read back.
            # Saying "0 violation(s)" here is what made the action read as broken.
            echo "**Status:** Non-compliant -- the gate blocked; see the validation log for detail"
          elif [ "${STATUS}" = "non-compliant" ]; then
            echo "**Status:** Non-compliant -- ${VIOLATIONS} blocking violation(s) of ${ISSUES:-?} issue(s) found"
          else
            echo "**Status:** Unknown -- the validation step did not report a verdict"
          fi
          echo ""
          echo "| Parameter | Value |"
          echo "|-----------|-------|"
          echo "| Satellite path | \`${INPUT_SATELLITE_PATH}\` |"
          if [ -n "${INPUT_RULESET}" ]; then
            echo "| Ruleset | \`${INPUT_RULESET}\` |"
          else
            echo "| Ruleset | all |"
          fi
          if [ -n "${INPUT_CLI_COMMAND}" ]; then
            echo "| CLI | \`${INPUT_CLI_COMMAND}\` (local build) |"
          else
            echo "| CLI version | \`${INPUT_CLI_VERSION}\` |"
          fi
          echo "| Node.js | \`${INPUT_NODE_VERSION}\` |"
        } >> "${GITHUB_STEP_SUMMARY}"
