name: Evolith Packages - Release Pipeline

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - 'packages/core-domain/**'
      - 'packages/infra-providers/**'
      - '.github/workflows/packages-release.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ============================================
  # GATE 1: Detect changed packages
  # ============================================
  detect-changes:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      core_domain: ${{ steps.changes.outputs.core_domain }}
      infra_providers: ${{ steps.changes.outputs.infra_providers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^packages/core-domain/'; then
            echo "core_domain=true" >> $GITHUB_OUTPUT
          else
            echo "core_domain=false" >> $GITHUB_OUTPUT
          fi
          if git diff --name-only HEAD~1 HEAD | grep -q '^packages/infra-providers/'; then
            echo "infra_providers=true" >> $GITHUB_OUTPUT
          else
            echo "infra_providers=false" >> $GITHUB_OUTPUT
          fi

  # ============================================
  # GATE 2: Build & Test core-domain
  # ============================================
  build-core-domain:
    name: Build & Test core-domain
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.core_domain == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci --legacy-peer-deps

      - name: Build core-domain
        working-directory: packages/core-domain
        run: npm run build

      - name: Test core-domain
        working-directory: packages/core-domain
        run: npm test

      - name: Verify package integrity
        run: |
          node -e "
            const pkg = require('./packages/core-domain/package.json');
            if (!pkg.name || !pkg.version || !pkg.main) throw new Error('Missing required fields');
            console.log('✅', pkg.name + '@' + pkg.version);
          "

  # ============================================
  # GATE 3: Publish core-domain
  # ============================================
  publish-core-domain:
    name: Publish @evolith/core-domain
    needs: build-core-domain
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        working-directory: packages/core-domain
        run: npm run build

      - name: Publish to NPM
        working-directory: packages/core-domain
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Confirm
        run: |
          PKG_VERSION=$(node -p "require('./packages/core-domain/package.json').version")
          echo "✅ Published @evolith/core-domain@$PKG_VERSION to NPM"

  # ============================================
  # GATE 4: Build & Test infra-providers
  # ============================================
  build-infra-providers:
    name: Build & Test infra-providers
    needs: [detect-changes, publish-core-domain]
    if: |
      always() &&
      (needs.detect-changes.outputs.infra_providers == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.publish-core-domain.result == 'success' || needs.publish-core-domain.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci --legacy-peer-deps

      - name: Build infra-providers
        working-directory: packages/infra-providers
        run: npm run build

      - name: Verify package integrity
        run: |
          node -e "
            const pkg = require('./packages/infra-providers/package.json');
            if (!pkg.name || !pkg.version || !pkg.main) throw new Error('Missing required fields');
            console.log('✅', pkg.name + '@' + pkg.version);
          "

  # ============================================
  # GATE 5: Publish infra-providers
  # ============================================
  publish-infra-providers:
    name: Publish @evolith/infra-providers
    needs: build-infra-providers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        working-directory: packages/infra-providers
        run: npm run build

      - name: Publish to NPM
        working-directory: packages/infra-providers
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Confirm
        run: |
          PKG_VERSION=$(node -p "require('./packages/infra-providers/package.json').version")
          echo "✅ Published @evolith/infra-providers@$PKG_VERSION to NPM"

  # ============================================
  # Failure notification
  # ============================================
  failure-notification:
    needs: [publish-core-domain, publish-infra-providers]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create Issue on Failure
        if: ${{ github.event_name == 'push' }}
        uses: actions/github-script@v9
        with:
          script: |
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '❌ Packages Release Pipeline Failed',
                body: `Packages release pipeline failed on commit ${{ github.sha }}\n\nCheck the workflow logs for details.\n\n@beyondnetcore/evolith-team`,
                labels: ['bug', 'release']
              });
            } catch (error) {
              core.warning(`Could not create failure issue: ${error.message}`);
            }
