# Declarative RabbitMQ topology for the Tenant master-data projection (ADR-0106 · ADR-0107).
# Requires the RabbitMQ Messaging Topology Operator:
#   kubectl apply -f https://github.com/rabbitmq/messaging-topology-operator/releases/latest/download/messaging-topology-operator-with-certmanager.yaml
#
# Producer: MMS. Consumers: UMS, Tracker. Partitioning: consistent-hash by tenantId.
# Dead-lettering: poison messages route to per-consumer DLQs via a dead-letter exchange.

# --- Main exchange: consistent-hash partitioning by tenantId (per-tenant ordering) ---
apiVersion: rabbitmq.com/v1beta1
kind: Exchange
metadata:
  name: evolith-masterdata
  namespace: evolith-messaging
spec:
  name: evolith.masterdata
  type: x-consistent-hash
  durable: true
  rabbitmqClusterReference: { name: evolith-rabbitmq }
---
# --- Dead-letter exchange ---
apiVersion: rabbitmq.com/v1beta1
kind: Exchange
metadata:
  name: evolith-masterdata-dlx
  namespace: evolith-messaging
spec:
  name: evolith.masterdata.dlx
  type: topic
  durable: true
  rabbitmqClusterReference: { name: evolith-rabbitmq }
---
# --- UMS consumer queue (quorum) + DLQ ---
apiVersion: rabbitmq.com/v1beta1
kind: Queue
metadata:
  name: ums-tenant-projection
  namespace: evolith-messaging
spec:
  name: ums.tenant-projection
  type: quorum
  durable: true
  arguments:
    x-dead-letter-exchange: evolith.masterdata.dlx
    x-dead-letter-routing-key: ums.tenant-projection.dlq
  rabbitmqClusterReference: { name: evolith-rabbitmq }
---
apiVersion: rabbitmq.com/v1beta1
kind: Queue
metadata:
  name: ums-tenant-projection-dlq
  namespace: evolith-messaging
spec:
  name: ums.tenant-projection.dlq
  type: quorum
  durable: true
  rabbitmqClusterReference: { name: evolith-rabbitmq }
---
# --- Tracker consumer queue (quorum) + DLQ ---
apiVersion: rabbitmq.com/v1beta1
kind: Queue
metadata:
  name: tracker-tenant-projection
  namespace: evolith-messaging
spec:
  name: tracker.tenant-projection
  type: quorum
  durable: true
  arguments:
    x-dead-letter-exchange: evolith.masterdata.dlx
    x-dead-letter-routing-key: tracker.tenant-projection.dlq
  rabbitmqClusterReference: { name: evolith-rabbitmq }
---
apiVersion: rabbitmq.com/v1beta1
kind: Queue
metadata:
  name: tracker-tenant-projection-dlq
  namespace: evolith-messaging
spec:
  name: tracker.tenant-projection.dlq
  type: quorum
  durable: true
  rabbitmqClusterReference: { name: evolith-rabbitmq }
---
# --- Bindings: consistent-hash weight "1" per consumer (equal share of tenantId hash space) ---
apiVersion: rabbitmq.com/v1beta1
kind: Binding
metadata:
  name: bind-ums-tenant-projection
  namespace: evolith-messaging
spec:
  source: evolith.masterdata
  destination: ums.tenant-projection
  destinationType: queue
  routingKey: "1"
  rabbitmqClusterReference: { name: evolith-rabbitmq }
---
apiVersion: rabbitmq.com/v1beta1
kind: Binding
metadata:
  name: bind-tracker-tenant-projection
  namespace: evolith-messaging
spec:
  source: evolith.masterdata
  destination: tracker.tenant-projection
  destinationType: queue
  routingKey: "1"
  rabbitmqClusterReference: { name: evolith-rabbitmq }
---
# --- DLQ bindings ---
apiVersion: rabbitmq.com/v1beta1
kind: Binding
metadata:
  name: bind-ums-dlq
  namespace: evolith-messaging
spec:
  source: evolith.masterdata.dlx
  destination: ums.tenant-projection.dlq
  destinationType: queue
  routingKey: ums.tenant-projection.dlq
  rabbitmqClusterReference: { name: evolith-rabbitmq }
---
apiVersion: rabbitmq.com/v1beta1
kind: Binding
metadata:
  name: bind-tracker-dlq
  namespace: evolith-messaging
spec:
  source: evolith.masterdata.dlx
  destination: tracker.tenant-projection.dlq
  destinationType: queue
  routingKey: tracker.tenant-projection.dlq
  rabbitmqClusterReference: { name: evolith-rabbitmq }
