name: Wiki Sync

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'reference/**'
      - 'rulesets/**'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Generate wiki pages
        run: node .harness/scripts/sync-wiki.mjs --force

      - name: Clone and sync wiki
        run: |
          WIKI_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git"

          # Try to clone existing wiki
          if git clone "$WIKI_URL" /tmp/evolith-wiki 2>/dev/null; then
            echo "Wiki repo cloned successfully."
          else
            # Wiki repo doesn't exist yet — initialize locally and push to create it
            echo "Wiki repo not found. Initializing..."
            mkdir -p /tmp/evolith-wiki
            cd /tmp/evolith-wiki
            git init
            git remote add origin "$WIKI_URL"
            git commit --allow-empty -m "Init wiki"
          fi

          # Copy generated pages
          cp "$GITHUB_WORKSPACE/wiki/"*.md /tmp/evolith-wiki/

          # Remove old pages that no longer exist
          cd /tmp/evolith-wiki
          for f in *.md; do
            if [ ! -f "$GITHUB_WORKSPACE/wiki/$f" ] && [ "$f" != "_Sidebar.md" ] && [ "$f" != "_Footer.md" ]; then
              rm -f "$f"
            fi
          done

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No wiki changes to push."
          else
            git commit -m "docs: auto-sync wiki from repository (sha: ${GITHUB_SHA::7})"
            git push -u origin main
            echo "Wiki updated successfully."
          fi
