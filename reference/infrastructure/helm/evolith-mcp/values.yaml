replicaCount: 2

image:
  repository: beyondnetcode/evolith-mcp
  pullPolicy: IfNotPresent
  tag: "1.1.0"

service:
  type: ClusterIP
  port: 80
  targetPort: 3001

ingressRoute:
  enabled: true
  entryPoints:
    - web
    - websecure
  host: api.evolith.beyondnetcode.com
  pathPrefix: /mcp

opa:
  enabled: true
  image: openpolicyagent/opa:0.65.0
  bundle:
    url: "http://ums-minio:9000/opa-bundles/bundle.tar.gz"
    pollingMinDelaySeconds: 10
    pollingMaxDelaySeconds: 20
    credentials:
      existingSecretName: ""
      accessKeyKey: ""
      secretKeyKey: ""
    signing:
      enabled: false
      existingSecretName: ""
      keyIdKey: ""
      keySecretKey: ""
      algorithm: HS256
    tls:
      caCertSecretName: ""
      caCertKey: ca.crt
      skipVerify: false
    readinessFailClosed: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

probes:
  liveness:
    enabled: true
    path: /health
    port: 3001
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  readiness:
    enabled: true
    path: /ready
    port: 3001
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1
  startup:
    enabled: true
    path: /startup
    port: 3001
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
    successThreshold: 1

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - evolith-mcp
          topologyKey: kubernetes.io/hostname

podDisruptionBudget:
  enabled: true
  minAvailable: 1

horizontalPodAutoscaler:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

networkPolicy:
  enabled: true
  ingressRules:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 3001
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app: traefik
      ports:
        - port: 3001
          protocol: TCP
  egressRules:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
