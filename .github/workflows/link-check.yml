name: Link Check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    # Weekly run to catch external links that rot over time.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    name: Validate Markdown links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          # Check repo Markdown; ignore node_modules and the auto-generated
          # ruleset corpus (validated separately by the schema gate).
          args: >-
            --no-progress
            --max-concurrency 8
            --exclude-path node_modules
            --exclude-path rulesets/adr/generated
            --exclude-mail
            "./**/*.md"
          fail: true
