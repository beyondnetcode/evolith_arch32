# Default SDLC Workflow Definition
#
# This is the canonical phase/transition definition for the Evolith SDLC.
# Tenants can override this by providing their own workflow definition
# (YAML, DB, or API) through the IWorkflowDefinitionProvider interface.
#
# Phases are evaluated sequentially by default. Custom transition rules
# can be added per tenant to allow skipping, branching, or conditional flows.

name: evolith-default
description: Default Evolith SDLC workflow — 6 sequential phases
phases:
  - value: phase-0
    label: Foundation
    description: Repository initialized
    order: 0
    artifacts: []
    gateChecks: []

  - value: phase-1
    label: Structure
    description: Project scaffolded
    order: 1
    artifacts: []
    gateChecks: []

  - value: phase-2
    label: Governance
    description: Rulesets and ACL configured
    order: 2
    artifacts: []
    gateChecks: []

  - value: phase-3
    label: Architecture
    description: ADRs and contexts defined
    order: 3
    artifacts: []
    gateChecks: []

  - value: phase-4
    label: Production
    description: CI/CD and containers
    order: 4
    artifacts: []
    gateChecks: []

  - value: phase-5
    label: Observability
    description: DORA metrics and dashboards
    order: 5
    artifacts: []
    gateChecks: []

transitions:
  - from: phase-0
    to: phase-1
  - from: phase-1
    to: phase-2
  - from: phase-2
    to: phase-3
  - from: phase-3
    to: phase-4
  - from: phase-4
    to: phase-5

# Gate-to-phase mapping aligns the gate-evidence phases with workflow phases.
gateMapping:
  discovery: phase-1
  design: phase-2
  construction: phase-3
  qa: phase-4
  release: phase-5
