name: Evolith SDK CLI - Release Pipeline

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    # Branch pushes run validation only. A release is driven by an annotated
    # v* tag (or workflow_dispatch below) — see the release-gate job.
    branches:
      - main
    paths:
      - 'src/sdk/cli/**'
      - '.github/workflows/sdk-cli-release.yml'
      - '.harness/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to release, e.g. v1.1.0. Leave empty to run validation only.'
        required: false
        default: ''

env:
  NODE_VERSION: '20'
  CLI_DIR: 'src/sdk/cli'

jobs:
  # ============================================
  # GATE 0: Evolith Core Validation
  # ============================================
  core-validation:
    name: Evolith Core Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Validate Documentation Standards
        run: node .harness/scripts/ci/01-validate-docs.mjs

      - name: Check Bilingual Parity
        run: node .harness/scripts/ci/04-check-bilingual-parity.mjs

      - name: Verify Root Cleanliness
        run: node .harness/scripts/ci/03-validate-root-cleanliness.mjs

      - name: Verify Version Alignment
        run: |
          node .harness/scripts/verify-version-log.mjs
          node .harness/scripts/verify-git-tag.mjs

  # ============================================
  # GATE 1: Release Please
  # ============================================
  # GT-552: this job used to run release-please against release-please-config.json
  # and .release-please-manifest.json — both DELETED in aed33ba9 ("versioning
  # managed manually"). release_created could therefore never be true, so every
  # job below was unreachable and the failure-notification issue was dead code.
  # Versioning is manual in this repo (the 1.1.0 set was published by hand), so
  # the gate now derives the release from an explicit v* tag or a dispatch input.
  release-gate:
    needs: core-validation
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.gate.outputs.release_created }}
      tag_name: ${{ steps.gate.outputs.tag_name }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - name: Resolve release intent
        id: gate
        env:
          DISPATCH_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          TAG=""
          if [ -n "$DISPATCH_TAG" ]; then
            TAG="$DISPATCH_TAG"
          elif case "$GITHUB_REF" in refs/tags/v*) true ;; *) false ;; esac; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          if [ -n "$TAG" ]; then
            echo "release_created=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "Release requested: $TAG (version ${TAG#v})"
          else
            echo "release_created=" >> "$GITHUB_OUTPUT"
            echo "No release requested for $GITHUB_REF — validation only."
          fi

  # ============================================
  # GATE 2: Build and Test
  # ============================================
  build-and-test:
    needs: release-gate
    if: ${{ needs.release-gate.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      # BUILD THE SIBLINGS BEFORE TYPE-CHECKING THE THING THAT IMPORTS THEM.
      #
      # "Type Check and Build" below runs `npm run build` inside src/sdk/cli, which compiles
      # the CLI and nothing else. In a workspace, `@beyondnet/*` resolve to the local packages
      # by symlink — but a subpath import needs that package's `dist/` to exist. It does not
      # after a bare `npm ci`, so the tag run died with 100+ of these:
      #
      #   error TS2307: Cannot find module '@beyondnet/evolith-core-domain/domain/interfaces'
      #   error TS2307: Cannot find module '@beyondnet/evolith-infra-providers'
      #
      # npm-release.yml has always had this step — it is called "Build every workspace" there.
      # This workflow never did, and nothing noticed because `build-and-test` is gated on
      # `release_created`: it is SKIPPED on every branch push and only executes on a `v*` tag,
      # where it has now failed three times for three different reasons (SBOM on v1.3.0, lint
      # on v1.3.3, this on v1.3.4). Each fix uncovered the next.
      - name: Build every workspace
        run: npm run build

      # `cyclonedx-npm` shells out to `npm ls --json --long --all`, and npm exits
      # NON-ZERO (`ELSPROBLEMS`) for benign tree observations as well as for real
      # breakage. This tree has several that are expected and not going away:
      #
      #   missing: @types/inquirer@^8.1.3, required by nest-commander@3.20.1
      #   missing: webpack@^4.0.0 || ^5.0.0, required by ts-loader@9.6.2
      #   invalid: js-yaml@5.2.1 .../@nestjs/swagger/node_modules/js-yaml
      #
      # The last one is GT-691: @nestjs/swagger pins js-yaml exactly, so the root
      # override cannot move it, and npm reports the override's loser as "invalid".
      #
      # Without --ignore-npm-errors this step fails EVERY tag push, and the
      # failure-notification job then files a "Release Pipeline Failed" issue. Three
      # accumulated that way (#492, #552, #553) before anyone read one. npm still
      # writes complete, usable JSON on stdout while exiting 1, so the SBOM this
      # produces is not degraded -- only the exit code was ever the problem.
      - name: Generate SBOM (CycloneDX)
        run: npx @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-file sbom.json

      - name: The SBOM must have real content, not just exist
        run: |
          set -euo pipefail
          COMPONENTS=$(node -p "(require('./sbom.json').components || []).length")
          echo "sbom components: ${COMPONENTS}"
          if [ "$COMPONENTS" -lt 100 ]; then
            echo "::error::sbom.json declares ${COMPONENTS} component(s). --ignore-npm-errors makes the step tolerant of npm's exit code, not of an empty tree; this few components means the scan did not run."
            exit 1
          fi

      - name: Architecture Boundary Lint (eslint-plugin-boundaries)
        working-directory: ${{ env.CLI_DIR }}
        run: npm run lint

      - name: Type Check and Build
        working-directory: ${{ env.CLI_DIR }}
        run: npm run build

      - name: Security Audit
        working-directory: ${{ env.CLI_DIR }}
        run: npm audit --audit-level=high

      - name: Unit Tests (MUST PASS)
        working-directory: ${{ env.CLI_DIR }}
        run: npm test

      - name: Verify Package Integrity
        run: |
          echo "Verifying package..."
          node -e "
            const pkg = require('./${{ env.CLI_DIR }}/package.json');
            const binTargets = typeof pkg.bin === 'string' ? [pkg.bin] : Object.values(pkg.bin);
            console.log('Name:', pkg.name);
            console.log('Version:', pkg.version);
            console.log('Main:', pkg.main);
            console.log('Bin:', binTargets);
            if (!pkg.name || !pkg.version || !pkg.main || binTargets.length === 0) {
              throw new Error('package.json is missing required identity fields');
            }
          "

  # ============================================
  # GATE 3: Publish to NPM
  # ============================================
  publish-npm:
    # `release-gate` was referenced by this job (needs.release-gate.outputs.version) without
    # being declared here, and `needs.<job>` only resolves for jobs listed in `needs`. So the
    # version interpolated to the EMPTY STRING and the confirmation step announced
    # "Published @beyondnet/evolith-cli@ to NPM".
    needs: [release-gate, build-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      # Same reason as build-and-test: a subpath import of a sibling needs that
      # sibling's dist/, which a bare `npm ci` does not produce. #604 added this to
      # build-and-test and left the other two jobs with the identical sequence, so
      # v1.3.5 got past build-and-test and died here instead, on the same TS2307s.
      - name: Build every workspace
        run: npm run build

      - name: Build
        working-directory: ${{ env.CLI_DIR }}
        run: npm run build

      # ASK THE REGISTRY BEFORE PUBLISHING (#569).
      #
      # This job used to run a bare `npm publish`. Any re-run against an already-published
      # version — a retry after an unrelated flake, a workflow_dispatch, a re-pushed tag —
      # died on "You cannot publish over the previously published versions", and that failure
      # reached `failure-notification`, which files a "Release Pipeline Failed" issue. Three
      # of those accumulated (#492, #552, #553) before anyone read one. A harmless re-run
      # manufactured a bug report.
      #
      # Idempotence belongs BEFORE the publish, as a question with an answer — not after it,
      # as a swallowed error. `continue-on-error` or `|| true` on the publish itself would
      # make a genuine failure indistinguishable from this one, which is the whole defect
      # wearing a different hat. The `|| true` below is on a QUERY, where a non-zero exit
      # simply means "not found", and its answer is then compared explicitly.
      #
      # npm-release.yml has solved this since `plan-npm-release.mjs`; this workflow predates
      # it and never adopted it.
      - name: Is this version already on the registry?
        id: plan
        working-directory: ${{ env.CLI_DIR }}
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          {
            echo "name=$NAME"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION is already on the registry. Skipping the publish — this is not a failure. Bump the version to ship a change."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is not on the registry — publishing."
          fi

      - name: Publish to NPM
        if: steps.plan.outputs.published != 'true'
        working-directory: ${{ env.CLI_DIR }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # An echo is not a confirmation. The previous version of this step printed a success
      # message it had no evidence for — and printed it with an empty version, at that.
      # Verify against the registry, which is the only authority on what was published.
      - name: Confirm the registry holds it
        run: |
          set -euo pipefail
          NAME='${{ steps.plan.outputs.name }}'
          VERSION='${{ steps.plan.outputs.version }}'
          for attempt in 1 2 3 4 5; do
            if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
              echo "confirmed on registry: $NAME@$VERSION"
              exit 0
            fi
            echo "not visible yet (attempt $attempt/5), waiting"
            sleep 10
          done
          echo "::error::$NAME@$VERSION is NOT on the registry after this job ran. The publish reported success and the registry disagrees."
          exit 1

  # ============================================
  # GATE 4: Package Binaries
  # ============================================
  package-binaries:
    needs: publish-npm
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: node20-linux-x64
            ext: ''
          - os: macos-latest
            target: node20-macos-x64
            ext: ''
          - os: windows-latest
            target: node20-win-x64
            ext: '.exe'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: npm ci

      # Same reason as build-and-test: a subpath import of a sibling needs that
      # sibling's dist/, which a bare `npm ci` does not produce. #604 added this to
      # build-and-test and left the other two jobs with the identical sequence, so
      # v1.3.5 got past build-and-test and died here instead, on the same TS2307s.
      - name: Build every workspace
        run: npm run build

      - name: Build
        working-directory: ${{ env.CLI_DIR }}
        run: npm run build

      - name: Package Binary
        id: pkg
        working-directory: ${{ env.CLI_DIR }}
        run: npx pkg@5.8.1 . --targets ${{ matrix.target }} --output-dir ./binaries

      - name: Rename Binary
        shell: bash
        run: |
          cd ${{ env.CLI_DIR }}/binaries
          produced=$(ls | head -1)
          if [ -z "$produced" ]; then
            echo "❌ pkg produced no binary for target ${{ matrix.target }}"
            exit 1
          fi
          mv "$produced" "evolith-cli-${{ matrix.target }}${{ matrix.ext }}"
          ls -la

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: ${{ env.CLI_DIR }}/binaries/evolith-cli-${{ matrix.target }}${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 7

  # ============================================
  # GATE 5: Binary Smoke Test
  # ============================================
  smoke-test:
    needs: [package-binaries, release-gate]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: node20-linux-x64
            bin: evolith-cli-node20-linux-x64
          - os: macos-latest
            target: node20-macos-x64
            bin: evolith-cli-node20-macos-x64
          - os: windows-latest
            target: node20-win-x64
            bin: evolith-cli-node20-win-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download Binary
        uses: actions/download-artifact@v8
        with:
          name: binaries-${{ matrix.target }}
          path: ./binaries

      - name: Setup Binary (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x ./binaries/${{ matrix.bin }}

      - name: Smoke Test - Help Command
        shell: bash
        run: |
          ./binaries/${{ matrix.bin }} --help || { echo "❌ Binary failed to execute on ${{ matrix.os }}"; exit 1; }
          echo "✅ Binary executable works on ${{ matrix.os }}"

      - name: Smoke Test - Version
        shell: bash
        run: |
          VERSION=$(./binaries/${{ matrix.bin }} --version) || { echo "❌ Binary --version failed on ${{ matrix.os }}"; exit 1; }
          echo "Binary version: $VERSION"

  # ============================================
  # GATE 5b: Functional + NPM Smoke (Linux)
  # ============================================
  smoke-test-functional:
    needs: [package-binaries, release-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Download Binary
        uses: actions/download-artifact@v8
        with:
          name: binaries-node20-linux-x64
          path: ./binaries

      - name: Setup Binary
        shell: bash
        run: chmod +x ./binaries/evolith-cli-node20-linux-x64

      - name: Smoke Test - Init Command
        shell: bash
        run: |
          mkdir -p /tmp/evolith-test
          cd /tmp/evolith-test
          echo "test-project" | "$GITHUB_WORKSPACE/binaries/evolith-cli-node20-linux-x64" init --runtime nodejs --monorepo none --arch clean \
            || { echo "❌ Init command smoke test failed"; exit 1; }
          ls -la
          echo "✅ Init command smoke test completed"

      - name: Smoke Test - NPM Package
        shell: bash
        run: |
          npm install -g @beyondnet/evolith-cli@${{ needs.release-gate.outputs.version }}
          evolith-cli --help || { echo "❌ NPM binary failed to execute"; exit 1; }
          echo "✅ NPM package smoke test completed"

  # ============================================
  # GATE 6: Upload Release Assets
  # ============================================
  upload-assets:
    # Same dangling reference as publish-npm had, and this one is worse: the step below
    # interpolates needs.release-gate.outputs.tag_name into the GitHub Release's `tag_name`
    # and `name`, so without release-gate declared here it publishes a Release named
    # "Release " against an empty tag.
    needs: [release-gate, package-binaries, smoke-test, smoke-test-functional]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download All Binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: ./release-assets
          merge-multiple: true

      - name: List Assets
        run: |
          ls -la ./release-assets/
          count=$(find ./release-assets -type f | wc -l)
          if [ "$count" -lt 3 ]; then
            echo "❌ Expected 3 platform binaries, found $count"
            exit 1
          fi
          echo "✅ All $count platform binaries present"

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.release-gate.outputs.tag_name }}
          name: Release ${{ needs.release-gate.outputs.tag_name }}
          body: |
            ## Release Summary

            **Version:** `${{ needs.release-gate.outputs.version }}`

            ### ✅ Quality Gates Passed
            - [x] Core Validation (docs, bilingual, cleanliness)
            - [x] Build and Type Check
            - [x] Unit Tests
            - [x] Security Audit
            - [x] NPM Publication
            - [x] Binary Packaging
            - [x] Smoke Tests

            ### 📦 Assets
            | Platform | Architecture | Download |
            |----------|--------------|----------|
            | Linux | x64 | `evolith-cli-node20-linux-x64` |
            | macOS | x64 | `evolith-cli-node20-macos-x64` |
            | Windows | x64 | `evolith-cli-node20-win-x64.exe` |

            ### 🚀 Installation

            ```bash
            # NPM
            npm install -g @beyondnet/evolith-cli

            # Or download binary directly
            ```

          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm Release
        run: |
          echo "✅ Release ${{ needs.release-gate.outputs.tag_name }} published with all assets"

  # ============================================
  # Cleanup on Failure
  # ============================================
  failure-notification:
    needs: [release-gate, publish-npm, package-binaries, smoke-test, smoke-test-functional, upload-assets]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Notify Failure
        run: |
          echo "❌ Release pipeline failed"
          echo "Please check the logs above for details"
        shell: bash

      # Only file a tracking issue when a real release was attempted and failed —
      # not on routine pushes where no release was created (avoids issue spam).
      - name: Create Issue on Failure
        if: ${{ github.event_name == 'push' && needs.release-gate.outputs.release_created == 'true' }}
        uses: actions/github-script@v9
        with:
          script: |
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '❌ Release Pipeline Failed',
                body: `Release pipeline failed for tag ${{ needs.release-gate.outputs.tag_name || 'unknown' }}

                Please check the workflow logs and fix the issue.

                @beyondnetcode/evolith-core-s-development`,
                labels: ['bug', 'release']
              });
              core.info('Failure issue created');
            } catch (error) {
              // Degrade safely: a missing permission must not fail the notifier itself.
              core.warning(`Could not create failure issue: ${error.message}`);
            }
