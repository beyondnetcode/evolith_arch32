# Broker RBAC for the master-data projection (ADR-0106 · ADR-0107 · ADR-0108).
# Requires the RabbitMQ Messaging Topology Operator:
#   kubectl apply -f https://github.com/rabbitmq/messaging-topology-operator/releases/latest/download/messaging-topology-operator-with-certmanager.yaml
#
# WHY THIS FILE CARRIES ONLY Users/Permissions (ADR-0108, deployment strategy §5.2/§5.3):
#   MassTransit OWNS the message topology. On startup it auto-declares a fanout type-exchange
#   (`Evolith.Contracts.MasterData:TenantEvent` / `:ProductEvent`) and binds one queue per
#   consumer endpoint (`ums.tenant-projection`, `tracker.tenant-projection`), plus a
#   `<queue>_error` queue for poison messages. Declaring those exchanges/queues/bindings here
#   too is at best dead letter and at worst fatal: a CRD-precreated queue whose arguments differ
#   from MassTransit's (e.g. an `x-dead-letter-exchange`) makes MassTransit's redeclare fail with
#   `406 PRECONDITION_FAILED` — the endpoint dies while the pod stays Ready (silent 3am outage).
#   The previous consistent-hash exchange also SPLIT traffic (each event to exactly one queue,
#   ~50/50 by tenantId) instead of fanning out to both consumers.
#
# Therefore the Exchange/Queue/Binding/DLX CRDs are RETIRED (GT-462). What remains is the only
# thing MassTransit cannot self-declare: per-product broker Users + Permissions (least privilege).
# Poison messages land in `<queue>_error` (never a DLX) — alert on its depth; shovel to reprocess.
#
# Permissions are REGEX OVER NAME PREFIXES, not per-verb grants: MassTransit needs configure+write
# on the type-exchange namespace to bootstrap, so verb-only grants break startup (§5.2).
#
# Credential secrets (`<product>-broker-user`, keys `username`/`password`) are provisioned per
# environment — plain K8s Secret locally; OpenBao+ESO (VPS) / Azure Key Vault + CSI (AKS). The
# shared operator default-user is NOT used by products (one leak = whole-suite blast radius, §6).

# ------------------------------------------------------------------ MMS (producer / master) ---
apiVersion: rabbitmq.com/v1beta1
kind: User
metadata:
  name: mms
  namespace: evolith-messaging
spec:
  rabbitmqClusterReference: { name: evolith-rabbitmq }
  importCredentialsSecret: { name: mms-broker-user }
---
apiVersion: rabbitmq.com/v1beta1
kind: Permission
metadata:
  name: mms-permission
  namespace: evolith-messaging
spec:
  vhost: "/"
  userReference: { name: mms }
  permissions:
    # MMS declares + publishes the master-data type-exchanges; it consumes nothing.
    configure: '^(Evolith\.Contracts\.MasterData.*|mms\..*)$'
    write: '^(Evolith\.Contracts\.MasterData.*|mms\..*)$'
    read: '^$'
  rabbitmqClusterReference: { name: evolith-rabbitmq }
---
# --------------------------------------------------------------------- UMS (consumer) ---------
apiVersion: rabbitmq.com/v1beta1
kind: User
metadata:
  name: ums
  namespace: evolith-messaging
spec:
  rabbitmqClusterReference: { name: evolith-rabbitmq }
  importCredentialsSecret: { name: ums-broker-user }
---
apiVersion: rabbitmq.com/v1beta1
kind: Permission
metadata:
  name: ums-permission
  namespace: evolith-messaging
spec:
  vhost: "/"
  userReference: { name: ums }
  permissions:
    # UMS binds its endpoint queue + `_error` to the master-data type-exchange and reads it.
    configure: '^(ums\..*|Evolith\.Contracts\.MasterData.*)$'
    write: '^(ums\..*|Evolith\.Contracts\.MasterData.*)$'
    read: '^(ums\..*|Evolith\.Contracts\.MasterData.*)$'
  rabbitmqClusterReference: { name: evolith-rabbitmq }
---
# ------------------------------------------------------------------ Tracker (consumer) --------
apiVersion: rabbitmq.com/v1beta1
kind: User
metadata:
  name: tracker
  namespace: evolith-messaging
spec:
  rabbitmqClusterReference: { name: evolith-rabbitmq }
  importCredentialsSecret: { name: tracker-broker-user }
---
apiVersion: rabbitmq.com/v1beta1
kind: Permission
metadata:
  name: tracker-permission
  namespace: evolith-messaging
spec:
  vhost: "/"
  userReference: { name: tracker }
  permissions:
    configure: '^(tracker\..*|Evolith\.Contracts\.MasterData.*)$'
    write: '^(tracker\..*|Evolith\.Contracts\.MasterData.*)$'
    read: '^(tracker\..*|Evolith\.Contracts\.MasterData.*)$'
  rabbitmqClusterReference: { name: evolith-rabbitmq }
