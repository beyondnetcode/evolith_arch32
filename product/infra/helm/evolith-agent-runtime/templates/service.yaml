apiVersion: v1
kind: Service
metadata:
  name: {{ include "evolith-agent-runtime.fullname" . }}
  labels:
    app: {{ include "evolith-agent-runtime.name" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      # PINNED. An unpinned NodePort is allocated at random from 30000-32767 and
      # changes on reinstall, so anything configured against it breaks — which is
      # the failure a stable cross-cluster address exists to prevent.
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    app: {{ include "evolith-agent-runtime.name" . }}
