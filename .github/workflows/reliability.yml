name: Reliability

# GT-443 — the load + chaos harness under product/infra/load/ had existed for
# weeks and ran in NO workflow at all (`grep -rniE "k6|chaos" .github/workflows/`
# returned nothing), so its thresholds gated nothing and its first real execution
# found a check asserting a response field the API has never returned. This
# workflow is what makes those assets a gate instead of a document.
#
# Deliberately a NEW file rather than an edit to ci-cd.yml / docker-images.yml:
# both are being modified in an open PR, and a load job has no business coupling
# its lifetime to the main pipeline.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/apps/core-api/**'
      - 'src/packages/core-domain/**'
      # GT-647: core-api's runtime graph does NOT stop at core-domain. The change
      # that broke this workflow (GT-604) touched infra-providers and contracts
      # ONLY, so none of these filters matched and the drill never ran on the
      # commit that broke it — it went red later, on an unrelated core-api edit,
      # pointing at the wrong change. A path filter must cover the image's whole
      # workspace closure, and 56-validate-docker-workspace-closure computes it.
      - 'src/packages/infra-providers/**'
      - 'src/packages/contracts/**'
      # The Dockerfile itself is the artifact under test.
      - 'src/apps/core-api/Dockerfile'
      - 'product/infra/docker-compose.evolith.yml'
      - 'src/rulesets/**'
      - 'product/infra/load/**'
      - '.github/workflows/reliability.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/apps/core-api/**'
      - 'src/packages/core-domain/**'
      # GT-647: core-api's runtime graph does NOT stop at core-domain. The change
      # that broke this workflow (GT-604) touched infra-providers and contracts
      # ONLY, so none of these filters matched and the drill never ran on the
      # commit that broke it — it went red later, on an unrelated core-api edit,
      # pointing at the wrong change. A path filter must cover the image's whole
      # workspace closure, and 56-validate-docker-workspace-closure computes it.
      - 'src/packages/infra-providers/**'
      - 'src/packages/contracts/**'
      # The Dockerfile itself is the artifact under test.
      - 'src/apps/core-api/Dockerfile'
      - 'product/infra/docker-compose.evolith.yml'
      - 'src/rulesets/**'
      - 'product/infra/load/**'
      - '.github/workflows/reliability.yml'
  workflow_dispatch:
    inputs:
      plateau_vus:
        description: 'Concurrent VUs held during the plateau'
        default: '10'
      plateau_duration:
        description: 'Plateau duration (k6 duration string)'
        default: '1m'

env:
  EVOLITH_API_KEY: ci-load-key
  BASE_URL: http://127.0.0.1:3001

# GT-443 — WITHOUT THIS, THE DRILL COULD NOT FAIL. A `run:` step with no `shell:`
# gets Actions' implicit `bash -e {0}`, which does NOT set `pipefail`. Two steps
# here pipe a drill script into `tee`, so the job took `tee`'s exit status and
# discarded the script's. `recovery-time.sh` ends with `exit 1` under the comment
# "NO run recovered a verdict - this is itself a finding", and that exit was
# swallowed: a total outage that never came back would have published its own
# evidence to the step summary under a green tick. Declaring `shell: bash` gets
# `bash --noprofile --norc -eo pipefail {0}`.
defaults:
  run:
    shell: bash

jobs:
  k6-load:
    name: k6 load profile (thresholds + published metrics)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build core-api and its workspace chain
        run: |
          npm run build --workspace @beyondnet/evolith-contracts
          npm run build --workspace @beyondnet/evolith-core-domain
          npm run build --workspace @beyondnet/evolith-infra-providers
          npm run build --workspace core-api

      # Without policy.wasm every OPA-backed rule returns "enforcement blocked",
      # so the load would exercise an error path instead of the governed one.
      - name: Compile OPA policy bundle
        run: npm run build:policy

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      # THROTTLE_MAX_REQUESTS is raised deliberately. core-api throttles every
      # route at 100 requests / 60 s by default, so ANY real load run against a
      # default-configured target measures the rate limiter and nothing else —
      # measured: 81% of evaluations returned 429 at 10 VUs. The k6 scripts now
      # track 429s under their own `throttled_429` threshold, so if this line is
      # ever dropped the run fails by name instead of reporting a bogus error rate.
      - name: Start core-api
        run: |
          mkdir -p "$RUNNER_TEMP/load-ws"
          PORT=3001 \
          NODE_ENV=production \
          CORE_PATH="$GITHUB_WORKSPACE" \
          WORKSPACE_ROOT="$RUNNER_TEMP/load-ws" \
          THROTTLE_MAX_REQUESTS=1000000 \
            node src/apps/core-api/dist/main.js > "$RUNNER_TEMP/core-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/core-api.pid"

      - name: Wait for core-api to serve a real verdict
        run: bash product/infra/load/wait-for-target.sh

      # Correctness gate first: a load number from a broken endpoint is noise.
      - name: k6 smoke (correctness gate)
        run: |
          set +e
          k6 run --summary-export="$RUNNER_TEMP/k6-smoke.json" product/infra/load/k6/smoke.js
          echo "K6_SMOKE_EXIT=$?" >> "$GITHUB_ENV"
          set -e

      - name: Publish smoke metrics
        if: always()
        run: |
          node product/infra/load/report-summary.mjs \
            --summary "$RUNNER_TEMP/k6-smoke.json" \
            --label "smoke (correctness gate)" \
            --exit-code "${K6_SMOKE_EXIT:-1}" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if smoke crossed a threshold
        run: test "${K6_SMOKE_EXIT:-1}" -eq 0

      - name: k6 average load (the profile of record)
        run: |
          set +e
          k6 run \
            --summary-export="$RUNNER_TEMP/k6-average.json" \
            -e RAMP_DURATION=15s \
            -e PLATEAU_VUS="${{ github.event.inputs.plateau_vus || '10' }}" \
            -e PLATEAU_DURATION="${{ github.event.inputs.plateau_duration || '1m' }}" \
            product/infra/load/k6/average-load.js
          echo "K6_AVG_EXIT=$?" >> "$GITHUB_ENV"
          set -e

      - name: Publish average-load metrics
        if: always()
        run: |
          node product/infra/load/report-summary.mjs \
            --summary "$RUNNER_TEMP/k6-average.json" \
            --label "average load" \
            --exit-code "${K6_AVG_EXIT:-1}" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if average load crossed a threshold
        run: test "${K6_AVG_EXIT:-1}" -eq 0

      - name: Upload k6 summaries and server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-reliability-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/k6-smoke.json
            ${{ runner.temp }}/k6-average.json
            ${{ runner.temp }}/core-api.log
          if-no-files-found: warn

      - name: Stop core-api
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/core-api.pid")" || true

  chaos-drill:
    name: Chaos drill (dependency killed mid-run) + MTTR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Kept off the PR path: it builds container images and takes the stack down
    # and up repeatedly, which is a poor fit for per-PR feedback.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      # Engine-only topology: core-api + mcp + redis. The full-stack file is NOT
      # usable here — it has cross-repo build contexts (the Tracker checked out
      # as a sibling), which CI does not have.
      - name: Bring up the engine stack
        run: |
          cd product/infra
          EVOLITH_API_KEY=ci-load-key docker compose -f docker-compose.evolith.yml up -d --build redis core-api

      - name: Wait for the stack to serve a real verdict
        run: bash product/infra/load/wait-for-target.sh

      # GT-647: this job brought containers up and captured NOTHING from them, so
      # when `evolith-core-api:local` began crash-looping on a missing workspace
      # package the only signal in three consecutive runs (30628493705, 30630994704,
      # 30632498438) was `[wait-for-target] TIMEOUT after 180s` — a message that
      # cannot distinguish a crash-loop from a slow boot. The container had printed
      # the exact require stack and the failing module name each time, and CI threw
      # it away. `always()` is the point: the run this matters in is the failing one,
      # where the steps below never execute.
      #
      # Named `chaos-*.log` so the existing upload glob carries it into the artifact
      # without a second upload step.
      - name: Capture container logs and state
        if: always()
        run: |
          cd product/infra
          {
            echo "===== docker compose ps ====="
            docker compose -f docker-compose.evolith.yml ps --all
            echo
            echo "===== docker compose logs (--no-color, all services) ====="
            docker compose -f docker-compose.evolith.yml logs --no-color --timestamps --tail=2000
          } > "$RUNNER_TEMP/chaos-container-logs.log" 2>&1 || true
          # Surface the tail inline too: an artifact you must download is not seen by
          # whoever is looking at a red job right now.
          echo '::group::container logs (tail 100)'
          tail -n 100 "$RUNNER_TEMP/chaos-container-logs.log" || true
          echo '::endgroup::'

      # Criterion 3 of the gap: the dependency dies MID-RUN, with real callers on
      # it, and what the callers saw is recorded.
      - name: Chaos — kill redis dependency under load, record the behaviour
        env:
          COMPOSE_FILE: ${{ github.workspace }}/product/infra/docker-compose.evolith.yml
          BASE_URL: http://127.0.0.1:3001
          EVOLITH_API_KEY: ci-load-key
          OUT_DIR: ${{ runner.temp }}
          TARGET: redis
          PLATEAU_VUS: '5'
          PLATEAU_DURATION: 60s
        run: bash product/infra/load/chaos/kill-under-load.sh | tee "$RUNNER_TEMP/chaos-kill-under-load.log"

      - name: Total-outage MTTR
        env:
          COMPOSE_FILE: ${{ github.workspace }}/product/infra/docker-compose.evolith.yml
          EVOLITH_API_KEY: ci-load-key
          SERVICES: redis core-api
          RUNS: '3'
        run: bash product/infra/load/chaos/recovery-time.sh | tee "$RUNNER_TEMP/chaos-mttr.log"

      # GT-443 — the drill's own asserts cover "did it come back". This covers "did it
      # measure anything at all". A run where k6 never issued a request reports
      # total_requests 0 and error_rate 0, and the recovery check still passes, because
      # a system nobody called does look healthy. Zero measured requests is the vacuous
      # pass this board keeps finding, so it fails here instead of reading as a clean drill.
      - name: The drill must have measured something
        run: |
          line=$(grep -o '{"scenario":"kill-under-load".*}' "$RUNNER_TEMP/chaos-kill-under-load.log" | tail -1)
          if [ -z "$line" ]; then
            echo "::error::the chaos drill produced no result line — it did not run"
            exit 1
          fi
          echo "$line"
          total=$(printf '%s' "$line" | sed -n 's/.*"total_requests":\([0-9]*\).*/\1/p')
          if [ -z "$total" ] || [ "$total" -eq 0 ]; then
            echo "::error::the drill issued 0 requests: nothing was measured, so 'it recovered' means nothing"
            exit 1
          fi
          echo "drill measured $total request(s) across the outage"

      # GT-443 criterion 3 — the drill now checks the recorded behaviour against what
      # ADR-0011 DECLARES, which it could not do until the ADR declared anything. The
      # budgets live in "Calibration in force" there, derived from six measured
      # recoveries with ~2x headroom, and the headroom size is argued in the ADR: a
      # budget pegged to the observed value fails on runner noise and teaches everyone
      # to re-run the job, which is how a red check becomes a ritual.
      - name: Recovery is inside the budgets ADR-0011 declares
        env:
          # Keep in step with reference/core/architecture/adrs/core/0011-*.md
          BUDGET_MTTR_MS: '25000'
          BUDGET_UNDER_LOAD_MS: '150000'
        run: |
          fail=0

          mttr=$(grep -o '{"summary":true[^}]*}' "$RUNNER_TEMP/chaos-mttr.log" | tail -1 \
                 | sed -n 's/.*"mean_mttr_ms":\([0-9]*\).*/\1/p')
          if [ -z "$mttr" ]; then
            echo "::error::no mean_mttr_ms in the MTTR log — the drill recorded no recovery to measure"
            fail=1
          elif [ "$mttr" -gt "$BUDGET_MTTR_MS" ]; then
            echo "::error::MTTR ${mttr}ms exceeds the ADR-0011 budget of ${BUDGET_MTTR_MS}ms"
            fail=1
          else
            echo "MTTR ${mttr}ms is within the ${BUDGET_MTTR_MS}ms budget"
          fi

          verdict=$(grep -o '{"scenario":"kill-under-load".*}' "$RUNNER_TEMP/chaos-kill-under-load.log" \
                    | tail -1 | sed -n 's/.*"t_first_verdict_ms":\([0-9]*\).*/\1/p')
          if [ -z "$verdict" ]; then
            echo "::error::no t_first_verdict_ms under load — the system never returned a governed verdict"
            fail=1
          elif [ "$verdict" -gt "$BUDGET_UNDER_LOAD_MS" ]; then
            echo "::error::first verdict under load ${verdict}ms exceeds the ADR-0011 budget of ${BUDGET_UNDER_LOAD_MS}ms"
            fail=1
          else
            echo "first verdict under load ${verdict}ms is within the ${BUDGET_UNDER_LOAD_MS}ms budget"
          fi

          # The error rate during the outage is NOT bounded, on purpose: ~33% is the
          # expected observation of a drill that deliberately kills a dependency under
          # load. Bounding it would fail the drill for succeeding.
          exit $fail

      - name: Publish chaos results
        if: always()
        run: |
          {
            echo '### Chaos drill'
            echo ''
            echo 'Recovery is measured to the FIRST GOVERNED VERDICT, not to "process up".'
            echo ''
            echo '```'
            cat "$RUNNER_TEMP/chaos-kill-under-load.log" 2>/dev/null || echo '(no kill log)'
            cat "$RUNNER_TEMP/chaos-mttr.log" 2>/dev/null || echo '(no MTTR log)'
            echo '```'
            echo ''
            echo '> This is a container-restart drill on a single CI host. It is NOT a'
            echo '> disaster-recovery restore, so it yields MTTR — never RTO/RPO (GT-443'
            echo '> criterion 4 stays open until a real DR restore is run).'
          } >> "$GITHUB_STEP_SUMMARY"

      # The capture above diagnoses a BOOT failure; this one covers a failure in the
      # kill/MTTR steps, whose whole subject is what the containers did. Separate
      # file so neither overwrites the other, and taken before `down -v` destroys them.
      - name: Capture container logs after the drill
        if: always()
        run: |
          cd product/infra
          {
            echo "===== docker compose ps (post-drill) ====="
            docker compose -f docker-compose.evolith.yml ps --all
            echo
            echo "===== docker compose logs (post-drill) ====="
            docker compose -f docker-compose.evolith.yml logs --no-color --timestamps --tail=2000
          } > "$RUNNER_TEMP/chaos-container-logs-post.log" 2>&1 || true

      - name: Upload chaos logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-reliability-${{ github.run_id }}
          path: ${{ runner.temp }}/chaos-*.log
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: |
          cd product/infra
          docker compose -f docker-compose.evolith.yml down -v || true
