# Local single-node kind cluster for the Evolith suite (ADR-0107).
#   kind create cluster --name evolith --config deploy/kubernetes/kind-cluster.yaml
# Ingress-ready control-plane; extra port mappings expose the products + RabbitMQ UI locally.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: evolith
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - { containerPort: 80, hostPort: 80, protocol: TCP }     # ingress HTTP
      - { containerPort: 443, hostPort: 443, protocol: TCP }   # ingress HTTPS
      - { containerPort: 30672, hostPort: 15672, protocol: TCP } # RabbitMQ management UI (NodePort)
