groups:
  - name: infrastructure-alerts
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 1 minute."
          runbook_url: "https://github.com/beyondnetcode/evolith/blob/main/reference/operations/data-store-backup-dr.md"

      - alert: HighCpuUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 80% for more than 10 minutes (current: {{ $value | printf \"%.1f\" }}%)."
          runbook_url: "https://github.com/beyondnetcode/evolith/blob/main/reference/operations/README.md"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 85% for more than 10 minutes (current: {{ $value | printf \"%.1f\" }}%)."
          runbook_url: "https://github.com/beyondnetcode/evolith/blob/main/reference/operations/README.md"

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk free space is below 15% (current: {{ $value | printf \"%.1f\" }}%)."
          runbook_url: "https://github.com/beyondnetcode/evolith/blob/main/reference/operations/data-store-backup-dr.md"

      - alert: DiskSpaceWarning
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk space running low on {{ $labels.instance }}"
          description: "Disk free space is below 25% (current: {{ $value | printf \"%.1f\" }}%)."
          runbook_url: "https://github.com/beyondnetcode/evolith/blob/main/reference/operations/data-store-backup-dr.md"

      - alert: RabbitMQQueueDepth
        expr: rabbitmq_queue_messages > 1000
        for: 10m
        labels:
          severity: warning
          service: rabbitmq
        annotations:
          summary: "RabbitMQ queue {{ $labels.queue }} depth high"
          description: "Queue {{ $labels.queue }} has {{ $value }} messages pending for more than 10 minutes."
          runbook_url: "https://github.com/beyondnetcode/evolith/blob/main/reference/operations/README.md"

      - alert: OpaEvaluationFailure
        expr: rate(opa_evaluation_errors_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          service: opa
        annotations:
          summary: "OPA evaluation errors detected"
          description: "OPA policy evaluation errors are occurring at {{ $value | humanize }}/s."
          runbook_url: "https://github.com/beyondnetcode/evolith/blob/main/reference/operations/README.md"

  - name: core-api-alerts
    rules:
      - alert: HighErrorRate
        # 5xx fraction of ALL requests (a real percentage, matching the annotation) —
        # the emitted counter is multi-label (method/path/status), so aggregate with sum().
        expr: sum(rate(evolith_http_requests_total{status=~"5.."}[5m])) / sum(rate(evolith_http_requests_total[5m])) > 0.01
        for: 5m
        labels:
          severity: critical
          service: core-api
        annotations:
          summary: "High 5xx error rate on Core API"
          description: "5xx error rate is {{ $value | humanizePercentage }} (threshold: 1%)"
          runbook_url: "https://github.com/beyondnetcode/evolith/blob/main/reference/operations/README.md"

      - alert: HighLatency
        expr: histogram_quantile(0.99, sum by (le) (rate(evolith_http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
          service: core-api
        annotations:
          summary: "High p99 latency on Core API"
          description: "p99 latency is {{ $value }}s (threshold: 500ms)"
          runbook_url: "https://github.com/beyondnetcode/evolith/blob/main/reference/operations/README.md"

      - alert: PodRestart
        expr: increase(kube_pod_container_status_restarts_total[1h]) > 3
        for: 0m
        labels:
          severity: warning
          service: core-api
        annotations:
          summary: "Pod restarting frequently"
          description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last hour"
          runbook_url: "https://github.com/beyondnetcode/evolith/blob/main/reference/operations/README.md"

      - alert: ErrorBudgetBurnRate
        expr: |
          (
            sum(rate(evolith_http_requests_total{status=~"5.."}[1h])) / sum(rate(evolith_http_requests_total[1h]))
          ) > 14.4 * (1 - 0.999)
        for: 5m
        labels:
          severity: critical
          service: core-api
        annotations:
          summary: "Error budget burning too fast (1h window)"
          description: "1h burn rate {{ $value | humanizePercentage }} exceeds 14.4x threshold"

      - alert: ErrorBudgetBurnRate6h
        expr: |
          (
            sum(rate(evolith_http_requests_total{status=~"5.."}[6h])) / sum(rate(evolith_http_requests_total[6h]))
          ) > 6 * (1 - 0.999)
        for: 30m
        labels:
          severity: warning
          service: core-api
        annotations:
          summary: "Error budget burning too fast (6h window)"
          description: "6h burn rate {{ $value | humanizePercentage }} exceeds 6x threshold"

  # Master-data projection messaging (ADR-0108 / deployment strategy §5.3, GT-463).
  # MassTransit moves a message that exhausts its retries into `<queue>_error` — it never
  # nacks, so the broker DLX never fires. ANY message in an `_error` queue is a poison
  # message that needs a human: alert on depth > 0 (not a backlog threshold).
  - name: messaging-alerts
    rules:
      - alert: MassTransitPoisonMessages
        expr: rabbitmq_queue_messages{queue=~".+_error"} > 0
        for: 2m
        labels:
          severity: warning
          service: messaging
        annotations:
          summary: "Poison messages in {{ $labels.queue }}"
          description: "{{ $labels.queue }} holds {{ $value }} faulted message(s) (MassTransit _error queue). A consumer exhausted its retries; investigate and reprocess via the shovel runbook."
          runbook_url: "https://github.com/beyondnetcode/evolith/blob/main/product/operations/incident-response-poison-message-reprocess.md"

      # A projection consumer endpoint that never binds its queue means the pod is Ready but
      # the consumer is dead (the 406 redeclare failure ADR-0108 retired the CRDs to prevent).
      - alert: TenantProjectionQueueMissing
        expr: absent(rabbitmq_queue_messages{queue="ums.tenant-projection"}) or absent(rabbitmq_queue_messages{queue="tracker.tenant-projection"})
        for: 5m
        labels:
          severity: critical
          service: messaging
        annotations:
          summary: "A tenant-projection consumer endpoint queue is absent"
          description: "ums.tenant-projection and/or tracker.tenant-projection is not declared on the broker — a consumer endpoint failed to start (dead consumer behind a Ready pod)."
          runbook_url: "https://github.com/beyondnetcode/evolith/blob/main/product/operations/incident-response-poison-message-reprocess.md"
