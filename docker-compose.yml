services:

  # ── Core API ──────────────────────────────────────────────────────────────
  core-api:
    build:
      context: .
      dockerfile: apps/core-api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      CORS_ORIGINS: "*"
      CORE_PATH: /app/corpus
      WORKSPACE_ROOT: /app/corpus/workspaces
      REDIS_URL: redis://redis:6379
      SWAGGER_ENABLED: "true"
      OTEL_ENABLED: "false"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── MCP Server ────────────────────────────────────────────────────────────
  mcp-server:
    build:
      context: .
      dockerfile: packages/mcp-server/Dockerfile
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      TRANSPORT: http
      CORE_PATH: /app/corpus
      WORKSPACE_ROOT: /app/corpus
      EVOLITH_API_URL: http://core-api:3000
      EVOLITH_MCP_ALLOW_NO_AUTH: "true"
      OTEL_ENABLED: "false"
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── OTel Collector (optional, comment out if not needed) ──────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./reference/infrastructure/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4318:4318"   # OTLP HTTP
      - "4317:4317"   # OTLP gRPC
    profiles:
      - observability

volumes:
  redis-data:
