version: '3.8'

services:
  # ---------------------------------------------------------
  # 1. Primary Relational Database (PostgreSQL 16)
  # ---------------------------------------------------------
  postgres:
    # ADR-0112 §3 — pgvector on the PostgreSQL instance Evolith already runs.
    # Drop-in for postgres:16-alpine (same PG 16) plus the `vector` extension.
    image: pgvector/pgvector:pg16
    container_name: ums-postgres
    restart: always
    environment:
      POSTGRES_USER: ums_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ums_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Provisions the evolith_rag database + pgvector extension + rag_chunks on
      # first init. The DDL is mounted from its single source of truth, not copied.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ../../.harness/scripts/ci/rag-pgvector.schema.sql:/evolith/rag-pgvector.schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ums_user -d ums_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - ums-network

  # ---------------------------------------------------------
  # 1.1 Enterprise SQL Server (Latest)
  # ---------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ums-sqlserver
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD}' -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
    networks:
      - ums-network

  # ---------------------------------------------------------
  # 1.2 Document Database (MongoDB 7.0)
  # ---------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: ums-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ums_user
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
    networks:
      - ums-network

  # ---------------------------------------------------------
  # 2. High-Performance Cache (Redis 7.2)
  # ---------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: ums-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    networks:
      - ums-network

  # ---------------------------------------------------------
  # 3. Message Broker & Event Bus (RabbitMQ)
  # ---------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: ums-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ums_mq_user
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"     # AMQP Protocol
      - "15672:15672"   # Management Dashboard Console
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - ums-network

  # ---------------------------------------------------------
  # 4. S3-Compatible Object Storage (MinIO)
  # ---------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: ums-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ums_minio_admin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"     # S3 API Port
      - "9001:9001"     # Web Administration Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - ums-network

  # ---------------------------------------------------------
  # 5. Secrets and Key Management (OpenBao — Vault fork, Linux Foundation)
  # ---------------------------------------------------------
  openbao:
    image: openbao/openbao:2.5
    container_name: ums-openbao
    restart: always
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${BAO_DEV_ROOT_TOKEN}
      BAO_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"     # OpenBao HTTP API (Vault-compatible)
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    networks:
      - ums-network

  # ---------------------------------------------------------
  # 6. Public API Gateway (Traefik Proxy)
  # ---------------------------------------------------------
  traefik:
    image: traefik:v3.1
    container_name: ums-traefik
    restart: always
    command:
      - "--ping=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:8000"
    ports:
      - "8000:8000"     # Public HTTP Proxy Gateway
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-dynamic.yml:/etc/traefik/dynamic/traefik-dynamic.yml:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    networks:
      - ums-network


  # ---------------------------------------------------------
  # 9. OpenTelemetry Collector (OTel)
  # ---------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    container_name: ums-otel-collector
    restart: always
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ../operations/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - ums-network
    depends_on:
      - loki
      - tempo

  # ---------------------------------------------------------
  # 10. Distributed Tracing (Grafana Tempo)
  # ---------------------------------------------------------
  tempo:
    image: grafana/tempo:2.4.1
    container_name: ums-tempo
    restart: always
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ../operations/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"     # Tempo query port
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - ums-network

  # ---------------------------------------------------------
  # 11. Log Aggregation (Grafana Loki)
  # ---------------------------------------------------------
  loki:
    image: grafana/loki:2.9.8
    container_name: ums-loki
    restart: always
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    ports:
      - "3100:3100"     # Loki HTTP
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - ums-network

  # ---------------------------------------------------------
  # 12. Unified Dashboard (Grafana)
  # ---------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.1
    container_name: ums-grafana
    restart: always
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ADMIN_PASSWORD=changeme
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ../operations/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"     # Grafana UI
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    depends_on:
      - loki
      - tempo
    networks:
      - ums-network

  # ---------------------------------------------------------
  # 13. REMOVED — API Backend-for-Frontend (BFF)
  # ---------------------------------------------------------
  # This file is the shared BACKING-SERVICES stack (databases, broker, object
  # store, gateway, observability). Evolith's own services are NOT deployed from
  # here: `docker-compose.evolith.yml` (engine) and `docker-compose.fullstack.yml`
  # (engine + Tracker + UI) build them from the real per-service Dockerfiles.
  #
  # A `bff` service used to sit here, and it could never have started:
  #   - its build context was `./docker`, a directory holding two illustrative
  #     Dockerfiles and no `package.json`, so `COPY package*.json ./` +
  #     `npm ci` failed on the first layer;
  #   - it mounted `../../../rulesets`, which resolves to a sibling of the
  #     repository root — the ruleset corpus has lived at `src/rulesets` since
  #     the `src/`-nested cutover (GT-450).
  # `deployment-topology.md` already records that no `bff` remains on any deploy
  # path and that `product/infra/docker/*.Dockerfile` are reference-only
  # templates; this file now agrees with that. The real service is `core-api`
  # (ADR-0074).

  # ---------------------------------------------------------
  # 14. Metrics Storage (Prometheus)
  # ---------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ums-prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ../operations/otel/prometheus-config.yml:/etc/prometheus/prometheus.yml:ro
      - ../operations/alerts/prometheus-alerts.yml:/etc/prometheus/alerts/prometheus-alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - ums-network
    depends_on:
      - otel-collector

  # ---------------------------------------------------------
  # 15. Long-Term Metrics (Mimir)
  # ---------------------------------------------------------
  mimir:
    image: grafana/mimir:2.12.0
    container_name: ums-mimir
    restart: always
    command:
      - '-config.file=/etc/mimir/config.yaml'
    volumes:
      - mimir_data:/tmp/mimir
    ports:
      - "8008:8008"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    networks:
      - ums-network

  # ---------------------------------------------------------
  # 16. REMOVED — Model Context Protocol Server (MCP)
  # ---------------------------------------------------------
  # Same two defects as the removed `bff` above (build context `./docker` with
  # no `package.json`; `../../../rulesets` pointing outside the repository), and
  # the same resolution: the real MCP server is built from
  # `src/packages/mcp-server/Dockerfile` by `docker-compose.evolith.yml`,
  # `docker-compose.fullstack.yml` and the `docker-services` CI matrix.

# ---------------------------------------------------------
# Persistent Volume Declarations
# ---------------------------------------------------------
  # ADR-0112 §4 — local inference sidecar for RAG embeddings. The Node process
  # never runs the model in-process; embeddings are computed on-perimeter so
  # there is NO corpus egress. Model and dimension are pinned by ADR-0112 §1/§2
  # (Qwen3-Embedding-0.6B, 1024) and consumed via EVOLITH_RAG_EMBED_URL.
  #
  # Behind the `rag` profile: the image pulls model weights measured in GB, so it
  # must be opted into explicitly:
  #   docker compose --profile rag up -d rag-embeddings
  #
  # The write-side embedder posts OpenAI-shaped {model, input} and accepts
  # OpenAI {data:[{embedding}]}, TEI [[...]] or {embeddings} responses, so any
  # OpenAI-compatible embedding server works here.
  rag-embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: evolith-rag-embeddings
    profiles: ["rag"]
    restart: unless-stopped
    command: ["--model-id", "Qwen/Qwen3-Embedding-0.6B", "--port", "8080"]
    ports:
      - "8085:8080"
    volumes:
      - rag_embeddings_cache:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
    networks:
      - ums-network

volumes:
  rag_embeddings_cache:
  postgres_data:
  sqlserver_data:
  mongodb_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  openbao_data:
  tempo_data:
  loki_data:
  grafana_data:
  prometheus_data:
  mimir_data:

# ---------------------------------------------------------
# Isolated Secure Networks
# ---------------------------------------------------------
networks:
  ums-network:
    driver: bridge
