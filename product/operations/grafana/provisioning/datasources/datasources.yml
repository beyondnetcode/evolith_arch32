apiVersion: 1

datasources:
  # GT-544: Prometheus datasource for the metrics plane (gate/HTTP/agent metrics). Marked
  # default so the provisioned Governance Health + SRE (RED) dashboards resolve without setup.
  - name: Prometheus
    uid: evolith-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
