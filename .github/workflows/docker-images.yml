name: Docker Images (registry build/push)

# Builds and pushes the deployable service images to GHCR for Kubernetes/Helm
# deployments. Coolify builds from git directly and does NOT need this; K8s does
# (the Helm charts reference registry images).
#
# Triggers are intentionally conservative — no build on every push:
#   - workflow_dispatch: manual run (pick the tag).
#   - push tags `v*`: release builds, tagged with the git tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (defaults to short SHA)"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: evolith-agent-runtime
            dockerfile: apps/agent-runtime-api/Dockerfile
          - name: evolith-core-api
            dockerfile: apps/core-api/Dockerfile
          - name: evolith-mcp-server
            dockerfile: packages/mcp-server/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=,format=short
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Build context is the repository root for all services (the Dockerfiles
          # COPY repo-relative paths; agent-runtime builds the workspace packages).
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
