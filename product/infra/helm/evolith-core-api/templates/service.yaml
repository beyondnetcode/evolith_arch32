apiVersion: v1
kind: Service
metadata:
  name: {{ include "evolith-core-api.fullname" . }}
  labels:
    app: {{ include "evolith-core-api.name" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      # PINNED on purpose. An unpinned NodePort is allocated at random from
      # 30000-32767, so it changes on reinstall — and a cross-cluster consumer
      # configured against it would break every time the chart is reinstalled,
      # which is the failure `extraPortMappings` exists to prevent.
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    app: {{ include "evolith-core-api.name" . }}
