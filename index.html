opology axis crosses them at a right angle and guard 30 keeps the two from ever mixing.","es":"Las reglas de compuerta salen del corpus y corren de izquierda a derecha; el eje de topología las cruza en ángulo recto y el guard 30 impide que se mezclen."},"steps":[{"edge":"corpus-phases"},{"edge":"gate-1"},{"edge":"gate-2"},{"edge":"gate-3"},{"edge":"gate-4"},{"edge":"axes-disjoint"}]}],"chapters":[{"id":"promise","order":1,"title":{"en":"The promise","es":"La promesa"},"hook":{"en":"Coverage and compliance are never painted the same green.","es":"Cobertura y cumplimiento nunca se pintan del mismo verde."},"question":{"en":"Which rules?","es":"¿Qué reglas?"},"focus":{"nodes":["humans","ci","npm-cli","evolith-cli","gh-action","rule-engines","verdict","core-corpus"],"halfLit":[],"edges":["ship-npm-cli","humans-cli","ci-action","action-cli","cli-engines","engines-corpus","engines-verdict","verdict-cli","verdict-action"],"halfLitEdges":[]},"packets":{"mode":"relay","edges":["ship-npm-cli","humans-cli","cli-engines","engines-corpus","engines-verdict","verdict-cli"],"staggerMs":350},"badges":[{"node":"evolith-cli","text":{"en":"exit 2 · 71 issues · 37 blocking · 9 never ran","es":"exit 2 · 71 hallazgos · 37 bloqueantes · 9 nunca corrieron"}}],"camera":{"fit":"focus","pad":96},"evidence":[{"value":{"en":"159 selected · 133 evaluated · 26 skipped · 71 issues · 37 blocking · 9 blocking because skipped · exit 2","es":"159 seleccionadas · 133 evaluadas · 26 omitidas · 71 hallazgos · 37 bloqueantes · 9 bloqueantes por omisión · exit 2"},"label":{"en":"First run on an empty repository","es":"Primera corrida en un repositorio vacío"},"asOf":"2026-08-21","source":"docs/evidence/first-run-capture.md:11-53","kind":"observed","levels":["executive","architect","engineer"]},{"value":{"en":"exit 0 pass · 1 tool failed · 2 gate blocked · 3 invalid invocation","es":"exit 0 aprobado · 1 fallo de herramienta · 2 compuerta bloqueada · 3 invocación inválida"},"label":{"en":"Closed set of exit codes","es":"Conjunto cerrado de códigos de salida"},"asOf":"2026-09-19","source":"src/sdk/cli/src/infrastructure/cli/exit-codes.ts:11-34","kind":"measured","levels":["architect","engineer"]},{"value":{"en":"@beyondnet/evolith-cli 1.4.0","es":"@beyondnet/evolith-cli 1.4.0"},"label":{"en":"Published CLI","es":"CLI publicado"},"asOf":"2026-09-19","source":"src/sdk/cli/package.json","kind":"package","levels":["engineer"]}],"narration":{"executive":{"en":"Evolith is an architecture linter for CI. One command reads your repository and checks it against a library of rules; if a blocking rule fails, the pull request fails. The part that matters: a rule it could not evaluate counts as a failure, never as a pass. Nothing leaves your machine — no server, no database, no model.","es":"Evolith es un linter de arquitectura para CI. Un comando lee tu repositorio y lo contrasta con una biblioteca de reglas; si una regla bloqueante falla, el pull request falla. Lo que importa: una regla que no pudo evaluar cuenta como fallo, nunca como aprobado. Nada sale de tu máquina: ni servidor, ni base de datos, ni modelo."},"architect":{"en":"Two verbs stay apart: READ and CONTROL. Catalogs, ADRs and gates are read-only sources; Evolith compiles them into executable guardrails that run where the change is proposed. The verdict is a closed set — a rule ends passed, failed, skipped or errored — and a blocking rule that ended skipped blocks exactly like one that failed (`blockingSkippedRuleIds`). On an empty repository the captured first run (2026-08-21, @beyondnet/evolith-cli@1.3.2) selected 159 rules, evaluated 133, skipped 26 and exited 2 with 37 blocking issues, 9 of them rules that never ran.","es":"Dos verbos se mantienen separados: LEER y CONTROLAR. Catálogos, ADRs y compuertas son fuentes de solo lectura; Evolith los compila en barreras ejecutables que corren donde se propone el cambio. El veredicto es un conjunto cerrado —una regla termina aprobada, fallida, omitida o con error— y una regla bloqueante que terminó omitida bloquea exactamente igual que una fallida (`blockingSkippedRuleIds`). En un repositorio vacío, la primera corrida capturada (2026-08-21, @beyondnet/evolith-cli@1.3.2) seleccionó 159 reglas, evaluó 133, omitió 26 y salió con código 2 y 37 hallazgos bloqueantes, 9 de ellos reglas que nunca corrieron."},"engineer":{"en":"`npx -y @beyondnet/evolith-cli init --name my-project --yes` writes `evolith.yaml`; `npx -y @beyondnet/evolith-cli validate --engine opa` exits `0` pass · `1` tool failed (no verdict) · `2` gate blocked · `3` invalid invocation — `1` and `3` mean not evaluated, never a softer fail. `--format json` prints exactly one ADR-0073 envelope `{ success, data | error { code, message }, meta }` on stdout, diagnostics on stderr. In CI: `uses: beyondnetcode/evolith_arch32@v1` with `fail-on-violation: true`; outputs `compliance-status`, `violations-count`, `issues-count`, `exit-code`, `report-path`; the job summary prints \"Not evaluated\" in words when no verdict exists. Captured 2026-08-21: `Rules Checked 133 · Rules Skipped 26 · Rules Errored 0 · Rules Total 159`, 71 issues, 37 blocking, 9 blocking-because-skipped, exit 2.","es":"`npx -y @beyondnet/evolith-cli init --name my-project --yes` escribe `evolith.yaml`; `npx -y @beyondnet/evolith-cli validate --engine opa` sale con `0` aprobado · `1` fallo de herramienta (sin veredicto) · `2` compuerta bloqueada · `3` invocación inválida; `1` y `3` significan no evaluado, nunca un fallo más suave. `--format json` imprime exactamente un sobre ADR-0073 `{ success, data | error { code, message }, meta }` en stdout y los diagnósticos en stderr. En CI: `uses: beyondnetcode/evolith_arch32@v1` con `fail-on-violation: true`; outputs `compliance-status`, `violations-count`, `issues-count`, `exit-code`, `report-path`; el resumen del job imprime «Not evaluated» en palabras cuando no existe veredicto. Capturado el 2026-08-21: `Rules Checked 133 · Rules Skipped 26 · Rules Errored 0 · Rules Total 159`, 71 hallazgos, 37 bloqueantes, 9 bloqueantes por omisión, exit 2."}},"sources":[{"path":"README.md","anchor":"L12-L26","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/README.md#L12-L26"},{"path":"README.md","anchor":"L34-L48","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/README.md#L34-L48"},{"path":"docs/evidence/first-run-capture.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/docs/evidence/first-run-capture.md"},{"path":"action.yml","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/action.yml"}],"poster":{"regions":["region-doors","region-outcomes"],"band":"doors"}},{"id":"constitution","order":2,"title":{"en":"One repository is the Constitution","es":"Un repositorio es la Constitución"},"hook":{"en":"Markdown explains, rules define, engines enforce.","es":"El Markdown explica, las reglas definen, los motores hacen cumplir."},"question":{"en":"Who runs them — and what do they keep?","es":"¿Quién las ejecuta y qué guarda?"},"focus":{"nodes":["core-corpus","security-standards","knowledge-os","satellites"],"halfLit":["rule-engines"],"edges":["security-corpus","engines-corpus"],"halfLitEdges":["corpus-satellites"]},"packets":{"mode":"relay","edges":["security-corpus","engines-corpus"],"staggerMs":350},"badges":[{"node":"core-corpus","text":{"en":"144 ADRs · 184 packs · 417 rules","es":"144 ADRs · 184 paquetes · 417 reglas"}}],"camera":{"fit":"lane:constitution","pad":64},"evidence":[{"value":{"en":"144 ADRs (core 105 · nodejs 21 · dotnet 12 · android 1 · ai-augmented 5) · newest ADR-0129","es":"144 ADRs (core 105 · nodejs 21 · dotnet 12 · android 1 · ai-augmented 5) · el más reciente ADR-0129"},"label":{"en":"Architecture decisions","es":"Decisiones de arquitectura"},"asOf":"2026-09-19","source":"reference/core/control-center/maturity-reports/inventory-summary.md:10 (CI inventory 2026-09-01; re-counted on the tree)","kind":"measured","levels":["executive","architect","engineer"]},{"value":{"en":"184 packs · 21 categories · 50 schemas · 138 generated from ADRs","es":"184 paquetes · 21 categorías · 50 esquemas · 138 generados desde ADRs"},"label":{"en":"Rule packs","es":"Paquetes de reglas"},"asOf":"2026-09-01","source":"reference/core/control-center/maturity-reports/inventory-summary.md:11-12","kind":"generated","levels":["executive","architect","engineer"]},{"value":{"en":"417 rule rows (415 loadable, 2026-08-23) · published @beyondnet/evolith-cli@1.3.2: 177 packs · 412 rules (2026-08-21)","es":"417 filas de reglas (415 cargables, 2026-08-23) · publicado @beyondnet/evolith-cli@1.3.2: 177 paquetes · 412 reglas (2026-08-21)"},"label":{"en":"Two denominators, both labelled","es":"Dos denominadores, ambos etiquetados"},"asOf":"2026-09-19","source":"src/rulesets/standards/iso-5055-mapping.json; src/rulesets/standards/native-evaluability-snapshot.json; docs/known-limitations.md","kind":"generated","levels":["architect","engineer"]}],"narration":{"executive":{"en":"Every rule traces back to a written decision. One public repository under the MIT licence holds 144 architecture decisions and, derived from them, 184 rule packs in 21 categories — 417 rules, plus 50 schemas, 8 reference topologies and 3 standards packs. Nothing hides inside a service: read, edit and version the rules like any file; CI measures the counts.","es":"Cada regla se remonta a una decisión escrita. Un solo repositorio público bajo licencia MIT guarda 144 decisiones de arquitectura y, derivados de ellas, 184 paquetes de reglas en 21 categorías —417 reglas—, más 50 esquemas, 8 topologías de referencia y 3 paquetes de estándares. Nada se esconde en un servicio: lee, edita y versiona las reglas como cualquier archivo; CI mide los conteos."},"architect":{"en":"The source-of-truth ladder is explicit (ADR-0041): Markdown explains, `*.rules.json` defines, and OPA plus the Native evaluator both enforce. 138 of the 184 packs are generated from the ADRs themselves, so a decision and its check cannot drift apart; security standards ADR-0119…0124 ship as generated conformance packs; the artifact registry (ADR-0125, 33 artifacts) is the single keyed list the phase-gate rules derive from. The Knowledge OS (M0) beside the corpus is memory for the product, not for the AI. Counts: CI inventory 2026-09-01, re-counted on the tree 2026-09-21.","es":"La escalera de fuentes de verdad es explícita (ADR-0041): el Markdown explica, los `*.rules.json` definen, y OPA y el evaluador nativo hacen cumplir. 138 de los 184 paquetes se generan desde los propios ADRs, así que una decisión y su comprobación no pueden divergir; los estándares de seguridad ADR-0119…0124 se entregan como paquetes de conformidad generados; el registro de artefactos (ADR-0125, 33 artefactos) es la única lista con clave de la que derivan las reglas de compuerta. El Knowledge OS (M0) junto al corpus es memoria para el producto, no para la IA. Conteos: inventario de CI del 2026-09-01, recontados en el árbol el 2026-09-21."},"engineer":{"en":"Layout: `reference/core/architecture/adrs/{core,nodejs,dotnet,android,ai-augmented}` (144 files by the generator's `^\\d{4}-` rule; `ADR-0114` reserved, never authored), `src/rulesets/**/*.rules.json` (184 packs, 21 categories, 138 under `adr/generated/`), `src/rulesets/schema/` (50), `src/rulesets/sdlc/artifact-registry.json` (33 artifacts: 24 binding, 9 advisory). Rule rows: 417 (`iso-5055-mapping.json`), 415 loadable by the native triage (snapshot 2026-08-23). `evolith rulesets` prints what *your* installation loads: the published `@beyondnet/evolith-cli@1.3.2` tarball carries 177 packs / 412 rules (measured 2026-08-21) — two denominators, always labelled, never mixed. Standards packs: NIST SSDF v1.1 (8 rules) · ISO/IEC 5055:2021 (4) · SLSA v1.0 (4); 37 of 417 rules map to ISO/IEC 5055 (8 direct, 29 partial).","es":"Estructura: `reference/core/architecture/adrs/{core,nodejs,dotnet,android,ai-augmented}` (144 archivos según la regla `^\\d{4}-` del generador; `ADR-0114` reservado, nunca redactado), `src/rulesets/**/*.rules.json` (184 paquetes, 21 categorías, 138 bajo `adr/generated/`), `src/rulesets/schema/` (50), `src/rulesets/sdlc/artifact-registry.json` (33 artefactos: 24 vinculantes, 9 consultivos). Filas de reglas: 417 (`iso-5055-mapping.json`), 415 cargables por el triaje nativo (instantánea 2026-08-23). `evolith rulesets` imprime lo que carga *tu* instalación: el tarball publicado `@beyondnet/evolith-cli@1.3.2` lleva 177 paquetes / 412 reglas (medido 2026-08-21); dos denominadores, siempre etiquetados, nunca mezclados. Paquetes de estándares: NIST SSDF v1.1 (8 reglas) · ISO/IEC 5055:2021 (4) · SLSA v1.0 (4); 37 de 417 reglas mapean a ISO/IEC 5055 (8 directas, 29 parciales)."}},"sources":[{"path":"src/rulesets/README.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/src/rulesets/README.md"},{"path":"src/rulesets/opa/README.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/src/rulesets/opa/README.md"},{"path":"src/rulesets/standards/README.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/src/rulesets/standards/README.md"},{"path":"reference/core/architecture/adrs/README.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/reference/core/architecture/adrs/README.md"},{"path":"reference/knowledge/README.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/reference/knowledge/README.md"}],"poster":{"regions":["region-constitution"],"band":"core"}},{"id":"stateless-engine","order":3,"title":{"en":"The Core evaluates and forgets","es":"El Core evalúa y olvida"},"hook":{"en":"A verdict is not a decision.","es":"Un veredicto no es una decisión."},"question":{"en":"How is a verdict computed — and what if a rule cannot run?","es":"¿Cómo se calcula un veredicto y qué pasa si una regla no puede correr?"},"focus":{"nodes":["core-api","rule-engines","verdict","sdk","capability-manifest"],"halfLit":["tracker"],"edges":["rest-engines","engines-verdict","verdict-rest","core-api-manifest","sdk-core-api"],"halfLitEdges":["tracker-core-api","core-api-tracker"]},"packets":{"mode":"relay","edges":["rest-engines","engines-verdict","verdict-rest"],"staggerMs":350},"badges":[{"node":"core-api","text":{"en":"decisionRecommendation · binding: false","es":"decisionRecommendation · binding: false"}}],"camera":{"fit":"focus","pad":96},"evidence":[{"value":{"en":"EvaluationContext schema 1.0.0 → EvaluationResult schema 2.0.0","es":"EvaluationContext esquema 1.0.0 → EvaluationResult esquema 2.0.0"},"label":{"en":"The contract","es":"El contrato"},"asOf":"2026-09-19","source":"src/packages/core-domain/src/evaluation/contracts/evaluation-context.ts","kind":"measured","levels":["architect","engineer"]},{"value":{"en":"decisionRecommendation { binding: false, recommendedBy: 'evolith-core' }","es":"decisionRecommendation { binding: false, recommendedBy: 'evolith-core' }"},"label":{"en":"Non-binding by contract","es":"No vinculante por contrato"},"asOf":"2026-06-29","source":"reference/core/architecture/adrs/core/0101-core-stateless-evaluation-engine.md (ADR-0101, Accepted 2026-06-29)","kind":"generated","levels":["executive","architect","engineer"]},{"value":{"en":"12 EvaluationKinds · 4 pipeline · 7 KindEvaluators (CLI · MCP) · 5 wired in core-api","es":"12 EvaluationKinds · 4 de pipeline · 7 KindEvaluators (CLI · MCP) · 5 cableados en core-api"},"label":{"en":"Kinds and evaluators","es":"Tipos y evaluadores"},"asOf":"2026-09-19","source":"src/packages/core-domain/src/evaluation/kind-evaluators.ts; src/apps/core-api/src/app.module.ts:132-146","kind":"measured","levels":["engineer"]}],"narration":{"executive":{"en":"The Core is deliberately forgetful. It receives a description of a repository, checks it against versioned rules and returns a result — it stores no product, no tenant, no decision. That result is a recommendation, marked non-binding on purpose: the authority to say \"approved\" stays with whoever called. Remember it: it pays off in chapter ten.","es":"El Core es olvidadizo a propósito. Recibe la descripción de un repositorio, la contrasta con reglas versionadas y devuelve un resultado: no guarda producto, ni tenant, ni decisión. Ese resultado es una recomendación, marcada como no vinculante adrede: la autoridad para decir «aprobado» se queda con quien llamó. Recuérdalo: se cobra en el capítulo diez."},"architect":{"en":"ADR-0101 makes the Core a stateless evaluation engine: `EvaluationContext` in, `EvaluationResult` out; `tenantId`, `productId`, `initiativeId`, `phaseId` and `gateId` are opaque pass-through; the binding `GateDecision` belongs to whoever owns the process, and the Core emits `decisionRecommendation { binding: false }`. Facts travel inside the context — `evaluationInput.files`, `qualitySignals` (ADR-0111), `repoFacts`, `design` (ADR-0104) — mounted on an in-memory overlay that never writes, so the Core needs no repository access of its own. 12 evaluation kinds exist; CLI and MCP wire 7 evaluators, REST `POST /api/v1/evaluate` wires five, and the `evidence` kind is refused rather than faked.","es":"ADR-0101 convierte al Core en un motor de evaluación sin estado: entra un `EvaluationContext`, sale un `EvaluationResult`; `tenantId`, `productId`, `initiativeId`, `phaseId` y `gateId` son opacos y pasan de largo; la `GateDecision` vinculante pertenece a quien es dueño del proceso, y el Core emite `decisionRecommendation { binding: false }`. Los hechos viajan dentro del contexto —`evaluationInput.files`, `qualitySignals` (ADR-0111), `repoFacts`, `design` (ADR-0104)— montados en un overlay en memoria que nunca escribe, así que el Core no necesita acceso propio al repositorio. Existen 12 tipos de evaluación; CLI y MCP cablean 7 evaluadores, REST `POST /api/v1/evaluate` cablea cinco, y el tipo `evidence` se rechaza en lugar de fingirse."},"engineer":{"en":"`EVALUATION_CONTEXT_SCHEMA_VERSION = '1.0.0'`, `EVALUATION_RESULT_SCHEMA_VERSION = '2.0.0'` (GT-688 MAJOR: `results.topology` is an array). `POST /api/v1/evaluate` input branches, in priority: `evaluationInput.files` (inline) → `workspaceRef` (ADR-0074) → `satellitePath` (legacy) → else 400. Inline files mount on `OverlayFileSystem` at `/inmem/satellite`; corpus reads delegate to disk; nothing is written. `executionMode: manual | hybrid | agentic`; `requester.actorType: human | agent | ci | system`. Kinds: 12; pipeline kinds `gate, artifact, rule, compliance`; `createDefaultKindEvaluators` = 7 (CLI `evaluate`, MCP `evolith-evaluate`); core-api's factory wires 5 (no `design`, `phase-artifacts`); `evidence` → `UnsupportedEvaluationKindError`. Manifest: `GET /api/v1/capabilities` and `evolith://capabilities` (`@beyondnet/evolith-contracts` 1.3.0); typed client `@beyondnet/evolith-sdk` 2.0.1, Node-only.","es":"`EVALUATION_CONTEXT_SCHEMA_VERSION = '1.0.0'`, `EVALUATION_RESULT_SCHEMA_VERSION = '2.0.0'` (GT-688 MAJOR: `results.topology` es un array). Ramas de entrada de `POST /api/v1/evaluate`, por prioridad: `evaluationInput.files` (inline) → `workspaceRef` (ADR-0074) → `satellitePath` (heredado) → si no, 400. Los archivos inline se montan en `OverlayFileSystem` en `/inmem/satellite`; las lecturas del corpus se delegan al disco; nada se escribe. `executionMode: manual | hybrid | agentic`; `requester.actorType: human | agent | ci | system`. Tipos: 12; tipos del pipeline `gate, artifact, rule, compliance`; `createDefaultKindEvaluators` = 7 (CLI `evaluate`, MCP `evolith-evaluate`); la fábrica de core-api cablea 5 (sin `design` ni `phase-artifacts`); `evidence` → `UnsupportedEvaluationKindError`. Manifiesto: `GET /api/v1/capabilities` y `evolith://capabilities` (`@beyondnet/evolith-contracts` 1.3.0); cliente tipado `@beyondnet/evolith-sdk` 2.0.1, solo Node."}},"sources":[{"path":"reference/core/architecture/adrs/core/0101-core-stateless-evaluation-engine.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/reference/core/architecture/adrs/core/0101-core-stateless-evaluation-engine.md"},{"path":"src/apps/core-api/README.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/src/apps/core-api/README.md"},{"path":"src/packages/core-domain/src/infrastructure/overlay/overlay-file-system.ts","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/src/packages/core-domain/src/infrastructure/overlay/overlay-file-system.ts"}],"poster":{"regions":["region-formula","region-bus"],"band":"core"}},{"id":"three-engines","order":4,"title":{"en":"Three engines, one verdict","es":"Tres motores, un veredicto"},"hook":{"en":"“Could not evaluate” is never a pass.","es":"«No se pudo evaluar» nunca es un aprobado."},"question":{"en":"Who can call it?","es":"¿Quién puede llamarlo?"},"focus":{"nodes":["rule-engines","core-corpus","verdict","finding-authority"],"halfLit":["known-limits"],"edges":["engines-corpus","engines-verdict","verdict-finding"],"halfLitEdges":["verdict-limits"]},"packets":{"mode":"stagger","edges":["engines-corpus","engines-corpus","engines-corpus","engines-verdict","verdict-finding"],"staggerMs":400},"badges":[{"node":"rule-engines","text":{"en":"passed · failed · skipped · errored","es":"passed · failed · skipped · errored"}}],"camera":{"fit":"focus","pad":96},"evidence":[{"value":{"en":"Native 19 handlers · OPA/Wasm 35 policies · 4 entrypoints · OPA v1.19.0 · Enforcer 6 sandboxed analysers","es":"Native 19 handlers · OPA/Wasm 35 políticas · 4 entrypoints · OPA v1.19.0 · Enforcer 6 analizadores en sandbox"},"label":{"en":"Three engines","es":"Tres motores"},"asOf":"2026-09-19","source":"src/packages/core-domain/src/application/validators/evaluators/native-evaluator.ts:33-72; src/rulesets/opa/main.rego; src/packages/core-domain/src/application/validators/enforcement/enforcer-subsystem.ts:40-66","kind":"measured","levels":["executive","architect","engineer"]},{"value":{"en":"--engine opa 133/159 · native 41/159","es":"--engine opa 133/159 · native 41/159"},"label":{"en":"Coverage on this repository","es":"Cobertura en este repositorio"},"asOf":"2026-08-21","source":"docs/known-limitations.md:13-20 (cli 1.3.2)","kind":"observed","levels":["executive","architect","engineer"]},{"value":{"en":"6 host-dispatchable Wasm builtins","es":"6 builtins de Wasm despachables por el host"},"label":{"en":"What the bundle can call (guard 55)","es":"Lo que el bundle puede invocar (guard 55)"},"asOf":"2026-09-19","source":".harness/scripts/ci/55-validate-wasm-builtin-support.mjs","kind":"measured","levels":["engineer"]}],"narration":{"executive":{"en":"Three engines read the same rules: a native evaluator, a policy engine compiled to WebAssembly, and sandboxed external analysers for checks needing a real tool. Whichever runs, a rule ends in one of four states — passed, failed, skipped or errored — and a blocking rule that ended skipped or errored fails the run. Coverage is printed beside compliance, dated.","es":"Tres motores leen las mismas reglas: un evaluador nativo, un motor de políticas compilado a WebAssembly y analizadores externos en sandbox para comprobaciones que necesitan una herramienta real. Corra el que corra, una regla termina en uno de cuatro estados —aprobada, fallida, omitida o con error— y una regla bloqueante que terminó omitida o con error hace fallar la corrida. La cobertura se imprime junto al cumplimiento, con fecha."},"architect":{"en":"Dual-Engine Parity (ADR-0041) keeps Native TS and OPA answering the same rule ids, and guard 68 holds them to fact agreement inside the required `Test` job. The Enforcer subsystem wraps dependency-cruiser, NetArchTest, import-linter, checkov, trivy and ISO 5055 SARIF behind one contract. Fail-closed is structural, not a flag: a missing `policy.wasm` fails every rule, an engine throw fails every rule, an undeclared rule id is `skipped` with evaluability `no-policy-in-bundle`, an empty corpus raises `RulesetsNotFoundError`. Evidence carries `determinism` and provenance; a probabilistic signal blocks only with fresh calibration (GT-584).","es":"La paridad de doble motor (ADR-0041) mantiene a Native TS y OPA respondiendo a los mismos ids de regla, y el guard 68 los obliga a coincidir en hechos dentro del job obligatorio `Test`. El subsistema Enforcer envuelve dependency-cruiser, NetArchTest, import-linter, checkov, trivy y SARIF de ISO 5055 tras un solo contrato. El fallo cerrado es estructural, no una bandera: un `policy.wasm` ausente hace fallar todas las reglas, una excepción del motor hace fallar todas las reglas, un id de regla no declarado queda `skipped` con evaluabilidad `no-policy-in-bundle`, un corpus vacío lanza `RulesetsNotFoundError`. La evidencia lleva `determinism` y procedencia; una señal probabilística solo bloquea con calibración reciente (GT-584)."},"engineer":{"en":"`--engine opa|native`; `rulesExecuted[].engine ∈ {native, opa, enforcer}`; per-rule outcome `passed | failed | skipped | errored`; run status `passed | failed | warning`; `Verdict = PASS | FAIL | WAIVE | SKIP`. `npm run build:policy` → `opa build -t wasm -e evolith/main/violations -e evolith/abac/violations -e evolith/manifest/declared_rule_ids` (35 packages aggregated by `main.rego`, OPA v1.19.0); the bundle self-declares the rule ids it can decide (GT-675). Only `json.is_valid`, `sprintf`, `regex.split`, `yaml.is_valid`, `yaml.marshal`, `yaml.unmarshal` are host-dispatchable — guard 55 reads the compiled bundle's `builtins()` table, not the SDK's `capabilities.json`. Handler throw → `errored`; missing `evolith.yaml` → `GOV-000` MUST; `--select` with no match → `SEL-01`; `--max-skipped-fraction` sets the coverage floor. On this repository (2026-08-21, cli 1.3.2): opa 133/159, native 41/159.","es":"`--engine opa|native`; `rulesExecuted[].engine ∈ {native, opa, enforcer}`; resultado por regla `passed | failed | skipped | errored`; estado de la corrida `passed | failed | warning`; `Verdict = PASS | FAIL | WAIVE | SKIP`. `npm run build:policy` → `opa build -t wasm -e evolith/main/violations -e evolith/abac/violations -e evolith/manifest/declared_rule_ids` (35 paquetes agregados por `main.rego`, OPA v1.19.0); el bundle autodeclara los ids de regla que puede decidir (GT-675). Solo `json.is_valid`, `sprintf`, `regex.split`, `yaml.is_valid`, `yaml.marshal` y `yaml.unmarshal` son despachables por el host; el guard 55 lee la tabla `builtins()` del bundle compilado, no el `capabilities.json` del SDK. Excepción en un handler → `errored`; `evolith.yaml` ausente → `GOV-000` MUST; `--select` sin coincidencias → `SEL-01`; `--max-skipped-fraction` fija el piso de cobertura. En este repositorio (2026-08-21, cli 1.3.2): opa 133/159, native 41/159."}},"sources":[{"path":"src/rulesets/opa/README.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/src/rulesets/opa/README.md"},{"path":"docs/known-limitations.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/docs/known-limitations.md"},{"path":"reference/core/architecture/adrs/core/0041-dual-engine-policy-evaluation.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/reference/core/architecture/adrs/core/0041-dual-engine-policy-evaluation.md"}],"poster":{"regions":["region-engine","region-outcomes"],"band":"core"}},{"id":"four-doors","order":5,"title":{"en":"Four doors, one contract","es":"Cuatro puertas, un contrato"},"hook":{"en":"CLI · GitHub Action · MCP · REST — same rules, same envelope.","es":"CLI · GitHub Action · MCP · REST: mismas reglas, mismo sobre."},"question":{"en":"A linter checks files — where is the lifecycle?","es":"Un linter revisa archivos: ¿dónde está el ciclo de vida?"},"focus":{"nodes":["humans","ci","ai-agents","npm-cli","npm-mcp","gh-marketplace","mcp-registry","claude-plugin","ghcr","evolith-cli","gh-action","mcp-server","core-api","sdk","capability-manifest"],"halfLit":[],"edges":["ship-npm-cli","ship-npm-mcp","ship-marketplace","ship-registry","ship-plugin","ship-ghcr-api","humans-cli","ci-action","agents-mcp","action-cli","sdk-core-api","core-api-manifest"],"halfLitEdges":[]},"packets":{"mode":"stagger","edges":["humans-cli","ci-action","agents-mcp","sdk-core-api"],"staggerMs":400},"badges":[{"node":"evolith-cli","text":{"en":"38 command files","es":"38 archivos de comando"}},{"node":"mcp-server","text":{"en":"55 · 12 · 8","es":"55 · 12 · 8"}},{"node":"core-api","text":{"en":"12 controllers · 33 endpoints","es":"12 controladores · 33 endpoints"}}],"camera":{"fit":"nodes","nodes":["humans","ci","ai-agents","business-intent","npm-cli","npm-mcp","gh-marketplace","mcp-registry","claude-plugin","ghcr","evolith-cli","gh-action","mcp-server","core-api","agent-runtime-api","sdk","capability-manifest","acl"],"pad":48},"evidence":[{"value":{"en":"38 command files (generated inventory) · @beyondnet/evolith-cli 1.4.0","es":"38 archivos de comando (inventario generado) · @beyondnet/evolith-cli 1.4.0"},"label":{"en":"CLI","es":"CLI"},"asOf":"2026-09-19","source":"product/products/smart-cli/product-inventory.md:12","kind":"measured","levels":["executive","architect","engineer"]},{"value":{"en":"55 tools · 12 resources · 8 prompts · @beyondnet/evolith-mcp 1.4.0","es":"55 herramientas · 12 recursos · 8 prompts · @beyondnet/evolith-mcp 1.4.0"},"label":{"en":"MCP","es":"MCP"},"asOf":"2026-09-19","source":"product/products/smart-cli/product-inventory.md:13-15","kind":"measured","levels":["executive","architect","engineer"]},{"value":{"en":"12 controllers · 33 endpoints (measured on the tree) · matrix declares 32","es":"12 controladores · 33 endpoints (medidos en el árbol) · la matriz declara 32"},"label":{"en":"REST","es":"REST"},"asOf":"2026-09-19","source":"src/apps/core-api/src","kind":"measured","levels":["architect","engineer"]},{"value":{"en":"74 operations · CLI 43 · MCP 51 · REST 32 · 15 on all three","es":"74 operaciones · CLI 43 · MCP 51 · REST 32 · 15 en las tres"},"label":{"en":"Parity matrix","es":"Matriz de paridad"},"asOf":"2026-07-11","source":"reference/core/control-center/audits/surface-parity-matrix.json","kind":"generated","levels":["architect","engineer"]}],"narration":{"executive":{"en":"The same engine answers through four doors: a command line for a developer, a GitHub Action for the pipeline, an MCP server for an AI assistant, a REST API for another system. Each door is published where its users already look. Evolith complements ArchUnit, dependency-cruiser and Conftest; it does not replace them.","es":"El mismo motor responde por cuatro puertas: una línea de comandos para el desarrollador, una GitHub Action para el pipeline, un servidor MCP para un asistente de IA y una API REST para otro sistema. Cada puerta está publicada donde sus usuarios ya miran. Evolith complementa a ArchUnit, dependency-cruiser y Conftest; no los reemplaza."},"architect":{"en":"ADR-0074 exposes the Core product-neutrally; ADR-0073 fixes one envelope `{ success, data | error { code, message }, meta }` shared by CLI, MCP and REST. Every operation is a row in one parity matrix — 74 operations, CLI 43 · MCP 51 · REST 32, 15 on all three (reviewed 2026-07-11) — checked both ways by guard 24 in CI; an exploration suite runs 51 bindings and a confirmed divergence blocks the merge. Asymmetries are declared `exempt`: waiver, audit and calibrate are CLI-only; knowledge search MCP-only; satellite registry CRUD REST-only. Honest gap: REST `/api/v1/evaluate` wires 5 of 7 evaluators.","es":"ADR-0074 expone el Core neutral al producto; ADR-0073 fija un sobre `{ success, data | error { code, message }, meta }` compartido por CLI, MCP y REST. Cada operación es una fila de una sola matriz de paridad —74 operaciones, CLI 43 · MCP 51 · REST 32, 15 en las tres (revisada 2026-07-11)— verificada en ambos sentidos por el guard 24 en CI; una suite de exploración ejecuta 51 bindings y una divergencia confirmada bloquea el merge. Las asimetrías se declaran `exempt`: waiver, audit y calibrate son solo CLI; la búsqueda de conocimiento, solo MCP; el CRUD del registro de satélites, solo REST. Brecha honesta: REST `/api/v1/evaluate` cablea 5 de los 7 evaluadores."},"engineer":{"en":"`npx -y @beyondnet/evolith-cli init --name my-project --yes` · `uses: beyondnetcode/evolith_arch32@v1` (`fail-on-violation: true`; outputs `compliance-status`, `violations-count`, `issues-count`, `exit-code`, `report-path`) · `{ \"mcpServers\": { \"evolith\": { \"command\": \"npx\", \"args\": [\"-y\", \"@beyondnet/evolith-mcp\"] } } }` (stdio JSON-RPC 2.0 or Streamable HTTP; `Authorization: Bearer \u003cEVOLITH_API_KEY>` mandatory over HTTP; mutative tools need `{ apply: true, approvalToken }`) · `POST /api/v1/evaluate` on `ghcr.io/beyondnetcode/evolith-core-api` (`/api/v1` URI versioning, ADR-0098; `ApiKeyGuard` opt-in; Swagger only with `SWAGGER_ENABLED=true`). `--format json` prints one envelope on stdout. `evolith api --list` is generated from the live MCP. GHCR publishes 3 images (`evolith-core-api`, `evolith-mcp`, `evolith-agent-runtime`); the fourth Dockerfile (CLI) is built locally only. `POST /api/v1/architecture-plans/evaluate` (ADR-0104, Proposed) is the handler the matrix does not yet list: 33 endpoints measured on the tree, 32 declared.","es":"`npx -y @beyondnet/evolith-cli init --name my-project --yes` · `uses: beyondnetcode/evolith_arch32@v1` (`fail-on-violation: true`; outputs `compliance-status`, `violations-count`, `issues-count`, `exit-code`, `report-path`) · `{ \"mcpServers\": { \"evolith\": { \"command\": \"npx\", \"args\": [\"-y\", \"@beyondnet/evolith-mcp\"] } } }` (stdio JSON-RPC 2.0 o Streamable HTTP; `Authorization: Bearer \u003cEVOLITH_API_KEY>` obligatorio sobre HTTP; las herramientas mutativas exigen `{ apply: true, approvalToken }`) · `POST /api/v1/evaluate` en `ghcr.io/beyondnetcode/evolith-core-api` (versionado de URI `/api/v1`, ADR-0098; `ApiKeyGuard` opcional; Swagger solo con `SWAGGER_ENABLED=true`). `--format json` imprime un sobre en stdout. `evolith api --list` se genera desde el MCP en vivo. GHCR publica 3 imágenes (`evolith-core-api`, `evolith-mcp`, `evolith-agent-runtime`); el cuarto Dockerfile (CLI) solo se construye en local. `POST /api/v1/architecture-plans/evaluate` (ADR-0104, propuesto) es el handler que la matriz aún no lista: 33 endpoints medidos en el árbol, 32 declarados."}},"sources":[{"path":"README.md","anchor":"L28-L77","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/README.md#L28-L77"},{"path":"README.md","anchor":"L100-L114","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/README.md#L100-L114"},{"path":"src/packages/mcp-server/README.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/src/packages/mcp-server/README.md"},{"path":"reference/core/interfaces/README.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/reference/core/interfaces/README.md"},{"path":"src/packages/sdk-client/README.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/src/packages/sdk-client/README.md"},{"path":"src/apps/core-api/README.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/src/apps/core-api/README.md"}],"poster":{"regions":["band-1"],"band":"doors"}},{"id":"five-gates","order":6,"title":{"en":"Five gates, two axes","es":"Cinco compuertas, dos ejes"},"hook":{"en":"A checkpoint at every stage; a logbook that cannot be erased.","es":"Un control en cada etapa; una bitácora que no se puede borrar."},"question":{"en":"And when the one writing code is an AI?","es":"¿Y cuando quien escribe el código es una IA?"},"focus":{"nodes":["phase-discovery","phase-design","phase-construction","phase-qa","phase-release","topology-axis"],"halfLit":["tracker","core-corpus","evidence-graph"],"edges":["corpus-phases","gate-1","gate-2","gate-3","gate-4","release-evidence","axes-disjoint"],"halfLitEdges":["tracker-phases"]},"packets":{"mode":"relay","edges":["corpus-phases","gate-1","gate-2","gate-3","gate-4","release-evidence"],"staggerMs":450},"badges":[{"node":"phase-construction","text":{"en":"wedge (vision) — gate: Successful Build","es":"cuña (visión) — compuerta: Successful Build"}}],"camera":{"fit":"nodes","nodes":["phase-discovery","phase-design","phase-construction","phase-qa","phase-release","topology-axis"],"pad":72},"evidence":[{"value":{"en":"5 phases · 5 gates — names read from reference/governance/sdlc/{phases,gates}/*.json","es":"5 fases · 5 compuertas: nombres leídos de reference/governance/sdlc/{phases,gates}/*.json"},"label":{"en":"Canonical definitions","es":"Definiciones canónicas"},"asOf":"2026-09-19","source":"reference/governance/sdlc/phases/phase-f1.json","kind":"generated","levels":["executive","architect","engineer"]},{"value":{"en":"33 artifacts (24 binding · 9 advisory)","es":"33 artefactos (24 vinculantes · 9 consultivos)"},"label":{"en":"Artifact registry","es":"Registro de artefactos"},"asOf":"2026-08-03","source":"src/rulesets/sdlc/artifact-registry.json (ADR-0125, implemented 2026-08-03)","kind":"generated","levels":["architect","engineer"]},{"value":{"en":"8 topologies in 5 dimensions · guard 30 keeps the axes disjoint","es":"8 topologías en 5 dimensiones · el guard 30 mantiene los ejes disjuntos"},"label":{"en":"The other axis","es":"El otro eje"},"asOf":"2026-09-19","source":"reference/core/architecture/topologies/topology-dimensions.md","kind":"measured","levels":["executive","architect","engineer"]}],"narration":{"executive":{"en":"A linter checks files; Evolith knows where the product is in its life. Five phases — Conception & Discovery, Design & Architecture, Construction, Validation & QA, Delivery & Operations — each ends at a gate with named evidence and an accountable role. Nothing advances until the gate passes; every transition leaves evidence nobody can erase. Same rules for people and robots.","es":"Un linter revisa archivos; Evolith sabe en qué punto de su vida está el producto. Cinco fases —Conception & Discovery, Design & Architecture, Construction, Validation & QA, Delivery & Operations— y cada una termina en una compuerta con evidencia nombrada y un rol responsable. Nada avanza hasta que la compuerta pasa; cada transición deja evidencia que nadie puede borrar. Las mismas reglas para personas y robots."},"architect":{"en":"Phases and gates are data: `reference/governance/sdlc/phases/phase-f1…f5.json` and `gates/gate-f1…f5.json` name each gate — Business Sign-Off · Design Baseline Approved · Successful Build · RC Stamped · Production Live — with mandatory evidence, an accountable role and a waiver authority, and `phase-gates.rules.json` is generated from one artifact registry of 33 artifacts (ADR-0125), so CLI, MCP and REST evaluate the same gate. The lifecycle axis is orthogonal to the topology axis — modular-monolith → distributed-modules → microservices plus serverless, edge-computing, event-driven, data-mesh, agentic-ai (ADR-0079) — and guard 30 keeps them disjoint. \"Architecture Drift\" is the vision's wedge label for phase 3; the gate's name is Successful Build.","es":"Fases y compuertas son datos: `reference/governance/sdlc/phases/phase-f1…f5.json` y `gates/gate-f1…f5.json` nombran cada compuerta —Business Sign-Off · Design Baseline Approved · Successful Build · RC Stamped · Production Live— con evidencia obligatoria, un rol responsable y una autoridad de exención, y `phase-gates.rules.json` se genera desde un único registro de 33 artefactos (ADR-0125), de modo que CLI, MCP y REST evalúan la misma compuerta. El eje del ciclo de vida es ortogonal al eje de topología —modular-monolith → distributed-modules → microservices más serverless, edge-computing, event-driven, data-mesh, agentic-ai (ADR-0079)— y el guard 30 los mantiene disjuntos. «Architecture Drift» es la etiqueta de cuña de la visión para la fase 3; el nombre de la compuerta es Successful Build."},"engineer":{"en":"Code keys `discovery · design · construction · qa · release` (JSON ids `f1…f5`; `gate-f1…f5`, `phase-1…5` are deprecated aliases). `evolith gate evaluate --phase construction` and `evolith phase advance` block locally; REST `POST /api/v1/gates/:gateId/evaluate`, `GET /api/v1/phases/artifacts`; MCP `evolith-gate-evaluate` — the one operation with proven argument equivalence across all three surfaces. Four vocabularies, never conflated: JSON ids, code keys, artifact-profile phases `construction | quality | deployment`, and numeric `phase: 1..5` inside `phase-gates.rules.json`. Trap: `evolith.yaml` `metadata.phase ∈ {F1, F2, F3}` is the topology axis; the SDLC position is `spec.sdlc.currentPhase 1..5`. Drift is its own operation on the topology axis: `evolith drift` / `POST /api/v1/architecture/detect-drift`. `-t` overrides are unioned with the satellite's declaration (GT-688).","es":"Claves de código `discovery · design · construction · qa · release` (ids JSON `f1…f5`; `gate-f1…f5` y `phase-1…5` son alias obsoletos). `evolith gate evaluate --phase construction` y `evolith phase advance` bloquean en local; REST `POST /api/v1/gates/:gateId/evaluate`, `GET /api/v1/phases/artifacts`; MCP `evolith-gate-evaluate`: la única operación con equivalencia de argumentos probada en las tres superficies. Cuatro vocabularios, nunca confundidos: ids JSON, claves de código, fases de perfil de artefacto `construction | quality | deployment` y `phase: 1..5` numérico dentro de `phase-gates.rules.json`. Trampa: `evolith.yaml` `metadata.phase ∈ {F1, F2, F3}` es el eje de topología; la posición SDLC es `spec.sdlc.currentPhase 1..5`. La deriva es su propia operación sobre el eje de topología: `evolith drift` / `POST /api/v1/architecture/detect-drift`. Los overrides `-t` se unen a la declaración del satélite (GT-688)."}},"sources":[{"path":"reference/governance/sdlc/phases/phase-f1.json","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/reference/governance/sdlc/phases/phase-f1.json"},{"path":"reference/core/sdlc/quality-gates.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/reference/core/sdlc/quality-gates.md"},{"path":"reference/core/architecture/topologies/topology-dimensions.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/reference/core/architecture/topologies/topology-dimensions.md"},{"path":"reference/core/sdlc/01-playbooks/README.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/reference/core/sdlc/01-playbooks/README.md"}],"poster":{"regions":["region-phases","region-topology-axis"],"band":"suite"}},{"id":"governed-agents","order":7,"title":{"en":"Agents execute, never approve","es":"Los agentes ejecutan, nunca aprueban"},"hook":{"en":"Agents execute; they never approve.","es":"Los agentes ejecutan; nunca aprueban."},"question":{"en":"Does Evolith itself use a model?","es":"¿Y el propio Evolith usa un modelo?"},"focus":{"nodes":["ai-agents","mcp-server","agent-runtime-api","agent-runtime","interaction-port","engines","finding-authority","humans"],"halfLit":["rule-engines","tracker"],"edges":["agents-mcp","mcp-engines","agents-runtime-api","runtime-api-runtime","port-runtime","runtime-engine","runtime-engines","runtime-tracker","finding-humans"],"halfLitEdges":[]},"packets":{"mode":"relay","edges":["agents-mcp","mcp-engines","agents-runtime-api","runtime-api-runtime","runtime-engines","runtime-tracker"],"staggerMs":350},"badges":[{"node":"mcp-server","text":{"en":"ABAC native AND OPA","es":"ABAC nativo Y OPA"}},{"node":"tracker","text":{"en":"HITL · approvalToken","es":"HITL · approvalToken"}}],"camera":{"fit":"focus","pad":72},"evidence":[{"value":{"en":"20 port files · 21 declared port interfaces · 11 on the hot path (7 required + 4 optional) · 47 adapter classes","es":"20 archivos de puerto · 21 interfaces de puerto declaradas · 11 en la ruta caliente (7 obligatorios + 4 opcionales) · 47 clases adaptadoras"},"label":{"en":"What the runtime reaches vs declares","es":"Lo que el runtime alcanza vs declara"},"asOf":"2026-09-19","source":"src/packages/agent-runtime/src/application/agent-runtime-deps.ts (derived by guard 45's hotPathPorts() / declaredPorts())","kind":"measured","levels":["executive","architect","engineer"]},{"value":{"en":"Mutative MCP tools need { apply: true, approvalToken } · ABAC native AND OPA","es":"Las herramientas MCP mutativas exigen { apply: true, approvalToken } · ABAC nativo Y OPA"},"label":{"en":"Two locks on every tool call","es":"Dos cerrojos en cada llamada"},"asOf":"2026-06-20","source":"src/packages/mcp-server/src/mcp/approval-grant.ts; src/packages/mcp-server/src/mcp/mcp-tool-dispatch.ts (ADR-0087, Accepted 2026-06-20)","kind":"measured","levels":["executive","architect","engineer"]},{"value":{"en":"Only human · custodian · board may accept · promote · ratify · waive · enforce","es":"Solo human · custodian · board pueden accept · promote · ratify · waive · enforce"},"label":{"en":"Who can say yes","es":"Quién puede decir que sí"},"asOf":"2026-07-18","source":"src/packages/core-domain/src/domain/authority-policy.ts:52-91 (ADR-0116, Accepted 2026-07-18)","kind":"measured","levels":["executive","architect","engineer"]},{"value":{"en":"6 interaction adapters — MCP and OpenCode declared, constructed by no surface","es":"6 adaptadores de interacción: MCP y OpenCode declarados, ninguna superficie los construye"},"label":{"en":"Declared vs wired","es":"Declarado vs cableado"},"asOf":"2026-07-28","source":"product/suite/vision/evolith-product-vision-master.md:224-235 (verified 2026-07-28)","kind":"observed","levels":["engineer"]}],"narration":{"executive":{"en":"When the one writing code is an AI, the rules do not change; the enforcement does. An agent reaches the same engine through MCP and gets the same four-state verdict. Anything changing state waits for an approval token, and only a person, custodian or board can accept, promote, ratify, waive or enforce. The agent runtime is labelled Experimental on purpose.","es":"Cuando quien escribe el código es una IA, las reglas no cambian: cambia cómo se hacen cumplir. Un agente llega al mismo motor por MCP y recibe el mismo veredicto de cuatro estados. Todo lo que cambia estado espera un token de aprobación, y solo una persona, custodio o comité puede aceptar, promover, ratificar, eximir o hacer cumplir. El runtime de agentes está etiquetado como Experimental a propósito."},"architect":{"en":"Every MCP tool call needs native ABAC AND OPA to allow it (ADR-0087); mutative tools also require `{ apply: true, approvalToken }`. The Agent Runtime (ADR-0102) is ports-only: 21 declared port interfaces in 20 files, 11 on the hot path, 47 adapter classes — a port count is not a capability count; approvals land on the Tracker. ADR-0116 makes the boundary executable: `agent | engine | ci` may observe, recommend, attach evidence or draft; only `human | custodian | board` may accept, promote, ratify, waive or enforce. Of 6 interaction adapters, no surface constructs MCP or OpenCode (vision, 2026-07-28).","es":"Cada llamada a herramienta MCP necesita el permiso del ABAC nativo Y de OPA (ADR-0087); las herramientas mutativas exigen además `{ apply: true, approvalToken }`. El Agent Runtime (ADR-0102) es solo puertos: 21 interfaces de puerto declaradas en 20 archivos, 11 en la ruta caliente, 47 clases adaptadoras; contar puertos no es contar capacidades; las aprobaciones aterrizan en el Tracker. ADR-0116 hace ejecutable la frontera: `agent | engine | ci` pueden observar, recomendar, adjuntar evidencia o redactar borradores; solo `human | custodian | board` pueden aceptar, promover, ratificar, eximir o hacer cumplir. De los 6 adaptadores de interacción, ninguna superficie construye MCP ni OpenCode (visión, 2026-07-28)."},"engineer":{"en":"`mcp-tool-dispatch.ts` requires native AND OPA allow; roles read_only {viewer, auditor} · developer {developer, qa} · operator {operator, sre} · architect {architect, admin}; tool classes read/write/deploy; codes ABAC-01/02/03; Rego role sets generated from `AbacEvaluator.toolProjection()` with a parity spec (GT-602). Hot path (`agent-runtime-deps.ts`, derived by guard 45): required `ISkillRegistryPort, IHarnessPort, ICoreEvaluationPort, IPolicyValidationPort, IApprovalPort, ITrackerTracePort, IMemoryPort`; optional `IAgentEnginePort, IKnowledgePort, IWorkspaceContextPort, IRunJournalPort` (replay, GT-593). Interaction adapters: SmartCliCommand, SmartCliChat, HermesChatBox, Mcp, OpenCode, ExternalTrigger. `.harness/manifest.yaml` (version 1) is capability discovery via `IHarnessPort`. Runtime API `agent-runtime-api` 0.1.0: `POST /v1/agent/converse` (canonical), `/handle`, `/stream` (SSE), `GET /v1/agent/skills`; `/hermes` is a deprecated alias. Approvals: `POST /runtime-approvals` on the Tracker (GT-441).","es":"`mcp-tool-dispatch.ts` exige permiso nativo Y de OPA; roles read_only {viewer, auditor} · developer {developer, qa} · operator {operator, sre} · architect {architect, admin}; clases de herramienta read/write/deploy; códigos ABAC-01/02/03; conjuntos de roles en Rego generados desde `AbacEvaluator.toolProjection()` con una spec de paridad (GT-602). Ruta caliente (`agent-runtime-deps.ts`, derivada por el guard 45): obligatorios `ISkillRegistryPort, IHarnessPort, ICoreEvaluationPort, IPolicyValidationPort, IApprovalPort, ITrackerTracePort, IMemoryPort`; opcionales `IAgentEnginePort, IKnowledgePort, IWorkspaceContextPort, IRunJournalPort` (replay, GT-593). Adaptadores de interacción: SmartCliCommand, SmartCliChat, HermesChatBox, Mcp, OpenCode, ExternalTrigger. `.harness/manifest.yaml` (versión 1) es el descubrimiento de capacidades vía `IHarnessPort`. API del runtime `agent-runtime-api` 0.1.0: `POST /v1/agent/converse` (canónico), `/handle`, `/stream` (SSE), `GET /v1/agent/skills`; `/hermes` es un alias obsoleto. Aprobaciones: `POST /runtime-approvals` en el Tracker (GT-441)."}},"sources":[{"path":"src/packages/agent-runtime/README.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/src/packages/agent-runtime/README.md"},{"path":"reference/core/architecture/foundations/README.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/reference/core/architecture/foundations/README.md"},{"path":"reference/core/foundations/agent-skills/agent-authority-model.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/reference/core/foundations/agent-skills/agent-authority-model.md"},{"path":"reference/core/architecture/adrs/core/0116-canonical-finding-and-authority-boundary.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/reference/core/architecture/adrs/core/0116-canonical-finding-and-authority-boundary.md"}],"poster":{"regions":["region-runtime","region-authority-strip"],"band":"agents"}},{"id":"ai-tenant-terms","order":8,"title":{"en":"AI on the tenant's terms","es":"IA en los términos del tenant"},"hook":{"en":"The published CLI calls no LLM.","es":"El CLI publicado no llama a ningún LLM."},"question":{"en":"How does this scale past one repository?","es":"¿Cómo escala esto más allá de un repositorio?"},"focus":{"nodes":["agent-runtime","engines","llm-catalog","runtime-memory"],"halfLit":["knowledge-os","tracker","evolith-cli"],"edges":["runtime-engine","engine-llm","runtime-memory-edge"],"halfLitEdges":["knowledge-mcp","runtime-tracker"]},"packets":{"mode":"relay","edges":["runtime-engine","engine-llm"],"staggerMs":350},"badges":[{"node":"llm-catalog","text":{"en":"claude · gemini · none → stub · off by default","es":"claude · gemini · ninguno → stub · desactivado por defecto"}}],"camera":{"fit":"nodes","nodes":["agent-runtime","engines","llm-catalog","runtime-memory","knowledge-os"],"pad":80},"evidence":[{"value":{"en":"2 transports registered: claude · gemini — no default, egress off by default","es":"2 transportes registrados: claude · gemini; ninguno por defecto, salida desactivada por defecto"},"label":{"en":"Provider catalog","es":"Catálogo de proveedores"},"asOf":"2026-08-22","source":"src/packages/agent-runtime/src/providers/assistant-transport.registry.ts:57-70 (ADR-0128, Accepted 2026-08-22, partial)","kind":"measured","levels":["executive","architect","engineer"]},{"value":{"en":"Timeouts 30 s Gemini · 60 s Claude · 60,000-byte fail-closed cap · 8 redaction classes","es":"Tiempos límite 30 s Gemini · 60 s Claude · tope de 60.000 bytes en fallo cerrado · 8 clases de redacción"},"label":{"en":"Fail-closed egress","es":"Salida con fallo cerrado"},"asOf":"2026-09-19","source":"src/packages/agent-runtime/src/providers/GeminiProvider.ts:87; src/packages/agent-runtime/src/providers/ClaudeProvider.ts:70","kind":"measured","levels":["architect","engineer"]},{"value":{"en":"\"It does not call any LLM.\"","es":"«It does not call any LLM.»"},"label":{"en":"The README's own words","es":"Las palabras del propio README"},"asOf":"2026-09-19","source":"README.md:120-122","kind":"generated","levels":["executive","architect","engineer"]}],"narration":{"executive":{"en":"Evolith is not an AI product but a deterministic verifier that can supervise one. No published CLI command reaches a language model. Where the experimental runtime calls one, the Core publishes only a catalog (Anthropic Claude, Google Gemini or none); the tenant chooses, pays and approves each call. \"The model proposes, a verifier disposes\" is a direction, not shipped behaviour.","es":"Evolith no es un producto de IA; es un verificador determinista que puede supervisar a una. Ningún comando del CLI publicado llega a un modelo de lenguaje. Donde el runtime experimental puede llamar a uno, el Core solo publica un catálogo —Anthropic Claude, Google Gemini o ninguno— y el tenant elige, paga y aprueba cada llamada. «El modelo propone, un verificador dispone» es una dirección, no comportamiento entregado."},"architect":{"en":"ADR-0128 (Accepted 2026-08-22, partial) splits the concern: the Core publishes a provider catalog behind one `IAssistantTransport`, the tenant selects, the Tracker accounts. `ASSISTANT_PROVIDERS = [claude, gemini]` sit inside a `SupervisedAssistantClient`: egress off unless enabled, human-in-the-loop per call, timed out and size-capped fail-closed, eight redaction classes, content-free audit line. The reasoning engine is an adapter behind `IAgentEnginePort` (Stub by default; Hermes, Swarms, Cowork, Routing optional): \"Hermes is the engine, not the authority\". Memory, journal and knowledge are ports too; the Knowledge OS is \"memory for the product, not for the AI\". Tenant credentials live in the Tracker (`TenantIntelligence`), never the Core.","es":"ADR-0128 (aceptado 2026-08-22, parcial) separa responsabilidades: el Core publica un catálogo de proveedores tras un único `IAssistantTransport`, el tenant elige, el Tracker contabiliza. `ASSISTANT_PROVIDERS = [claude, gemini]` viven en un `SupervisedAssistantClient`: salida desactivada salvo habilitación, humano en el bucle por llamada, tiempo límite y tope de tamaño en fallo cerrado, ocho clases de redacción, línea de auditoría sin contenido. El motor que razona es un adaptador tras `IAgentEnginePort` (Stub por defecto; Hermes, Swarms, Cowork, Routing opcionales): «Hermes es el motor, no la autoridad». Memoria, bitácora y conocimiento también son puertos; el Knowledge OS es «memoria para el producto, no para la IA». Las credenciales del tenant viven en el Tracker (`TenantIntelligence`), nunca en el Core."},"engineer":{"en":"`ASSISTANT_PROVIDERS = [{ id: 'claude', label: 'Anthropic Claude' }, { id: 'gemini', label: 'Google Gemini' }]`; `EVOLITH_LLM_EGRESS=true` required; `GEMINI_DEFAULT_TIMEOUT_MS = 30_000`, `CLAUDE_DEFAULT_TIMEOUT_MS = 60_000`; responses over 60,000 bytes fail closed; 8 redaction classes run before send; audit line `[evolith:llm-egress]` carries no content. `AGENT_RUNTIME_ENGINE` unset → `StubAgentEngineAdapter`. Knowledge: `evolith-knowledge-search` (BM25-first hybrid, GT-592); RAG on pgvector (ADR-0112: Qwen3-Embedding-0.6B, 1024-dim, HNSW) — the seed costs ≈ 65 h CPU and is deliberately not run (GT-685, issue #764). Stale doc, stated on purpose: `SECURITY.md:94,102` and `docs/known-limitations.md:42` still name one outbound provider (Gemini); the registry has two — this page prints the code and flags the doc.","es":"`ASSISTANT_PROVIDERS = [{ id: 'claude', label: 'Anthropic Claude' }, { id: 'gemini', label: 'Google Gemini' }]`; se exige `EVOLITH_LLM_EGRESS=true`; `GEMINI_DEFAULT_TIMEOUT_MS = 30_000`, `CLAUDE_DEFAULT_TIMEOUT_MS = 60_000`; las respuestas de más de 60.000 bytes fallan cerradas; 8 clases de redacción corren antes de enviar; la línea de auditoría `[evolith:llm-egress]` no lleva contenido. `AGENT_RUNTIME_ENGINE` sin definir → `StubAgentEngineAdapter`. Conocimiento: `evolith-knowledge-search` (híbrido BM25 primero, GT-592); RAG sobre pgvector (ADR-0112: Qwen3-Embedding-0.6B, 1024 dim, HNSW); la siembra cuesta ≈ 65 h de CPU y no se ejecuta a propósito (GT-685, issue #764). Documento desactualizado, dicho a propósito: `SECURITY.md:94,102` y `docs/known-limitations.md:42` aún nombran un solo proveedor saliente (Gemini); el registro tiene dos: esta página imprime el código y señala el documento."}},"sources":[{"path":"SECURITY.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/SECURITY.md"},{"path":"reference/core/architecture/adrs/core/0128-llm-provider-abstraction-per-tenant.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/reference/core/architecture/adrs/core/0128-llm-provider-abstraction-per-tenant.md"},{"path":"reference/knowledge/README.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/reference/knowledge/README.md"}],"poster":{"regions":["region-llm"],"band":"agents"}},{"id":"federation-loop","order":9,"title":{"en":"Inherit, specialise, propose upstream","es":"Heredar, especializar, proponer hacia arriba"},"hook":{"en":"Silence is not an option.","es":"El silencio no es una opción."},"question":{"en":"Who decides across a portfolio?","es":"¿Quién decide en todo un portafolio?"},"focus":{"nodes":["core-corpus","satellites","architecture-board"],"halfLit":["tracker","ums","gh-action"],"edges":["corpus-satellites","satellites-board","board-corpus"],"halfLitEdges":["satellites-tracker","satellites-ums","satellites-action"]},"packets":{"mode":"loop","edges":["corpus-satellites","satellites-board","board-corpus"],"staggerMs":500},"badges":[{"node":"satellites","text":{"en":"the Core is a satellite of itself","es":"el Core es satélite de sí mismo"}}],"camera":{"fit":"nodes","nodes":["core-corpus","satellites","architecture-board","tracker","ums","gh-action"],"pad":88},"evidence":[{"value":{"en":"INH-01 Core Immutability … INH-06 Mandatory Architecture Tracker (v1.0.0)","es":"INH-01 Inmutabilidad del Core … INH-06 Tracker de Arquitectura obligatorio (v1.0.0)"},"label":{"en":"Six inheritance rules","es":"Seis reglas de herencia"},"asOf":"2026-09-19","source":"src/rulesets/governance/inheritance.rules.json:8-109","kind":"measured","levels":["executive","architect","engineer"]},{"value":{"en":"UP-001 · UP-002 · UP-003 — PROPOSED","es":"UP-001 · UP-002 · UP-003: PROPUESTAS"},"label":{"en":"Upstream proposals","es":"Propuestas hacia arriba"},"asOf":"2026-09-19","source":"reference/core/control-center/opportunities/README.md","kind":"measured","levels":["architect","engineer"]},{"value":{"en":"Root evolith.yaml: name evolith · coreRef 1.0.0","es":"evolith.yaml raíz: name evolith · coreRef 1.0.0"},"label":{"en":"The Core is its own satellite","es":"El Core es su propio satélite"},"asOf":"2026-09-19","source":"evolith.yaml","kind":"measured","levels":["executive","architect","engineer"]}],"narration":{"executive":{"en":"One Constitution, many repositories. Each product repository is a satellite: it pins the Core version it inherits, records its own decisions and cannot downgrade. For every base decision it must say adopt, extend, override or not applicable — silence is not allowed. Improvements travel back upstream through an Architecture Board, and every satellite re-inherits. Evolith applies this to itself.","es":"Una Constitución, muchos repositorios. Cada repositorio de producto es un satélite: fija la versión del Core que hereda, registra sus propias decisiones y no puede retroceder. Ante cada decisión base debe decir adoptar, extender, sobrescribir o no aplica: el silencio no está permitido. Las mejoras vuelven hacia arriba a través de un Comité de Arquitectura, y todos los satélites vuelven a heredar. Evolith se lo aplica a sí mismo."},"architect":{"en":"Hub-and-spoke: Level 0 Core (Authority) → Level 1 Satellite (Inheritor); satellite-to-satellite inheritance is prohibited. INH-01 Core Immutability · INH-02 Version Pinning (semver, never `latest`) · INH-03 Upgrade Only · INH-04 local ADRs tagged `EvolithSatellite` · INH-05 Promotion via Architecture Board · INH-06 mandatory `DECISIONS.md`. Four responses per base ADR: Adopt, Extend (`Extends:`), Override (`Overrides:` + justification), Not Applicable. Upstream proposals are records (UP-001, UP-002, UP-003, all PROPOSED) in the decisions register; monorepo satellites use `evolith.workspace.yaml` (ADR-0109). The Tracker pins coreRef 1.0.0 and registers 40 ADRs (8 core + 32 local); UMS is the applied reference satellite and tenant master (ADR-0129).","es":"Hub-and-spoke: Nivel 0 Core (Autoridad) → Nivel 1 Satélite (Heredero); la herencia entre satélites está prohibida. INH-01 Inmutabilidad del Core · INH-02 Fijación de versión (semver, nunca `latest`) · INH-03 Solo actualizar · INH-04 ADRs locales con etiqueta `EvolithSatellite` · INH-05 Promoción vía Comité de Arquitectura · INH-06 `DECISIONS.md` obligatorio. Cuatro respuestas por ADR base: Adoptar, Extender (`Extends:`), Sobrescribir (`Overrides:` + justificación), No aplica. Las propuestas hacia arriba son registros (UP-001, UP-002, UP-003, todas PROPUESTAS) en el registro de decisiones; los satélites monorepo usan `evolith.workspace.yaml` (ADR-0109). El Tracker fija coreRef 1.0.0 y registra 40 ADRs (8 del core + 32 locales); UMS es el satélite de referencia aplicada y maestro de tenants (ADR-0129)."},"engineer":{"en":"Day zero: `evolith init --name \u003cx> --yes` writes `evolith.yaml` (`apiVersion evolith.dev/v1`, `kind Satellite`, `spec.coreRef.version` pinned — INH-02); a missing manifest is `GOV-000` MUST blocking; a missing `DECISIONS.md` is a failing row (INH-06); local ADRs carry the `EvolithSatellite` tag (INH-04). `evolith upgrade` moves the pin forward only (INH-03); `evolith satellite:create` / `satellite:adopt` register repositories; `evolith waiver` manages `Verdict.WAIVE`; tenant `rulesets.overrides` (GT-678, 2026-09-19) can waive a blocking criterion but never remove it (`OVR-BLOCKING-REMOVED`). Schema: `src/rulesets/schema/evolith-yaml.schema.json`, `additionalProperties: false`. Root `evolith.yaml` of this repo: name `evolith`, coreRef 1.0.0 — and its `metadata.phase F1` is the topology axis, not an SDLC phase.","es":"Día cero: `evolith init --name \u003cx> --yes` escribe `evolith.yaml` (`apiVersion evolith.dev/v1`, `kind Satellite`, `spec.coreRef.version` fijado; INH-02); un manifiesto ausente es `GOV-000` MUST bloqueante; un `DECISIONS.md` ausente es una fila fallida (INH-06); los ADRs locales llevan la etiqueta `EvolithSatellite` (INH-04). `evolith upgrade` solo mueve el pin hacia adelante (INH-03); `evolith satellite:create` / `satellite:adopt` registran repositorios; `evolith waiver` gestiona `Verdict.WAIVE`; los `rulesets.overrides` del tenant (GT-678, 2026-09-19) pueden eximir un criterio bloqueante pero nunca eliminarlo (`OVR-BLOCKING-REMOVED`). Esquema: `src/rulesets/schema/evolith-yaml.schema.json`, `additionalProperties: false`. El `evolith.yaml` raíz de este repo: name `evolith`, coreRef 1.0.0; y su `metadata.phase F1` es el eje de topología, no una fase SDLC."}},"sources":[{"path":"reference/core/foundations/inheritance-model/child-repository-inheritance-guide.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/reference/core/foundations/inheritance-model/child-repository-inheritance-guide.md"},{"path":"product/products/ums-reference/README.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/product/products/ums-reference/README.md"},{"path":"reference/core/architecture/adrs/core/0109-multi-project-satellite-governance.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/reference/core/architecture/adrs/core/0109-multi-project-satellite-governance.md"}],"poster":{"regions":["band-5"],"band":"federation"}},{"id":"the-suite","order":10,"title":{"en":"The Tracker decides and remembers","es":"El Tracker decide y recuerda"},"hook":{"en":"Core defines. Providers execute. CLI and MCP evaluate. Tracker decides and audits.","es":"El Core define. Los proveedores ejecutan. CLI y MCP evalúan. El Tracker decide y audita."},"question":{"en":"How much of this is real?","es":"¿Cuánto de esto es real?"},"focus":{"nodes":["business-intent","humans","tracker","ums","core-api","rule-engines","verdict","evidence-graph","external-tools","acl"],"halfLit":[],"edges":["intent-tracker","humans-tracker","ums-tracker","tracker-core-api","rest-engines","engines-verdict","verdict-rest","core-api-tracker","tracker-evidence","core-ledger","tools-acl","acl-tracker"],"halfLitEdges":[]},"packets":{"mode":"relay","edges":["ums-tracker","intent-tracker","tracker-core-api","rest-engines","engines-verdict","verdict-rest","core-api-tracker","tracker-evidence","core-ledger"],"staggerMs":350},"badges":[{"node":"tracker","text":{"en":"Implemented (UAT) · commercial · not launched","es":"Implementado (UAT) · comercial · no lanzado"}},{"node":"core-api","text":{"en":"binding: false","es":"binding: false"}}],"camera":{"fit":"focus","pad":64},"evidence":[{"value":{"en":".NET 10 · PostgreSQL 16 · React 19 (Vite SPA) · NestJS 11 gateway — Implemented (UAT on Coolify since 2026-08-22) · commercial, not launched","es":".NET 10 · PostgreSQL 16 · React 19 (Vite SPA) · NestJS 11 gateway: Implementado (UAT en Coolify desde 2026-08-22) · comercial, no lanzado"},"label":{"en":"The Tracker","es":"El Tracker"},"asOf":"2026-08-22","source":"evolith_tracker@818a2819 README.md; README.md:90","kind":"observed","levels":["executive","architect","engineer"]},{"value":{"en":"58 local decisions (index) · 40 ADRs registered in its evolith.yaml (8 core + 32 local)","es":"58 decisiones locales (índice) · 40 ADRs registrados en su evolith.yaml (8 del core + 32 locales)"},"label":{"en":"Its own Constitution","es":"Su propia Constitución"},"asOf":"2026-08-22","source":"evolith_tracker@818a2819 DECISIONS.md; evolith.yaml","kind":"observed","levels":["architect","engineer"]},{"value":{"en":"POST /api/v1/products/{id}/evaluate-architecture → POST /api/v1/evaluate (inline) → POST /core-evaluation-transactions","es":"POST /api/v1/products/{id}/evaluate-architecture → POST /api/v1/evaluate (inline) → POST /core-evaluation-transactions"},"label":{"en":"The round trip","es":"El viaje de ida y vuelta"},"asOf":"2026-08-22","source":"evolith_tracker@818a2819 CoreEvaluationGateway.cs:277-321 (external repo)","kind":"observed","levels":["engineer"]},{"value":{"en":"UMS is the tenant master","es":"UMS es el maestro de tenants"},"label":{"en":"Tenant master (ADR-0129)","es":"Maestro de tenants (ADR-0129)"},"asOf":"2026-08-22","source":"reference/core/architecture/adrs/core/0129-ums-is-the-tenant-master.md (Accepted 2026-08-22)","kind":"generated","levels":["architect","engineer"]}],"narration":{"executive":{"en":"Chapter three pays off here. The Tracker is the commercial product: built, in acceptance testing, not yet launched, the only paid piece. It keeps what the Core refuses to keep: initiatives, gate decisions, evidence, an audit log nobody can erase. It assembles the context, asks the Core, then decides: the Core's answer is advice; the Tracker's decision is the record.","es":"Aquí se cobra el capítulo tres. El Tracker es el producto comercial: construido, en pruebas de aceptación, aún no lanzado, la única pieza de pago. Guarda lo que el Core se niega a guardar: iniciativas, decisiones de compuerta, evidencia, una bitácora de auditoría imborrable. Arma el contexto, pregunta al Core y entonces decide: la respuesta del Core es consejo; la decisión del Tracker es el registro."},"architect":{"en":"Two planes: process governance is always on, no repository needed; architecture conformance is opt-in per gate (`requiresCoreVerdict`, default false). The Tracker's .NET 10 BFF is the sole Core client (T-038, T-046): it posts `evolith.yaml` and curated files inline to `POST /api/v1/evaluate` and persists every run as a `CoreEvaluationTransaction`; the Core's machine key may ingest into that ledger, never read (T-055). Identity: UMS, the tenant master (ADR-0129). The verdict is advisory, never a `GateDecision` (T-039). External tools enter through anti-corruption layers as facts; the Tracker judges evidence. The unit of governance is the Initiative: no tasks, epics or stories (ADR-0100, ADR-0101).","es":"Dos planos: el gobierno del proceso está siempre activo, sin necesidad de repositorio; la conformidad de arquitectura es opcional por compuerta (`requiresCoreVerdict`, por defecto false). El BFF .NET 10 del Tracker es el único cliente del Core (T-038, T-046): envía `evolith.yaml` y archivos curados inline a `POST /api/v1/evaluate` y persiste cada corrida como `CoreEvaluationTransaction`; la clave de máquina del Core solo puede ingerir en ese libro, nunca leerlo (T-055). Identidad: UMS, el maestro de tenants (ADR-0129). El veredicto es consultivo, nunca una `GateDecision` (T-039). Las herramientas externas entran como hechos por capas anticorrupción; el Tracker juzga la evidencia. La unidad de gobierno es la Iniciativa: sin tareas, épicas ni historias (ADR-0100, ADR-0101)."},"engineer":{"en":"`tracker-api` (.NET 10, ASP.NET Core) · `tracker-web` (React 19 + Vite 8 SPA on nginx; not a PWA) · `tracker-gateway` (NestJS 11 facade for external consumers, T-052) · PostgreSQL 16. Flow: `POST /api/v1/products/{id}/repository-access` (encrypted secret) → `POST /api/v1/products/{id}/evaluate-architecture` (permission `CoreEvaluate`) → `CoreEvaluationGateway.EvaluateInlineAsync` posts `{ kinds: ['gate'], phaseId, evaluationInput.files, tenant, product, passthrough { mode: 'inline', fileCount } }` to Core `POST /api/v1/evaluate` with `Authorization: Bearer \u003cCoreApi:ApiKey>`; FAILED → HTTP 502. Return path: `POST /core-evaluation-transactions` with a CoreMachine key bound to a tenant; a body `tenantId` is rejected (400). Full stack: `cd product/infra && EVOLITH_API_KEY=local-dev-key docker compose -f docker-compose.fullstack.yml up -d --build` — 9 service blocks. Production: Coolify on a VPS behind Traefik v3.6; PostgreSQL belongs to the Tracker; the Core stays stateless.","es":"`tracker-api` (.NET 10, ASP.NET Core) · `tracker-web` (SPA React 19 + Vite 8 sobre nginx; no es una PWA) · `tracker-gateway` (fachada NestJS 11 para consumidores externos, T-052) · PostgreSQL 16. Flujo: `POST /api/v1/products/{id}/repository-access` (secreto cifrado) → `POST /api/v1/products/{id}/evaluate-architecture` (permiso `CoreEvaluate`) → `CoreEvaluationGateway.EvaluateInlineAsync` envía `{ kinds: ['gate'], phaseId, evaluationInput.files, tenant, product, passthrough { mode: 'inline', fileCount } }` al Core `POST /api/v1/evaluate` con `Authorization: Bearer \u003cCoreApi:ApiKey>`; FAILED → HTTP 502. Camino de vuelta: `POST /core-evaluation-transactions` con una clave CoreMachine ligada a un tenant; un `tenantId` en el cuerpo se rechaza (400). Stack completo: `cd product/infra && EVOLITH_API_KEY=local-dev-key docker compose -f docker-compose.fullstack.yml up -d --build`: 9 bloques de servicio. Producción: Coolify en un VPS tras Traefik v3.6; PostgreSQL pertenece al Tracker; el Core sigue sin estado."}},"sources":[{"path":"product/products/evolith-tracker/README.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/product/products/evolith-tracker/README.md"},{"path":"product/suite/architecture/evolith-governed-composition-target-design.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/product/suite/architecture/evolith-governed-composition-target-design.md" indow 30 days · observed 2026-09-19 · stale from 2026-10-20","es":"Ventana de evidencia de 30 días · observada 2026-09-19 · caduca desde 2026-10-20"},"label":{"en":"Expiry","es":"Caducidad"},"asOf":"2026-09-19","source":"GT-711; .harness/scripts/ci/09-reconcile-maturity.mjs --freshness","kind":"observed","levels":["executive","architect","engineer"]}],"narration":{"executive":{"en":"Every number here has a date and a file you can open. The project's board says 688 of 715 gaps closed; its generated summary still reads NO-GO for a major release: one P0 remains. The security tab is clean today; downloads are counted, adoption not claimed; one maintainer. A page telling only the good part is the defect Evolith detects.","es":"Cada cifra aquí lleva fecha y un archivo que puedes abrir. El tablero del proyecto dice que 688 de 715 brechas están cerradas; su resumen generado sigue en NO-GO para una versión mayor: queda un P0. La pestaña de seguridad está limpia hoy; las descargas se cuentan, la adopción no se reclama; hay un solo mantenedor. Una página que contara solo lo bueno sería el defecto que Evolith detecta."},"architect":{"en":"Evidence is machine-made: inventories regenerate per PR (2026-09-01); the gap board reconciles to a snapshot whose script throws on any closure-record mismatch; the summary is derived, not written. Readiness: four checks observed against real runs in a 30-day window; `Validate documentation` turns red on day 31 (stale from 2026-10-20). 10 checks are required on `main` and `develop`. Security is stated per commit: CodeQL 0, Scorecard 0, Dependabot 0, secrets 0 on `c5547114`; Scorecard 5.1 with committed floors; 7/8 packages attested (2026-07-30). The repository runs its own Action against a non-conforming fixture. ACMM 3.32 ± 0.4 / 5.0 is an authored figure with its caveat.","es":"Evidencia hecha a máquina: los inventarios se regeneran en cada PR (2026-09-01); el tablero de brechas se reconcilia con una instantánea cuyo script falla ante cualquier desajuste de registros de cierre; el resumen se deriva, no se escribe. Preparación: cuatro comprobaciones observadas contra corridas reales en una ventana de 30 días; `Validate documentation` se pone rojo el día 31 (caduca desde 2026-10-20). 10 checks son obligatorios en `main` y `develop`. La seguridad se afirma por commit: CodeQL 0, Scorecard 0, Dependabot 0, secretos 0 en `c5547114`; Scorecard 5.1 con pisos comprometidos; 7/8 paquetes atestados (2026-07-30). El repositorio ejecuta su propia Action contra un fixture no conforme. ACMM 3.32 ± 0.4 / 5.0 es una cifra redactada con su salvedad."},"engineer":{"en":"Sources, all generated or measured: `maturity-reconciliation.json` (asOf 2026-09-21: 715 total · 688 done · 3 in progress · 3 pending · 21 deferred · 670 closure records); `executive-summary.md` (\"NO-GO for production expansion or a major release: active P0 blockers remain.\"; P0 = GT-435, the end-to-end path to a product in real use); `inventory-summary.md` (2026-09-01); `product-inventory.md` (87.33% statements · 87.68% lines); `maturity-evidence.json` (107 suites / 1,492 tests; branches 75.73 % over a 75 % floor; `EVIDENCE_MAX_AGE_DAYS = 30`). Required contexts: CodeQL SAST · Secret Detection (gitleaks) · Services build (GHCR) · Test · Test core · Test core-api · Test core-domain · Test mcp-server · Validate documentation · Security Audit. Engine coverage on this repo: opa 133/159, native 41/159 (2026-08-21). Install is CI-verified on Linux only; `npm audit signatures` verifies the attestations; the Tracker's licence is dual, not MIT. This page is built by `.harness/scripts/pages/build-pages.mjs` at `2d396da`; it hand-types no count.","es":"Fuentes, todas generadas o medidas: `maturity-reconciliation.json` (asOf 2026-09-21: 715 totales · 688 hechas · 3 en curso · 3 pendiente · 21 diferidas · 670 registros de cierre); `executive-summary.md` («NO-GO for production expansion or a major release: active P0 blockers remain.»; P0 = GT-435, el camino de extremo a extremo hasta un producto en uso real); `inventory-summary.md` (2026-09-01); `product-inventory.md` (87.33% sentencias · 87.68% líneas); `maturity-evidence.json` (107 suites / 1.492 pruebas; ramas 75,73 % sobre un piso del 75 %; `EVIDENCE_MAX_AGE_DAYS = 30`). Contextos obligatorios: CodeQL SAST · Secret Detection (gitleaks) · Services build (GHCR) · Test · Test core · Test core-api · Test core-domain · Test mcp-server · Validate documentation · Security Audit. Cobertura de motores en este repo: opa 133/159, native 41/159 (2026-08-21). La instalación está verificada en CI solo en Linux; `npm audit signatures` verifica las atestaciones; la licencia del Tracker es dual, no MIT. Esta página la construye `.harness/scripts/pages/build-pages.mjs` en `2d396da`; no teclea ningún conteo a mano."}},"sources":[{"path":"docs/known-limitations.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/docs/known-limitations.md"},{"path":"reference/core/control-center/maturity-reports/executive-summary.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/reference/core/control-center/maturity-reports/executive-summary.md"},{"path":"reference/core/control-center/gaps/gap-tracking.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/reference/core/control-center/gaps/gap-tracking.md"},{"path":"SECURITY.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/SECURITY.md"},{"path":"reference/core/control-center/maturity-reports/maturity-assessment.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob/main/reference/core/control-center/maturity-reports/maturity-assessment.md"}],"poster":{"regions":["band-6"],"band":"evidence"}}],"timeline":[{"date":"2026-06-11","label":{"en":"ADR-0041 — dual-engine policy evaluation","es":"ADR-0041 — evaluación de políticas con doble motor"},"path":"reference/core/architecture/adrs/core/0041-dual-engine-policy-evaluation.md","url":"https://github.com/beyondnetcode/evolith_arch32/blob
