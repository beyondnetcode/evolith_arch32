replicaCount: 2

image:
  repository: ghcr.io/beyondnetcode/evolith-agent-runtime
  pullPolicy: IfNotPresent
  # GT-435 — the tag must be one CI actually publishes, and until 2026-08-02 it was not: this
  # chart asked for `"0.1.0"`, a semver build driven by a git tag that either never ran
  # (docker-images.yml has no runs) or, for agent-runtime, had no matching tag at all. A
  # `helm install` with default values would have met ImagePullBackOff on day one, and no green
  # CI could have shown it, because nothing has ever pulled these images.
  #
  # `latest` is what ci-cd.yml pushes on every merge to main, so the chart is deployable out of
  # the box. PRODUCTION MUST OVERRIDE IT with `--set image.tag=<sha>`, which CI also publishes:
  # `latest` cannot be rolled back to a previous build, and GT-448 requires a rollback that has
  # actually been exercised, which a floating tag makes impossible to demonstrate.
  tag: latest
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
  # Only read when `type: NodePort`. Empty means "let Kubernetes allocate one",
  # which is fine for a throwaway and wrong for anything another cluster is
  # configured against — see values-local.yaml and kind/core-cluster.yaml.
  # ClusterIP stays the default: a node port is a LOCAL cross-cluster
  # affordance, never a production one.
  nodePort: ""

ingressRoute:
  enabled: true
  entryPoints:
    - web
    - websecure
  host: evolithruntime.beyondnet.cloud
  pathPrefix: /

# API-key auth. The runtime fails closed in production when no key is present,
# so a secret is expected. Reference an existing secret (do NOT inline keys here).
#   kubectl create secret generic agent-runtime-auth \
#     --from-literal=AGENT_RUNTIME_API_KEY=<key>
auth:
  existingSecretName: agent-runtime-auth
  apiKeyKey: AGENT_RUNTIME_API_KEY

# Extra environment for the runtime's adapters. The image bundles the corpus at
# /repo/corpus, so the real .harness / OPA adapters can be enabled here.
extraEnv:
  NODE_ENV: production
  PORT: "3000"
  # GT-608 — this root drives BOTH the .harness process executor AND the skill
  # catalogue: with it set, capabilities and their `requiresApproval` posture come
  # from <root>/manifest.yaml; unset, the runtime falls back to the hardcoded
  # 7-skill table and nothing it can route requires human approval.
  AGENT_RUNTIME_HARNESS_ROOT: /repo/corpus/.harness
  # OPA needs no variables here: the adapter resolves
  # <AGENT_RUNTIME_WORKSPACE_ROOT>/.harness/bin/opa on its own, and the image now
  # carries the platform's own binary there (see the Dockerfile's OPA build step).
  # Policy mode already defaults to real OPA — stub is opt-in, never silent.
  #
  # Still deliberately unset, each waiting on something this chart cannot supply:
  #   AGENT_RUNTIME_TRACKER_ENDPOINT — needs a reachable Tracker and its token.
  #   AGENT_RUNTIME_STATE_DIR        — needs a mounted volume; without one the
  #                                    working memory stays volatile.
  #   AGENT_RUNTIME_PROFILE=production — refuses to boot unless BOTH of the above
  #                                    and AGENT_RUNTIME_CORE_ENDPOINT/_TOKEN are
  #                                    set (GT-438). Turn it on last, as the check
  #                                    that the rest really landed.

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  capabilities:
    drop:
      - ALL

# The runtime exposes a single combined /health endpoint (liveness + readiness).
probes:
  liveness:
    enabled: true
    path: /health
    port: 3000
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  readiness:
    enabled: true
    path: /health
    port: 3000
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1
  startup:
    enabled: true
    path: /health
    port: 3000
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
    successThreshold: 1

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - evolith-agent-runtime
          topologyKey: kubernetes.io/hostname

podDisruptionBudget:
  enabled: true
  minAvailable: 1

horizontalPodAutoscaler:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

networkPolicy:
  enabled: true
  ingressRules:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 3000
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app: traefik
      ports:
        - port: 3000
          protocol: TCP
  egressRules:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
