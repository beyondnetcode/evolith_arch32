name: Evolith SDK CLI - CI Pipeline

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/sdk/cli/**'
      - '.harness/**'
      # package.json / package-lock.json: this pipeline installs with `npm ci`,
      # so a lock desync breaks every job here -- and until now neither file
      # triggered it, meaning the break AND its fix both went unnoticed by the
      # workflow they affect. (`release-please-config.json` used to be listed and
      # was removed: it was deleted in aed33ba9, so the filter watched a path that
      # cannot change.)
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/sdk-cli-ci.yml'
  push:
    branches: [main, develop]
    paths:
      - 'src/sdk/cli/**'
      - '.harness/**'
      # package.json / package-lock.json: this pipeline installs with `npm ci`,
      # so a lock desync breaks every job here -- and until now neither file
      # triggered it, meaning the break AND its fix both went unnoticed by the
      # workflow they affect. (`release-please-config.json` used to be listed and
      # was removed: it was deleted in aed33ba9, so the filter watched a path that
      # cannot change.)
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/sdk-cli-ci.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  CLI_DIR: 'src/sdk/cli'

jobs:
  # ============================================
  # JOB 1: Evolith Core Validation
  # ============================================
  core-validation:
    name: Evolith Core Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Validate Documentation
        run: node .harness/scripts/ci/01-validate-docs.mjs --render-mermaid

      - name: Check Bilingual Parity
        run: node .harness/scripts/ci/04-check-bilingual-parity.mjs

      - name: Bilingual Terminology Lint
        run: node .harness/scripts/bilingual-terminology-lint.mjs

      - name: Verify Root Cleanliness
        run: node .harness/scripts/ci/03-validate-root-cleanliness.mjs

      - name: Check Bilingual Coverage
        run: node .harness/scripts/bilingual-coverage.mjs

  # ============================================
  # JOB 2: Security Audit
  # ============================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: npm ci

      - name: Security Vulnerability Audit
        working-directory: ${{ env.CLI_DIR }}
        # Scope, made explicit (GT-568): there is a single root lockfile, so this
        # audits the ENTIRE monorepo dependency tree — every workspace's prod and
        # dev deps — not just the CLI's. That is deliberate: it is stricter than a
        # CLI-only or prod-only scan. It fails on HIGH+ advisories; anything below
        # is reported by `npm audit` at job-log level without blocking. When a
        # transitive advisory has no upstream fix in its consumer's range, pin the
        # patched version with a targeted `overrides` entry in the root
        # package.json (see js-yaml / brace-expansion / protobufjs) rather than
        # regenerating package-lock.json wholesale.
        run: npm audit --audit-level=high

  # ============================================
  # JOB 3: Lint and Type Check
  # ============================================
  lint-and-types:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build workspace dependencies
        run: |
          npm run build -w @beyondnet/evolith-core-domain
          npm run build -w @beyondnet/evolith-agent-runtime
          npm run build -w @beyondnet/evolith-sdk
          npm run build -w @beyondnet/evolith-infra-providers
          npm run build -w @beyondnet/evolith-core
          npm run build -w @beyondnet/evolith-mcp

      - name: Architecture Boundary Lint (eslint-plugin-boundaries)
        working-directory: ${{ env.CLI_DIR }}
        continue-on-error: true
        run: npm run lint

      - name: Type Check
        working-directory: ${{ env.CLI_DIR }}
        run: npm run build

      - name: Test Type Check
        working-directory: ${{ env.CLI_DIR }}
        run: npx tsc --noEmit -p tsconfig.test.json

  # ============================================
  # JOB 4: Unit Tests with Coverage
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build workspace dependencies
        run: |
          npm run build -w @beyondnet/evolith-core-domain
          npm run build -w @beyondnet/evolith-agent-runtime
          npm run build -w @beyondnet/evolith-sdk
          npm run build -w @beyondnet/evolith-infra-providers
          npm run build -w @beyondnet/evolith-core
          npm run build -w @beyondnet/evolith-mcp

      - name: Run Unit Tests
        working-directory: ${{ env.CLI_DIR }}
        # Emit json-summary (consumed by the coverage gate below) alongside the
        # console summary. A single --coverage-reporters override would drop the
        # json file and break the threshold check.
        run: npm run test:cov -- --coverageReporters=text-summary --coverageReporters=json-summary

      - name: Upload Coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ${{ env.CLI_DIR }}/coverage/

      - name: Check Coverage Threshold
        run: |
          COVERAGE=$(jq -r '.total.statements.pct' ${{ env.CLI_DIR }}/coverage/coverage-summary.json)
          THRESHOLD=80
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "Statement coverage $COVERAGE% is below threshold $THRESHOLD%"
            exit 1
          fi
          echo "Statement coverage: $COVERAGE%"

  # ============================================
  # JOB 5: Architecture Validation
  # ============================================
  architecture-validation:
    name: Architecture Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify Git Tag Alignment
        run: node .harness/scripts/verify-git-tag.mjs

      - name: Verify Version Log
        run: node .harness/scripts/verify-version-log.mjs

      - name: Check ADR Consistency
        run: node .harness/scripts/adr-lifecycle.mjs --check-only

      - name: Doc Complexity Score
        run: node .harness/scripts/doc-complexity-score.mjs --threshold=15

      # Coverage gate only: verifies every parity fixture on disk is actually
      # exercised by native-opa-parity.spec.ts. The real verdict evaluation
      # runs in the core-domain jest suite (ci-cd.yml -> test-core-domain).
      # This job does no `npm ci`, so it cannot run jest itself.
      - name: Parity Fixture Coverage Gate (GT-229)
        run: node .harness/scripts/ci/28-native-evaluator-parity.mjs

      # Five architectural health checks over core-domain: no tenant identity in
      # Core (ADR-0101), TypeScript/OPA rule sync, capability contracts, progress
      # emitters, and inbound-port boundaries. Dependency-free like its
      # neighbours -- node builtins only, every path it reads is tracked in git.
      - name: Core Health Checks (S1/D1/H1/H2/B1)
        run: node .harness/scripts/ci/35-validate-core-health.mjs

      - name: Core OPA Governance Suite (GT-347)
        run: node .harness/scripts/ci/29-test-core-opa.mjs

      - name: Phase/Topology Namespace Guard (GT-343)
        run: node .harness/scripts/ci/30-validate-phase-topology-disjoint.mjs

  # ============================================
  # JOB 6: Package Integrity
  # ============================================
  package-integrity:
    name: Package Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: npm ci

      - name: Build workspace dependencies
        run: |
          npm run build -w @beyondnet/evolith-core-domain
          npm run build -w @beyondnet/evolith-agent-runtime
          npm run build -w @beyondnet/evolith-sdk
          npm run build -w @beyondnet/evolith-infra-providers
          npm run build -w @beyondnet/evolith-core
          npm run build -w @beyondnet/evolith-mcp

      - name: Build Package
        working-directory: ${{ env.CLI_DIR }}
        run: npm run build

      - name: Verify Binary Entry Point
        run: |
          echo "Checking bin entry point..."
          ls -la ${{ env.CLI_DIR }}/dist/main.js
          echo "Checking package.json bin field..."
          node -e "const pkg=require('./${{ env.CLI_DIR }}/package.json'); console.log('bin:', pkg.bin)" 

      - name: Verify Package Structure
        run: |
          echo "Verifying package structure..."
          node -e "
            const pkg = require('./${{ env.CLI_DIR }}/package.json');
            const fs = require('fs');
            const path = require('path');
            
            // Check main entry
            const mainExists = fs.existsSync(path.join('${{ env.CLI_DIR }}', pkg.main));
            console.log('Main exists:', mainExists);
            
            // Check bin entry (identity comes from package.json, not a hardcoded name)
            const binTargets = typeof pkg.bin === 'string' ? [pkg.bin] : Object.values(pkg.bin);
            const binExists = binTargets.length > 0 &&
              binTargets.every((target) => fs.existsSync(path.join('${{ env.CLI_DIR }}', target)));
            console.log('Bin targets:', binTargets);
            console.log('Bin exists:', binExists);
            
            // Check exports
            console.log('Main:', pkg.main);
            console.log('Bin:', pkg.bin);
            
            if (!mainExists || !binExists) {
              process.exit(1);
            }
          "

  # ============================================
  # JOB 7: E2E Smoke Test (optional)
  # ============================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: npm ci

      - name: Build workspace dependencies
        run: |
          npm run build -w @beyondnet/evolith-core-domain
          npm run build -w @beyondnet/evolith-agent-runtime
          npm run build -w @beyondnet/evolith-sdk
          npm run build -w @beyondnet/evolith-infra-providers
          npm run build -w @beyondnet/evolith-core
          npm run build -w @beyondnet/evolith-mcp

      - name: Build
        working-directory: ${{ env.CLI_DIR }}
        run: npm run build

      - name: Run E2E Tests
        working-directory: ${{ env.CLI_DIR }}
        run: npm run test:e2e

      - name: Run MCP Stdio and HTTP Smoke
        working-directory: ${{ env.CLI_DIR }}
        run: npm run mcp:smoke

  # ============================================
  # JOB 9: CodeQL SAST Analysis (GT-227)
  # ============================================
  codeql-analysis:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  # ============================================
  # JOB 10: Trivy Container Scan (GT-227)
  # ============================================
  trivy-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF Report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-scan'

  # ============================================
  # JOB 11: Secret Detection — gitleaks (GT-265)
  # ============================================
  secret-detection:
    name: Secret Detection (gitleaks)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Org accounts require a (free) gitleaks license key — wired from the
          # GITLEAKS_LICENSE repo secret so the scan can run.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  agentic-review:
    name: Winston Agentic Review
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    # Least privilege: the review only reads the repo to diff changes (GT-146).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm ci
      - name: Run Winston review
        env:
          EVOLITH_AGENTIC_REVIEW: "true"
          EVOLITH_LLM_API_KEY: ${{ secrets.EVOLITH_LLM_API_KEY }}
        run: |
          # Advisory: the LLM review is opt-in. With no provider key configured,
          # skip cleanly instead of failing the gate. Set the EVOLITH_LLM_API_KEY
          # repo secret to enable the real Winston review on PRs.
          if [ -z "$EVOLITH_LLM_API_KEY" ]; then
            echo "::notice::EVOLITH_LLM_API_KEY not set — skipping Winston agentic review (advisory)."
            exit 0
          fi
          node .harness/scripts/ci/agentic/13-agentic-code-review.mjs

  # ============================================
  # JOB 12: DAST OWASP ZAP Scan (GT-273)
  # ============================================
  dast-scan:
    name: DAST OWASP ZAP
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build workspace dependencies
        run: |
          npm run build -w @beyondnet/evolith-core-domain
          npm run build -w @beyondnet/evolith-agent-runtime
          npm run build -w @beyondnet/evolith-sdk
          npm run build -w @beyondnet/evolith-infra-providers
          npm run build -w @beyondnet/evolith-core
          npm run build -w @beyondnet/evolith-mcp

      - name: Build CLI
        working-directory: ${{ env.CLI_DIR }}
        run: npm run build

      - name: Start MCP Server
        working-directory: src/packages/mcp-server
        run: |
          node dist/main.js serve --transport http --port 3001 --allow-no-auth &
          MCP_PID=$!
          echo "MCP_PID=$MCP_PID" >> $GITHUB_ENV
          echo "Started MCP server (pid=$MCP_PID)"

      - name: Wait for MCP Server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health > /dev/null 2>&1; then
              echo "MCP Server ready on port 3001"
              exit 0
            fi
            sleep 2
          done
          echo "MCP Server failed to start after 60s"
          exit 1

      - name: Run OWASP ZAP Full Scan
        # v0.10.0 bundled a deprecated upload-artifact, so its internal upload of
        # the `zap_scan` artifact hit the retired v3 artifact API and the job
        # failed with "The artifact name zap_scan is not valid" -- after a clean
        # scan (FAIL-NEW: 0, WARN-NEW: 1, PASS: 146). v0.12.0 stopped using the
        # deprecated version; this pins the current release.
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: 'http://localhost:3001'
          cmd_options: '-a'
          # The action files its report as a GitHub issue by default, which needs
          # `issues: write`. The scan itself was passing (FAIL-NEW: 0, PASS: 146)
          # and the job still reported failure -- on "Resource not accessible by
          # integration", i.e. the report step, not the scan. The findings are
          # already uploaded as an artifact below, so issue-filing is redundant;
          # turning it off is preferable to granting a scanner write access to
          # the issue tracker.
          allow_issue_writing: false

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-report
          path: |
            ${{ github.workspace }}/report.html
            ${{ github.workspace }}/report.md

      - name: Stop MCP Server
        if: always()
        run: kill ${{ env.MCP_PID }} || true

  # ============================================
  # Gate: All Jobs Must Pass
  # ============================================
  gate:
    name: CI Gate
    needs: [core-validation, security-audit, lint-and-types, unit-tests, e2e-tests, architecture-validation, package-integrity, codeql-analysis, trivy-scan]
    runs-on: ubuntu-latest
    steps:
      - name: All Checks Passed
        run: echo "✅ All CI checks passed"
