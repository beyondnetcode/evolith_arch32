name: CI/CD

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # sdk/cli imports @evolith/* subpaths that resolve to dist, and its
      # integration tests spawn the built dist/main.js — build the chain AND the
      # CLI before running the tests.
      - name: Build workspace dependencies + CLI
        run: |
          npm run build --workspace @evolith/core-domain
          npm run build --workspace @evolith/core
          npm run build --workspace @evolith/infra-providers
          npm run build --workspace @evolith/mcp-server
          npm run build --workspace sdk/cli

      # CD gate = the smart-cli unit suite (fast, deterministic). The full e2e
      # (env-sensitive: spawns servers, loads rulesets) is covered by the
      # dedicated sdk-cli-ci.yml e2e job + the per-flow E2E playbooks, not here.
      - name: Run unit tests
        run: npm run test:unit
        working-directory: sdk/cli

  test-core-domain:
    name: Test core-domain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # GT-377 AC-3: stateless-Core architecture boundary guard. Fails the build
      # if a *Repository for product/initiative/evidence/decision appears in
      # core-domain (Core is a stateless Evaluation Engine — those are context,
      # not entities — per ADR-0101), and enforces the inner-layer import rules.
      - name: Run core-domain architecture boundary guard (GT-377)
        run: npm run lint:boundaries --workspace @evolith/core-domain

      # GT-382 follow-up: the core-domain OPA integration test loads the real
      # compiled policy.wasm. Build it (pinned opa toolchain) so the test runs
      # end-to-end; it self-skips if the artifact is absent.
      - name: Compile OPA policy to WASM
        run: npm run build:policy

      - name: Run core-domain tests with coverage
        run: npm run test:cov --workspace @evolith/core-domain

      # GT-326: end-to-end governance flow (phase → gate → artifact → verdict)
      # against a real tmpdir satellite, exercising Core's Tracker/agent
      # integration contract (events, webhook dispatch, audit) in CI.
      - name: Run core-domain governance E2E (GT-326)
        run: npm run test:e2e --workspace @evolith/core-domain

  test-core:
    name: Test core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run core barrel contract tests
        run: npm test --workspace @evolith/core

  test-mcp-server:
    name: Test mcp-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Architecture boundary guard: enforces the mcp-server layer hierarchy
      # (domain → application → adapters) on VALUE imports. Parses the import
      # graph only (no type-aware services), so it needs no built workspace deps.
      - name: Run mcp-server architecture boundary guard
        run: npm run lint:boundaries --workspace @evolith/mcp-server

      - name: Build workspace dependencies
        run: |
          npm run build --workspace @evolith/core-domain
          npm run build --workspace @evolith/core
          npm run build --workspace @evolith/infra-providers

      - name: Run mcp-server tests with coverage
        run: npm run test:cov --workspace @evolith/mcp-server

      # GT-330: MCP server dedicated E2E (spawns the live MCP HTTP server)
      - name: Build mcp-server + run E2E
        run: |
          npm run build --workspace @evolith/mcp-server
          npm run --workspace packages/mcp-server test:e2e

  test-core-api:
    name: Test core-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Architecture boundary guard: enforces the core-api layer hierarchy
      # (application → infrastructure → presentation; openapi cross-cutting) on
      # VALUE imports. Parses the import graph only (no type-aware services), so
      # it needs no built workspace deps.
      - name: Run core-api architecture boundary guard
        run: npm run lint:boundaries --workspace core-api

      - name: Build workspace dependencies
        run: |
          npm run build --workspace @evolith/core-domain
          npm run build --workspace @evolith/infra-providers

      - name: Run core-api tests
        run: npm test --workspace core-api

      # GT-330: core-api dedicated E2E (real HTTP surface — health/metrics/v1)
      - name: Run core-api E2E
        run: npm run --workspace core-api test:e2e

  publish-npm:
    name: Publish npm
    needs: [test, test-core-domain, test-core, test-mcp-server, test-core-api]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: |
          npm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}
          npm publish --access public --tag beta
        working-directory: sdk/cli

  docker:
    name: Build & Push Docker
    needs: [test, test-core-domain, test-core, test-mcp-server, test-core-api]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./sdk/cli
          file: ./sdk/cli/Dockerfile
          push: true
          tags: |
            beyondnetperu/evolith-cli:latest
            beyondnetperu/evolith-cli:${{ github.sha }}

  # GT-324: build + push the deployable services to GHCR (GitHub Container
  # Registry). Auth uses the built-in GITHUB_TOKEN — no extra secret required.
  docker-services:
    name: Build & Push Services (GHCR)
    needs: [test, test-core-domain, test-core, test-mcp-server, test-core-api]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # context is the repo root — both Dockerfiles COPY repo-root-relative paths
          - service: core-api
            context: .
            dockerfile: ./apps/core-api/Dockerfile
            image: evolith-core-api
          - service: mcp-server
            context: .
            dockerfile: ./packages/mcp-server/Dockerfile
            image: evolith-mcp-server
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}

  # GT-324: deploy the freshly-pushed images to the Coolify runtime. This job is
  # SAFE to merge without secrets — each step no-ops (with a warning) until the
  # COOLIFY_API_TOKEN + per-service deploy-hook secrets are configured in the
  # repository settings, at which point CD becomes fully automatic.
  deploy:
    name: Deploy services (Coolify)
    needs: [docker-services]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Coolify deploy (core-api)
        env:
          HOOK: ${{ secrets.COOLIFY_COREAPI_DEPLOY_HOOK }}
          TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$HOOK" ] || [ -z "$TOKEN" ]; then
            echo "::warning::COOLIFY_COREAPI_DEPLOY_HOOK / COOLIFY_API_TOKEN not set — skipping core-api deploy. Set them to enable CD (GT-324)."
            exit 0
          fi
          curl --fail --silent --show-error -X GET "$HOOK" -H "Authorization: Bearer $TOKEN"
          echo "core-api deploy triggered"

      - name: Trigger Coolify deploy (mcp-server)
        env:
          HOOK: ${{ secrets.COOLIFY_MCP_DEPLOY_HOOK }}
          TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$HOOK" ] || [ -z "$TOKEN" ]; then
            echo "::warning::COOLIFY_MCP_DEPLOY_HOOK / COOLIFY_API_TOKEN not set — skipping mcp-server deploy. Set them to enable CD (GT-324)."
            exit 0
          fi
          curl --fail --silent --show-error -X GET "$HOOK" -H "Authorization: Bearer $TOKEN"
          echo "mcp-server deploy triggered"
