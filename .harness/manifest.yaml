# ──────────────────────────────────────────────────────────────────────────
# .harness capability manifest
#
# This file makes `.harness` DISCOVERABLE as an official capability provider for
# the Evolith Agent Runtime (ADR-0102, design rule #4). `.harness` remains the
# versioned, auditable, governed mechanism that ACTUALLY runs scripts,
# playbooks, validators, audits and skills — the runtime only discovers what is
# declared here and executes it through `IHarnessPort`
# (packages/agent-runtime: HarnessProcessAdapter).
#
# Each capability declares its CONTRACT and its GOVERNANCE POSTURE so the runtime
# can enforce approval / policy / trazability uniformly:
#   name            unique capability id (referenced by a SkillDescriptor)
#   type            playbook | validator | audit | script | skill | adapter
#   description     human summary
#   entry           path (repo-relative) the runner executes
#   runner          node | opa | shell  (HOW the entry is launched)
#   inputs          declared arguments (informational/loose schema)
#   outputs         declared outputs the capability emits
#   permissions     scopes required to run
#   requiresApproval whether a human must approve before execution (HITL)
#   emitsTrace      whether execution publishes a Tracker trace event
#   requiresPolicy  whether the result must pass OPA/ruleset validation
#   policyRef       (optional) the OPA package to evaluate against
#
# Tenant/product/initiative state is NEVER embedded here. The runtime passes it
# per-execution via env (AGENT_RUNTIME_CONTEXT) so the same capability serves
# every tenant (design rule #8).
# ──────────────────────────────────────────────────────────────────────────
version: 1

capabilities:
  - name: sdlc-phase-gate-validator
    type: validator
    description: >-
      Validate a SDLC phase/gate by checking required vs presented artifacts and
      that every required artifact has at least one associated rule.
    entry: .harness/playbooks/sdlc-phase-gate-validator.mjs
    runner: node
    inputs:
      phase: { type: string, description: "Canonical SDLC phase id (e.g. discovery)" }
      gate: { type: string, description: "Gate id (e.g. prd_readiness)" }
      requiredArtifacts: { type: array, items: { type: string } }
      presentArtifacts: { type: array, items: { type: string } }
    outputs:
      status: { type: string, enum: [passed, blocked, warning, error] }
      missing_artifacts: { type: array, items: { type: string } }
      findings: { type: array }
    permissions: [read:repo, run:validator]
    requiresApproval: false
    emitsTrace: true
    requiresPolicy: true
    policyRef: evolith.phase_gates

  - name: adr-architecture-validator
    type: validator
    description: Validate an ADR against architecture rules and freshness policy.
    entry: .harness/scripts/skills/adr-freshness-monitor.mjs
    runner: node
    inputs:
      adr: { type: string, description: "ADR id or path (e.g. ADR-0102)" }
    outputs:
      status: { type: string }
      findings: { type: array }
    permissions: [read:repo, run:validator]
    requiresApproval: false
    emitsTrace: true
    requiresPolicy: true
    policyRef: evolith.capability_source_interface

  - name: opa-audit
    type: audit
    description: Run an OPA/ruleset audit using the bundled OPA binary.
    entry: .harness/bin/opa
    runner: opa
    inputs:
      argv: { type: array, items: { type: string }, description: "Raw opa subcommand args" }
    outputs:
      status: { type: string }
      findings: { type: array }
    permissions: [read:repo, run:audit]
    requiresApproval: false
    emitsTrace: true
    requiresPolicy: false # the audit IS the policy engine

  - name: topology-compliance-audit
    type: audit
    description: Audit repository compliance against declared topology manifests.
    entry: .harness/playbooks/topology-compliance-audit.mjs
    runner: node
    outputs:
      status: { type: string }
      findings: { type: array }
    permissions: [read:repo, run:audit]
    requiresApproval: false
    emitsTrace: true
    requiresPolicy: false

  - name: requirements-traceability-mapper
    type: skill
    description: Map requirements to artifacts/evidence to surface traceability gaps.
    entry: .harness/scripts/skills/requirements-traceability-mapper.mjs
    runner: node
    outputs:
      status: { type: string }
      findings: { type: array }
    permissions: [read:repo]
    requiresApproval: false
    emitsTrace: true
    requiresPolicy: false

  - name: gap-prioritization-engine
    type: skill
    description: >-
      Read gap-tracking.md, score gaps by impact × urgency and flag stagnant
      gaps with no status change in >30 days. Owned by @po.
    entry: .harness/scripts/skills/gap-prioritization-engine.mjs
    runner: node
    outputs:
      status: { type: string }
      findings: { type: array }
    permissions: [read:repo]
    requiresApproval: false
    emitsTrace: true
    requiresPolicy: false

  - name: self-improving-loop
    type: skill
    description: >-
      Emit a progress-audit snapshot and route harness findings through the
      detect-context-execute-validate-register-learn improvement cycle.
    entry: .harness/scripts/skills/self-improving-loop.mjs
    runner: node
    inputs:
      task: { type: string, description: "Task or audit objective for the loop run" }
      agent: { type: string, description: "Agent id, for example @winston" }
      append: { type: string, description: "Optional JSONL path for approved audit records" }
    outputs:
      status: { type: string, enum: [completed, blocked, failed, partial] }
      risks: { type: array, items: { type: string } }
      next_actions: { type: array, items: { type: string } }
    permissions: [read:repo, write:report]
    requiresApproval: false
    emitsTrace: true
    requiresPolicy: false

  - name: emit-trace
    type: script
    description: >-
      No-op placeholder; the runtime itself publishes Tracker trace events. Kept
      so a 'publish_trace' intent resolves to a governed, declared capability.
    runner: node
    permissions: [write:trace]
    requiresApproval: false
    emitsTrace: true
    requiresPolicy: false

  - name: sdlc-deep-audit
    type: audit
    description: Run SDLC Deep Audit — 8-dimensional executable SDLC evaluation
    entry: .harness/playbooks/sdlc-deep-audit.mjs
    runner: node
    outputs:
      status: { type: string }
      findings: { type: array }
    permissions: [read:repo, run:audit]
    requiresApproval: false
    emitsTrace: true
    requiresPolicy: false

  - name: agents-governance
    type: playbook
    description: Agent Governance Playbook for onboarding and validating new AI agents
    entry: .harness/playbooks/agents-governance-playbook.md
    runner: agent
    permissions: [read:repo]
    requiresApproval: true
    emitsTrace: true
    requiresPolicy: false

  - name: api-governance
    type: playbook
    description: API Governance Playbook to ensure REST and MCP API compliance
    entry: .harness/playbooks/api-governance-playbook.md
    runner: agent
    permissions: [read:repo]
    requiresApproval: true
    emitsTrace: true
    requiresPolicy: false

  - name: document-governance
    type: playbook
    description: Document Governance Playbook to validate bilingual documentation structures
    entry: .harness/playbooks/document-governance-playbook.md
    runner: agent
    permissions: [read:repo]
    requiresApproval: true
    emitsTrace: true
    requiresPolicy: false

  - name: modular-monolith-evolution
    type: playbook
    description: Modular Monolith Evolution Playbook for breaking monoliths into modules
    entry: .harness/playbooks/modular-monolith-evolution-playbook.md
    runner: agent
    permissions: [read:repo]
    requiresApproval: true
    emitsTrace: true
    requiresPolicy: false

  - name: winston-audit
    type: playbook
    description: Winston Architecture Audit Playbook
    entry: .harness/playbooks/winston-audit-playbook.md
    runner: agent
    permissions: [read:repo]
    requiresApproval: true
    emitsTrace: true
    requiresPolicy: false

  - name: self-improving-loop-playbook
    type: playbook
    description: Playbook for the detect-context-execute-validate-register-learn improvement cycle
    entry: .harness/playbooks/self-improving-loop.md
    runner: agent
    permissions: [read:repo, write:report]
    requiresApproval: true
    emitsTrace: true
    requiresPolicy: false

  - name: topology-compliance-audit-playbook
    type: playbook
    description: Playbook to evaluate completeness of each topology Bounded Context against the canonical exemplar
    entry: .harness/playbooks/topology-compliance-audit.md
    runner: agent
    permissions: [read:repo]
    requiresApproval: true
    emitsTrace: true
    requiresPolicy: false
