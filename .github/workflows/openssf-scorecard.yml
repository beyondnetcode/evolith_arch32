# GT-597 — OpenSSF Scorecard as an automated, external, numeric posture score.
#
# WHY THIS EXISTS
# Until now there was no continuous measure of repository or supply-chain posture,
# so posture defects were only ever found by a human audit. The 2026-07-26 audit
# had to discover BY HAND that `enforce_admins=false`, that no required check is a
# security check, that `develop` is unprotected, and that 0 of 8 published packages
# carried `dist.attestations`. Every one of those is a check Scorecard scores
# automatically — Branch-Protection, Code-Review, Pinned-Dependencies, CI-Tests,
# Token-Permissions, Signed-Releases — and it emits a number that regresses
# visibly, which prose does not.
#
# NOT A REQUIRED CHECK, DELIBERATELY
# This workflow is intentionally NOT wired into branch protection. Making a score
# a merge gate is a branch-protection decision that belongs to the repository
# owner, not to the workflow that produces the score. It reports; the owner
# decides whether it blocks.
#
# EVERY ACTION IS PINNED BY COMMIT SHA, NOT BY TAG
# The repository's own audit flagged unpinned third-party actions, and
# Pinned-Dependencies is one of the checks scored below — a Scorecard workflow
# that floats on mutable tags would be scoring the repository while failing the
# check itself. Each SHA below was resolved from the upstream tag and verified to
# exist. Update them together with the trailing version comment.

name: OpenSSF Scorecard

on:
  schedule:
    # Weekly, Tuesdays 05:27 UTC. An off-the-hour minute avoids the scheduling
    # spike that makes cron-triggered runs on GitHub-hosted runners queue.
    - cron: '27 5 * * 2'
  # Re-score immediately when branch protection changes, rather than waiting up to
  # a week. This is the trigger that makes the specific regression the audit found
  # by hand (`enforce_admins=false`, unprotected `develop`) visible on the day it
  # happens.
  branch_protection_rule:
  workflow_dispatch:

# Default to nothing; the single job widens only to what it needs. This is itself
# the Token-Permissions check.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest

    # Scorecard's scheduled analysis only makes sense on the default branch: the
    # published score is a property of the repository, not of a topic branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch'

    permissions:
      # Upload the SARIF result to code scanning, which is what makes a regression
      # show up as an alert instead of buried in a log.
      security-events: write
      # OIDC token used to publish the score to the public OpenSSF API. Required
      # by `publish_results: true`.
      id-token: write
      # Read the workflow-run history — Scorecard's CI-Tests and Dangerous-Workflow
      # checks inspect past runs, and score lower without this.
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required by Scorecard: the checkout credentials must not persist into
          # the analysis step. Leaving them in place is itself a finding.
          persist-credentials: false

      - name: Run Scorecard analysis
        id: scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # Publishes the score to the public OpenSSF API, which is what backs the
          # badge and makes the number externally checkable rather than
          # self-asserted. Valid here because this repository is public.
          publish_results: true

      # Retained separately from code scanning because code-scanning alerts are
      # deduplicated and aged out, while the artifact is the raw per-run evidence
      # a score regression gets diffed against.
      - name: Upload results as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: scorecard-results.sarif
          retention-days: 90

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: scorecard-results.sarif
