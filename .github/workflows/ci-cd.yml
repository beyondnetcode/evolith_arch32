name: CI/CD

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        working-directory: sdk/cli

      - name: Build
        run: npm run build
        working-directory: sdk/cli

      - name: MCP smoke
        run: npm run mcp:smoke
        working-directory: sdk/cli

  test-core-domain:
    name: Test core-domain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run core-domain tests with coverage
        run: npm run test:cov --workspace @evolith/core-domain

  test-mcp-server:
    name: Test mcp-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build workspace dependencies
        run: |
          npm run build --workspace @evolith/core-domain
          npm run build --workspace @evolith/core

      - name: Run mcp-server tests with coverage
        run: npm run test:cov --workspace @evolith/mcp-server

  test-core-api:
    name: Test core-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build workspace dependencies
        run: npm run build --workspace @evolith/core-domain

      - name: Run core-api tests
        run: npm test --workspace core-api

  publish-npm:
    name: Publish npm
    needs: [test, test-core-domain, test-mcp-server, test-core-api]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: |
          npm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}
          npm publish --access public --tag beta
        working-directory: sdk/cli

  docker:
    name: Build & Push Docker
    needs: [test, test-core-domain, test-mcp-server, test-core-api]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./sdk/cli
          file: ./sdk/cli/Dockerfile
          push: true
          tags: |
            beyondnetperu/evolith-cli:latest
            beyondnetperu/evolith-cli:${{ github.sha }}
