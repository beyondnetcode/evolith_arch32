replicaCount: 2

image:
  repository: beyondnetcode/evolith-bff
  pullPolicy: IfNotPresent
  tag: "1.1.0"

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingressRoute:
  enabled: true
  entryPoints:
    - web
    - websecure
  host: api.evolith.beyondnetcode.com
  pathPrefix: /bff

opa:
  enabled: true
  image: openpolicyagent/opa:0.65.0
  bundle:
    url: "http://ums-minio:9000/opa-bundles/bundle.tar.gz"
    pollingMinDelaySeconds: 10
    pollingMaxDelaySeconds: 20
