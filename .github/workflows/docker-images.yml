name: Docker Images (registry build/push)

# Builds and pushes the deployable service images to GHCR for Kubernetes/Helm
# deployments. Coolify builds from git directly and does NOT need this; K8s does
# (the Helm charts reference registry images).
#
# Triggers are intentionally conservative — no build on every push:
#   - workflow_dispatch: manual run (pick the tag).
#   - push tags `v*`: release builds, tagged with the git tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (defaults to short SHA)"
        required: false
        type: string
  push:
    tags:
      - "v*"

# Scorecard Token-Permissions: read-only by default; the build job below is the
# one that pushes to GHCR and declares `packages: write` itself.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: evolith-agent-runtime
            dockerfile: src/apps/agent-runtime-api/Dockerfile
          - name: evolith-core-api
            dockerfile: src/apps/core-api/Dockerfile
          - name: evolith-mcp
            dockerfile: src/packages/mcp-server/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          # `type=ref,event=tag` publishes the git tag VERBATIM — `v1.1.0`, with
          # the leading v. The Helm charts ask for the bare semver
          # (`evolith-mcp` → `1.1.0`), so no release this workflow has ever run
          # could satisfy `helm install` with the default values: the chart named
          # a tag the pipeline is structurally incapable of producing. Adding
          # `type=semver` publishes `1.1.0` and `1.1` alongside `v1.1.0`, which
          # is what the charts reference.
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Build context is the repository root for all services (the Dockerfiles
          # COPY repo-relative paths; agent-runtime builds the workspace packages).
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
